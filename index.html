<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3人制 大富豪</title>
<style>






















:root{
  --bg:#0b3d2e;
  --panel:#123f35;
  --panel-dark:#0a2f27;
  --line:#ffffff22;
  --text:#f7f7f2;
  --muted:#c8d7d1;
  --gold:#ffd166;
  --danger:#ff6b6b;
  --ok:#70e1a1;
}

*{box-sizing:border-box}
html,body{max-width:100%}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:radial-gradient(circle at 50% 20%,#17624c,var(--bg));
}
button{font:inherit}

.app{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:14px;
}

/* ===== Header / status ===== */
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
.title{
  font-size:clamp(22px,4vw,34px);
  font-weight:900;
}
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0;
}
.btn{
  border:0;
  border-radius:10px;
  padding:10px 16px;
  min-height:40px;
  background:#f1f5f3;
  color:#16332a;
  font-weight:800;
  cursor:pointer;
  text-align:center;
}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--gold)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.modeActive{
  outline:3px solid var(--gold);
  box-shadow:0 0 0 2px #0003 inset;
}

#spyModeBtn{
  background:#4F46E5;
  color:#fff;
  border:3px solid #fff;
}
#spyModeBtn:hover{background:#6366F1}
#spyModeBtn.modeActive{border:0}

#strongModeBtn{
  background:#000;
  color:#fff;
  border:3px solid #fff;
}
#strongModeBtn:hover{background:#1F2937}
#strongModeBtn.modeActive{border:0}

.panel,.statusbar{
  border:1px solid var(--line);
  border-radius:14px;
  background:#0a2f27cc;
  box-shadow:0 10px 30px #0004;
}
.statusbar{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  padding:10px 14px;
}
.badge{
  padding:4px 9px;
  border-radius:999px;
  background:#ffffff12;
}
.badge.hot{background:#8b1e3f}
.volumeControl{
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.volumeControl input{width:120px}

/* ===== Score table ===== */
.scoreHistory{
  margin-top:10px;
  padding:10px 14px;
  font-size:13px;
}
.scoreHistory.scrollFixed{
  max-height:170px;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.scoreHistory table{
  width:100%;
  border-collapse:collapse;
}
.scoreHistory th,.scoreHistory td{
  padding:5px 7px;
  border-bottom:1px solid #ffffff18;
  text-align:center;
}
.scoreHistory th:first-child,.scoreHistory td:first-child{text-align:left}
.scoreHistory thead,
.scoreHistory thead tr,
.scoreHistory thead th{
  position:static;
}
.scoreHistory tr.setTotal td{
  font-weight:1000;
  background:#ffffff10;
  border-top:2px solid #ffffff55;
  border-bottom:4px solid #d8b45a;
}
#scoreHistory tr.grandTotal{
  position:sticky;
  bottom:0;
  z-index:3;
}
#scoreHistory tr.grandTotal td{
  font-weight:1000;
  background:#123f35;
  border-top:0;
  border-bottom:0;
}

/* ===== Board / CPU ===== */
.table{
  display:grid;
  grid-template-columns:.58fr 1fr .58fr;
  gap:8px;
  margin-top:10px;
  align-items:center;
}

.player{
  min-width:0;
  min-height:48px;
  padding:6px 9px;
  overflow:hidden;
}
.player.active{outline:2px solid var(--gold)}

#p1,#p2{
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:100%;
  min-width:0;
}

.cpuInfoRow{
  display:grid;
  grid-template-columns:max-content max-content max-content 3em 52px;
  justify-content:center;
  align-items:center;
  column-gap:16px;
  width:100%;
  min-width:0;
}
.cpuInfoRow .name{display:contents}
.cpuNameText,
.cpuModeLabel,
.player .role,
.player .count,
.player .small{
  margin:0;
  padding:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  text-align:center;
  font-size:17px;
  line-height:1.2;
  font-weight:800;
}
.cpuNameText,.cpuModeLabel{font-weight:900}
.cpuModeLabel.strongModeText{color:#ff3b30}
.player .role{color:var(--gold)}
#role0{
  color:var(--gold);
  font-weight:800;
}
.player .count{
  width:3em;
  min-width:3em;
  max-width:3em;
  font-weight:1000;
}
.player .small{
  width:52px;
  min-width:52px;
  max-width:52px;
  color:var(--muted);
}

/* Spy hand is independent from CPU info grid */
.opponentHand{
  display:none;
  width:100%;
  max-width:100%;
  min-width:0;
  margin-top:6px;
}
.spyMode .opponentHand{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  align-content:flex-start;
  gap:3px;
}
.spyMode.player{
  height:auto;
  max-height:none;
  overflow:hidden;
}
.opponentHand .card.spyCard{
  flex:0 0 auto;
  width:45px;
  height:67px;
  min-width:45px;
  min-height:67px;
  padding:4px;
  border-width:1px;
  border-radius:6px;
  font-size:13px;
  box-shadow:0 2px 5px #0005;
  cursor:default;
}
.opponentHand .card.spyCard .suit{font-size:16px}
.opponentHand .card.spyCard.joker > span:first-child,
.opponentHand .card.spyCard.joker > span:last-child{
  font-size:14px;
  font-family:inherit;
  font-weight:inherit;
  letter-spacing:normal;
}
.opponentHand .card.spyCard.joker > span:first-child{
  max-width:100%;
  font-size:11px;
  letter-spacing:-.2px;
}
.opponentHand .card.spyCard.joker > span:last-child{bottom:3px}

/* ===== Center / pile ===== */
.center{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:138px;
  height:138px;
  padding:4px 7px;
  overflow:visible;
  text-align:center;
}
.pile{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:123px;
  height:123px;
  overflow:visible;
}
.pile-play{
  position:absolute;
  left:50%;
  top:50%;
  display:flex;
  align-items:center;
  gap:7px;
  filter:brightness(.86);
  transition:.18s transform;
}
.pile-play.latest{
  filter:none;
  z-index:20;
}

/* v250 PC actual pile size */
.pile-play .card{
  width:58px;
  height:84px;
  min-width:58px;
  min-height:84px;
  padding:6px;
  border-width:2px;
  border-radius:9px;
  font-size:14px;
  pointer-events:none;
}
.pile-play .card .suit{font-size:22px}

.pile-turn-label{
  position:absolute;
  left:50%;
  top:calc(50% + 58px);
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:13px;
  color:var(--muted);
}
.pilelabel{
  margin-bottom:2px;
  color:var(--gold);
  font-size:17px;
  font-weight:900;
  line-height:1.05;
}
.message{
  min-height:20px;
  margin-top:2px;
  color:#fff;
  font-size:15px;
  line-height:1.1;
}

/* ===== Hand / cards ===== */
.handpanel{
  margin-top:12px;
  padding:14px;
}
#state0{
  margin-left:1em;
}
.handHeader{
  display:grid;
  grid-template-columns:1fr;
  gap:4px;
}
#hint{
  grid-row:2;
  width:100%;
  min-height:1.3em;
  margin:0;
  text-align:left;
}
.hand{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  min-height:132px;
  margin-top:1em;
}

.card{
  width:68px;
  height:100px;
  padding:6px;
  border:2px solid #ddd;
  border-radius:9px;
  background:#fff;
  color:#111;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  font-weight:900;
  line-height:normal;
  box-shadow:0 4px 10px #0005;
  cursor:pointer;
  user-select:none;
  transition:.12s transform,.12s box-shadow;
}
.card.red{color:#c22}
.card.black{color:#111}
.card.joker{
  position:relative;
  background:linear-gradient(145deg,#fff,#ffe6a6);
  color:#7a2a83;
}
.card.joker > span:first-child{
  position:absolute;
  left:50%;
  top:6px;
  transform:translateX(-50%);
  display:block;
  width:max-content;
  max-width:calc(100% - 4px);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:clip;
  text-align:center;
  font:inherit;
  letter-spacing:normal;
  line-height:1;
}
.card.joker > span:last-child{
  position:absolute;
  left:50%;
  bottom:6px;
  transform:translateX(-50%);
  display:block;
  width:max-content;
  max-width:calc(100% - 4px);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:clip;
  text-align:center;
  line-height:1;
}
.card.joker .suit{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  margin:0;
  text-align:center;
}
.card > span:first-child{text-align:left}
.card .suit{
  font-size:24px;
  text-align:center;
}
.card > span:last-child{text-align:right}
.card.selected{
  transform:translateY(-13px);
  outline:3px solid var(--gold);
  box-shadow:0 12px 20px #0007;
}
.card.receivedFlash{
  animation:receivedCardFlash .36s linear infinite;
  outline:4px solid #ffe066;
  box-shadow:0 0 22px #ffe066,0 4px 10px #0005;
}
.card.mini{
  width:58px;
  height:84px;
  font-size:14px;
  cursor:default;
}
.card.mini .suit{font-size:22px}
@keyframes receivedCardFlash{
  0%,100%{opacity:1;transform:translateY(0) scale(1)}
  50%{opacity:.28;transform:translateY(-4px) scale(1.04)}
}

/* Exchange cards use the exact same internal card layout as hand cards */
.exchangeCards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  gap:7px;
  margin:14px 0;
}
.exchangeCards .card{
  width:68px;
  height:100px;
  min-width:68px;
  min-height:100px;
  padding:6px;
  font-size:16px;
}
.exchangeCards .card .suit{font-size:24px}
.exchangeAction{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  margin-top:10px;
}

/* ===== Log ===== */
.log{
  margin-top:12px;
  padding:12px;
  max-height:180px;
  overflow:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  font-size:13px;
}
.log div{
  padding:3px 0;
  border-bottom:1px solid #ffffff0d;
}

/* ===== Effects ===== */
.effectOverlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:2147483647;
  background:#0002;
  isolation:isolate;
}
.effectOverlay.show{display:flex}
.effectText{
  position:relative;
  z-index:1;
  font-size:clamp(42px,9vw,92px);
  font-weight:1000;
  letter-spacing:.08em;
  text-align:center;
  text-shadow:0 5px 18px #000,0 0 28px currentColor;
  animation:effectPop .8s ease both;
}
.effectText.eight{color:#ff9f1c}
.effectText.revolution{color:#ff3b30}
.effectText.counter{color:#c77dff}
.effectText.sp3{color:#4dabf7}
.effectText.foul{color:#ff6b6b}
.effectText.coup{color:#ffd166}
@keyframes effectPop{
  0%{opacity:0;transform:scale(.65)}
  18%{opacity:1;transform:scale(1.08)}
  70%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.96)}
}

/* ===== Modal base ===== */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#000d;
}
.modal.show{display:flex}
.modal.starterLight,
.modal.resultLight,
.modal.exchangeLight{
  background:transparent;
  pointer-events:none;
}
.modal.starterLight .modalbox,
.modal.resultLight .modalbox,
.modal.exchangeLight .modalbox{
  pointer-events:auto;
  box-shadow:0 12px 36px #0008;
}

.modalbox{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  padding:20px;
  border:1px solid #ffffff33;
  border-radius:16px;
  background:var(--panel);
  text-align:left;
  -webkit-overflow-scrolling:touch;
}
.modalbox h1,.modalbox h2,.modalbox h3{
  text-align:center;
}
.modalbox h2{margin-top:0}
.modalbox p,
.modalbox .rules,
.modalbox .note,
.modalbox .aiNote{
  text-align:left;
}
.modalbox button,.modalbox .btn{text-align:center}
.modeLockNote{
  color:var(--muted);
  font-weight:700;
}

/* Setup modal widths */
#modalbox.setStartBox,
#modalbox.starterChoiceBox,
#modalbox.modeConfirmNarrow,
#modalbox.gameResultBox{
  width:max-content;
  max-width:calc(100vw - 32px);
  min-width:0;
}
#modalbox.starterChoiceBox > p,
#modalbox.modeConfirmNarrow > p,
#modalbox.gameResultBox > p:not(.coupMessage){
  white-space:nowrap;
}

/* Every exchange modal has the same seven-card width */
#modalbox.exchangeSevenWide{
  width:600px;
  min-width:600px;
  max-width:600px;
}

/* Latest requested rules width */
#modalbox.rulesHalfWidth{
  width:75%;
  max-width:585px;
}
#modalbox.rulesHalfWidth #rulesClose{
  display:block;
  width:max-content;
  margin-left:auto;
  margin-right:auto;
}

.setStartArea{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  margin:12px 0;
}
.starterChoiceControls{justify-content:center}

/* Result modal */
.resultRanks{
  display:grid;
  grid-template-columns:max-content max-content max-content max-content;
  justify-content:center;
  align-items:center;
  column-gap:14px;
  row-gap:5px;
  margin:10px auto;
  width:max-content;
  max-width:100%;
}
.resultRanks > div{display:contents}
.resultPlace,.resultName,.resultRole,.resultPoints{
  white-space:nowrap;
  text-align:center;
}
.gameResultBox .scoreHistory{
  width:max-content;
  max-width:100%;
  margin-left:auto;
  margin-right:auto;
}
.gameResultBox .setResultScoreScroll{
  display:block;
  width:100%;
  max-width:100%;
  margin:14px 0;
  overflow-x:auto;
  overflow-y:hidden;
  background:#082c24;
  -webkit-overflow-scrolling:touch;
}
.gameResultBox .setResultScoreScroll h3{
  margin-top:0;
}
.gameResultBox .setResultScoreScroll table{
  width:max-content;
  min-width:100%;
}
.gameResultBox > p.coupMessage{
  width:100%;
  max-width:none;
  margin-left:0;
  margin-right:0;
  text-align:center;
}
.resultActions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:8px;
  width:100%;
  margin-top:10px;
}
.resultActions.setFinishedActions{
  justify-content:flex-start;
  text-align:left;
}
.resultStrongBtn{
  border:3px solid #fff !important;
  background:#000 !important;
  color:#fff !important;
}
.resultStrongBtn:hover{background:#1F2937 !important}

/* Rules / optional AI editor */
.rules{
  color:#eaf4f0;
  font-size:14px;
  line-height:1.65;
}
.aiGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.aiField{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.aiField label{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}
.aiField input,.aiField textarea,.aiField select{
  width:100%;
  padding:8px;
  border:1px solid #ffffff33;
  border-radius:8px;
  background:#082c24;
  color:#fff;
  font:inherit;
}
.aiField textarea{
  min-height:190px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  line-height:1.45;
  tab-size:2;
}
.aiWide{grid-column:1/-1}
.aiNote{
  padding:10px;
  border-radius:10px;
  background:#ffffff0b;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

body.exchangePhase .modal{pointer-events:none}
body.exchangePhase .modalbox{pointer-events:auto}
body.exchangePhase .top{
  position:relative;
  z-index:1001;
}

.footer{
  margin:15px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

/* ===== Tablet / phone ===== */
@media (max-width:768px){
  body{
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right));
    padding-bottom:max(12px,env(safe-area-inset-bottom));
    font-size:14px;
  }
  .app{padding:10px}

  .top > .controls{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    width:100%;
  }
  .top > .controls > .btn,
  .top > .controls > .volumeControl{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-width:0;
    max-width:none;
    height:46px;
    min-height:46px;
    margin:0;
    padding:8px 10px;
    font-size:14px;
    white-space:nowrap;
  }
  .top > .controls > .volumeControl{gap:5px}
  .top > .controls > .volumeControl input{
    width:62px;
    min-width:0;
  }
  .top > .controls > .volumeControl #volumeValue{
    min-width:34px;
    text-align:right;
  }

  .scoreHistory.scrollFixed{max-height:150px}
  .scoreHistory table{min-width:420px}
  #scoreHistory{overflow:auto}

  /* CPU1 and CPU2 both above the center field */
  .table{
    grid-template-columns:1fr;
    grid-template-rows:auto auto auto;
    gap:8px;
  }
  #p1{grid-column:1;grid-row:1}
  #p2{grid-column:1;grid-row:2}
  .center{grid-column:1;grid-row:3}

  #p1,#p2{
    min-height:auto;
    padding:8px;
  }
  .cpuInfoRow{
    grid-template-columns:max-content max-content max-content 3em 48px;
    column-gap:14px;
  }
  .cpuNameText,
  .cpuModeLabel,
  .player .role,
  .player .count,
  .player .small{
    font-size:15px;
  }
  .player .small{
    width:48px;
    min-width:48px;
    max-width:48px;
  }

  .opponentHand .card.spyCard{
    position:relative;
    width:35px;
    height:52px;
    min-width:35px;
    min-height:52px;
    padding:3px;
    font-size:20.25px;
    display:block;
  }
  .opponentHand .card.spyCard > span:first-child{
    position:absolute;
    left:3px;
    top:2px;
    text-align:left;
  }
  .opponentHand .card.spyCard > span:last-child{
    display:none;
  }
  .opponentHand .card.spyCard .suit{
    position:absolute;
    right:3px;
    bottom:2px;
    font-size:26.325px;
    line-height:1;
    text-align:right;
  }
  .opponentHand .card.spyCard.joker .suit{
    left:50%;
    top:auto;
    right:auto;
    bottom:3px;
    transform:translateX(-50%);
    text-align:center;
  }

  .center{
    min-height:180px;
    height:180px;
    padding:4px 7px 8px;
  }
  .pile{
    min-height:150px;
    height:150px;
  }

  /* v250 smartphone pile size */
  .pile-play .card{
    width:78px;
    height:117px;
    min-width:78px;
    min-height:117px;
    padding:5px;
    border-width:2px;
    border-radius:10px;
    font-size:24px;
  }
  .pile-play .card .suit{font-size:39px}
  .exchangeCards .card{
    flex:0 0 calc((100% - 21px) / 4);
    width:calc((100% - 21px) / 4);
    min-width:0;
    max-width:calc((100% - 21px) / 4);
    height:auto;
    min-height:0;
    aspect-ratio:78 / 117;
    padding:5px;
    border-width:2px;
    border-radius:10px;
    font-size:24px;
    align-self:flex-start;
  }
  .exchangeCards .card .suit{font-size:39px}
  .exchangeCards .card.joker > span:first-child,

function positionEffectOverlayForViewport(){

async function ensureAudioContextRunning(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();

for(const ev of ['pointerdown','touchstart','click','keydown']){

}

async function playSound(type){
  try{
    await ensureAudioContextRunning();
    if(!audioCtx||audioCtx.state!=='running')return;
    const now=audioCtx.currentTime;
    const patterns={
      play:[[330,0,.07,'sine'],[440,.065,.08,'sine']],
      pass:[[220,0,.11,'triangle'],[165,.09,.16,'triangle']],
      eight:[[520,0,.06,'square'],[780,.06,.08,'square'],[1040,.13,.13,'square']],
      revolution:[[260,0,.08,'sawtooth'],[390,.07,.08,'sawtooth'],[520,.14,.09,'sawtooth'],[780,.22,.18,'sawtooth']],
      sp3:[[880,0,.07,'triangle'],[660,.07,.08,'triangle'],[990,.15,.15,'square']],
      foul:[[180,0,.10,'sawtooth'],[120,.09,.16,'square'],[90,.20,.20,'sawtooth']]

      const peak=basePeak*SOUND_VOLUME;
      g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(Math.max(.0001,peak),now+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,now+delay+dur);

}

      for(const suit of naturalSuitList){
        const idx=remaining.indexOf(suit);
        if(idx<0)return false;
        remaining.splice(idx,1);
      }
      if(remaining.length>jokerCount)return false;
    }

}

function allLegal(player){
  if(G.pile&&player.passed)return [];
  const h=player.hand,out=[],seen=new Set();
  for(const cs of combinations(h)){
    for(const a of analyses(cs)){
      if(!compatible(a))continue;
      const k=moveAnalysisKey(a);
      if(seen.has(k))continue;

function moveLeavesOnlyFoulCards(player,move){
  // 【絶対】ある手を出した結果、残り手札が反則上がり対象のカードだけになる手は出さない。
  // 革命手なら、残り札は革命後の状態（2は可、3は反則）で評価する。

function renderPile(){
  const el=$('#pile');el.innerHTML='';
  const hist=G.pileHistory||[];
  if(!G.pile||!hist.length){$('#pileLabel').textContent='場は空です';return}
  const shown=hist.slice(-2);
  shown.forEach((entry,idx)=>{
    const wrap=document.createElement('div');
    const latest=idx===shown.length-1;
    wrap.className=`pile-play${latest?' latest':''}`;
    // 直近2手を横に寄せ、前の手は約80%に縮小してカード端が少し重なるように表示する。
    const hasPrevious=shown.length===2;
    // スマホ縦画面では直近2手が接触しないよう、横方向だけ少し離す。
    // PC・タブレット横画面・スマホ横画面の配置は従来のまま。
    const portraitPhone=
      window.matchMedia&&
      window.matchMedia('(max-width: 768px) and (orientation: portrait)').matches;
    const x=hasPrevious
      ?(portraitPhone?(latest?34:-42):(latest?30:-38))
      :0;
    const y=hasPrevious?(latest?6:-4):0;
    let scale=latest?1:.8;

    // スマホでは、枚数の多い階段が場枠からはみ出さないよう、
    // 現在の場枠幅に対してぎりぎり収まる倍率まで自動縮小する。
    if(window.matchMedia&&window.matchMedia('(max-width: 768px)').matches&&entry.type==='straight'){
      const centerEl=document.querySelector('.center');
      const centerWidth=centerEl?centerEl.clientWidth:window.innerWidth;
      // 横画面では場札カードが58pxになるため、実際のCSS幅に合わせて中央補正する。
      // ここを78px固定にすると長い階段ほど幅を過大評価し、左へ寄ってしまう。
      const landscapePhone=window.matchMedia('(max-width: 768px) and (orientation: landscape)').matches;
      const narrowPhone=window.matchMedia('(max-width: 480px)').matches;
      const cardWidth=landscapePhone?58:(narrowPhone?75:78);
      const gap=7;
      const naturalWidth=entry.cards.length*cardWidth+Math.max(0,entry.cards.length-1)*gap;
      const usableWidth=Math.max(120,centerWidth-20);
      const fitScale=Math.min(1,usableWidth/naturalWidth);
      scale*=fitScale;

      // 長い階段は「左端を中央基準に置く」のではなく、
      // グループ全体の中心が場の中央に来るよう補正する。
      const scaledWidth=naturalWidth*scale;
      const centerCorrection=-(scaledWidth/2);
      wrap.style.left='50%';
      wrap.style.transform=`translate(${centerCorrection + x}px,calc(-50% + ${y}px)) scale(${scale})`;
      wrap.style.transformOrigin='left center';
    }else{
      wrap.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`;
      wrap.style.transformOrigin='center center';
    }
    wrap.style.zIndex=String(10+idx);
    // 場札はminiカードとして生成しない。
    // 手札と同じ通常カード構造を使い、場札専用CSSでサイズだけ変更する。
    orderedPileCards(entry).forEach(c=>wrap.append(renderCard(c,false)));
    el.append(wrap);
  });

}

function clearPile(starter,reason){
  // 場が流れる直前のパス状況を保持する。
  const lastPile=G.pile;
  const lastLead=G.lead;
  const passers=G.trickPassers
    ? [...G.trickPassers]
    : G.players.map((p,j)=>({p,j}))
        .filter(o=>o.j!==lastLead&&!o.p.finished&&o.p.passed)
        .map(o=>o.j);

  G.lastClearPassContext=(lastPile&&lastLead!==null)
    ?{
        leader:lastLead,
        type:lastPile.type,
        n:lastPile.n,
        rank:lastPile.rank,
        cardIds:(lastPile.cards||[]).map(c=>c.id),
        passers,
        starter,
        locked:!!G.lock
      }
    :null;

  G.pile=null;
  G.pileHistory=[];
  G.lock=null;
  G.eightCutPending=false;
  // 平民/貧民間の革命返し禁止は「場が流れるまで」なので、ここで解除する。
  G.commonPoorRevolutionLock=0;
  G.commonPoorNoLeadRevolutionOnce=false;

  G.players.forEach(p=>p.passed=false);
  G.trickPassers=new Set();

  G.turn=G.players[starter].finished?nextActive(starter,true):starter;
  G.lead=null;
  addLog(`${reason}。${playerLabel(G.turn)}から開始`);
}

function allOtherActivePlayersPassedThisTrick(){
  if(!G.pile||G.lead===null)return false;
  if(!G.trickPassers)G.trickPassers=new Set();
  // 旧来のpassedフラグが立っている場合も、同じトリックのパス履歴として補完する。
  G.players.forEach((p,i)=>{
    if(i!==G.lead&&!p.finished&&p.passed)G.trickPassers.add(i);
  });
  const others=G.players.map((p,i)=>({p,i}))
    .filter(o=>!o.p.finished&&o.i!==G.lead);
  if(!others.length)return false;
  const passers=G.trickPassers||new Set();
  return others.every(o=>passers.has(o.i));
}

function checkFlow(){
  if(!G.pile)return false;
  if(allOtherActivePlayersPassedThisTrick()){
    const s=G.lead;
    clearPile(s,'場が流れました');
    return true;
  }
  return false;
}

function passWillClearPile(){

async function finishCpuPass(i){

function cpuPassWouldGiveOpponentImmediateFinish(i){
  if(!G.pile)return false;

  // 現在局面から「このCPUがパスした直後」の局面だけを仮想的に作る。
  const afterPass=certainSimApplyPass(cloneCertainSimFromGame(),i);
  const next=afterPass.turn;
  if(next===i)return false;
  const opponent=afterPass.players[next];
  if(!opponent||opponent.finished||!opponent.hand.length)return false;

  // 例外：自分と次の相手が平民・貧民の組み合わせで、富豪がまだ上がっていない場合はパスを許可する。
  const selfRole=G.players[i].role;
  const oppRole=G.players[next].role;
  const commonPoorPair=
    (selfRole==='平民'&&oppRole==='貧民')||
    (selfRole==='貧民'&&oppRole==='平民');
  const richStillPlaying=G.players.some(p=>p.role==='富豪'&&!p.finished);
  if(commonPoorPair&&richStillPlaying)return false;

  // 次の相手が、その1手で残り手札をすべて合法・非反則で出し切れるならパス禁止。
  for(const a of analysesInState(opponent.hand,afterPass.revolution)){
    if(a.cards.length!==opponent.hand.length)continue;
    if(!certainSimCompatible(afterPass,a))continue;
    if(isFoulFinishInState(a,afterPass.revolution))continue;
    return true;
  }
  return false;
}

function cpuStrategicPassForbiddenByAbsolute(i){
  const me=G.players[i];
  if(!me||me.finished||!G.pile)return false;

  const active=G.players.map((p,j)=>({p,j})).filter(o=>!o.p.finished);

  // 1対1で相手残り3枚以下ならパスしない。
  if(
    active.length===2&&
    active.some(o=>o.j!==i&&o.p.hand.length<=3)
  )return true;

  const richIndex=G.players.findIndex(p=>p.role==='富豪');
  const rich=richIndex>=0?G.players[richIndex]:null;
  const richStillPlaying=!!rich&&!rich.finished;

  // 平民または貧民の残り3枚以下に対して富豪はパスしない。
  if(
    me.role==='富豪'&&
    G.players.some((p,j)=>
      j!==i&&!p.finished&&
      (p.role==='平民'||p.role==='貧民')&&
      p.hand.length<=3
    )
  )return true;

  // 富豪残り3枚以下・未パスなら、平民/貧民は原則パスしない。
  // ただしもう一方の平民/貧民がこのトリックですでに出札していればパス可。
  if(
    richStillPlaying&&
    rich.hand.length<=3&&
    !rich.passed&&
    (me.role==='平民'||me.role==='貧民')
  ){
    const mateIndex=G.players.findIndex((p,j)=>
      j!==i&&!p.finished&&(p.role==='平民'||p.role==='貧民')
    );
    const mateHasPlayed=
      mateIndex>=0&&
      (G.pileHistory||[]).some(entry=>entry.player===mateIndex);
    if(!mateHasPlayed)return true;
  }

  return false;
}

async function cpuTryPass(i,currentLegal=null){
  // CPUの全パス経路をここに集約する。
  // 空場ではログ・効果音・passedフラグを一切発生させない。
  if(!G.pile)return false;
  const p=G.players[i];

  // 通常は従来どおりルール上の合法手を見る。
  // ただし呼び出し側から「絶対禁止適用後の候補」が渡された場合は、
  // その候補だけを「実際に出せる手」として扱う。
  // これにより、たとえば相手のスペード3が確定していてJK単騎が絶対禁止なのに、
  // rawな合法手としてJKが存在するためパスまで禁止されるデッドロックを防ぐ。
  const hasAnyLegalReply=Array.isArray(currentLegal)
    ? currentLegal.length>0
    : allLegal(p).length>0;
  // 【絶対】自分がパスすると、次の相手がその1手で上がれる場合はパスしない。
  // ただしこれは「出せる手があるのにパスする」場合だけ適用する。
  // 合法な応手が1つもない場合はパスが強制なので、この禁止条件では止めない。
  // 平民↔貧民の組み合わせで富豪が未上がりの場合も、従来どおり禁止を適用しない。
  if(hasAnyLegalReply&&cpuPassWouldGiveOpponentImmediateFinish(i))return false;

  // どの特殊パス経路から呼ばれても、絶対パス禁止条件を最後にすり抜けないよう共通化する。
  if(hasAnyLegalReply&&cpuStrategicPassForbiddenByAbsolute(i))return false;

  // 【絶対】富豪6枚以下の確定勝ち阻止探索で、
  // 「このパスをすると富豪の確定勝ちを許す」と判定され、
  // かつ他に出せる手がある場合はパスしない。
  // 合法手が0件なら通常どおり強制パスを許可する。

function resolveCoupIfNeeded(winner){
  const rich=G.players.findIndex(p=>p.role==='富豪');
  if(rich<0||winner===rich||G.players[rich].finished)return null;
  const common=[0,1,2].find(i=>i!==winner&&i!==rich);
  addLog(`都落ち！ ${playerLabel(winner)}が富豪、${playerLabel(common)}が平民、${playerLabel(rich)}が貧民に確定しました`);
  return [winner,common,rich];
}

function gamePlayedCardIds(){
  // ゲーム間で保持するための「既出カード」情報。数字だけでなくスートまで保持する。
  return [...new Set((G.playedCardIds||[]))];
}

function updateBlindInferenceAtGameEnd(order){
  G.cpuBlindKnowledge=G.cpuBlindKnowledge||[null,null,null];
  G.cpuBlindRankHistory=G.cpuBlindRankHistory||[[],[],[]];
  G.cpuBlindCandidateIds=G.cpuBlindCandidateIds||[null,null,null];
  G.cpuBlindInferenceActive=G.cpuBlindInferenceActive||[false,false,false];

  const playedIds=gamePlayedCardIds();

  if(G.gameInSet===1){
    for(const i of [1,2]){
      const finishingRole=(order.indexOf(i)===0?'富豪':order.indexOf(i)===1?'平民':'貧民');
      if(finishingRole==='貧民'){
        // 第1ゲームで貧民になったCPUは既存仕様どおりブラインドを直接特定。
        G.cpuBlindKnowledge[i]=G.blind.id;
        G.cpuBlindInferenceActive[i]=false;
        G.cpuBlindCandidateIds[i]=null;
        G.cpuBlindRankHistory[i]=[];
      }else{
        // 富豪/平民は、第1ゲームで出たカードを数字＋スートまでセット内で保持する。
        G.cpuBlindInferenceActive[i]=true;
        G.cpuBlindRankHistory[i]=[[...playedIds]];
        // ブラインド候補はJokerも含む全40枚から開始し、既出カードを除外する。
        G.cpuBlindCandidateIds[i]=makeDeck().filter(c=>!c.joker).map(c=>c.id).filter(id=>!playedIds.includes(id));
      }
    }
    return;
  }

  for(const i of [1,2]){
    if(!G.cpuBlindInferenceActive[i]||G.cpuBlindKnowledge[i])continue;

    G.cpuBlindRankHistory[i]=G.cpuBlindRankHistory[i]||[];
    G.cpuBlindRankHistory[i].push([...playedIds]);

    // ブラインドカードは同一セットの全ゲームで場に出ない。
    // したがって、どこかのゲームで一度でも出た「数字＋スート」のカードは候補から除外できる。
    const appearedAcrossSet=new Set(G.cpuBlindRankHistory[i].flat());

    let candidates=(G.cpuBlindCandidateIds[i]||makeDeck().filter(c=>!c.joker).map(c=>c.id))
      .filter(id=>!appearedAcrossSet.has(id));

    // 現ゲームでCPU自身が所持していたカードもブラインドではない。
    // 交換で渡した／受け取ったカードも knownOwnedCardIds に含まれる。
    const currentKnownNotBlind=new Set([
      ...(G.players[i].initialHandIds||[]),
      ...(G.players[i].knownOwnedCardIds||[]),
      ...(G.playedCardIds||[])
    ]);
    candidates=candidates.filter(id=>!currentKnownNotBlind.has(id));

    G.cpuBlindCandidateIds[i]=candidates;

    // 数字＋スートまで正確に1枚へ絞れた時点でブラインド確定。
    if(candidates.length===1){
      G.cpuBlindKnowledge[i]=candidates[0];
      G.cpuBlindInferenceActive[i]=false;
      G.cpuBlindCandidateIds[i]=null;
      G.cpuBlindRankHistory[i]=[];
    }
  }
}

  // CPUのセット内ブラインド記憶を更新する。

// CPUの記憶：自分がゲーム中に持っていたカード、交換で渡したカードを含む既知の所有履歴、
// そして誰がどのカードを出したかをゲーム中は保持する。
// ブラインド以外のカードID情報はゲーム終了ごとに破棄する。
// 第1ゲームで貧民になったCPUはブラインドを直接記憶。
// 第1ゲームで富豪/平民になったCPUは、既出カードを数字＋スートまでセット内で保持し、2ゲーム目以降と照合して
// ブラインドを1枚に特定できた時点で blindId として記憶する。新セット開始時には全て破棄する。
function cpuMemory(i){
  const p=G.players[i];
  const playedBy=(G.playedByRecords||[]).map(r=>({player:r.player,cardIds:[...r.cardIds]}));
  const strong=CPU_MODE==='strong';
  return {
    initial:new Set(p.initialHandIds||[]),
    owned:new Set([...(p.initialHandIds||[]),...(p.knownOwnedCardIds||[]),...p.hand.map(c=>c.id)]),
    current:new Set(p.hand.map(c=>c.id)),
    played:new Set((G.playedCardIds||[])),
    playedBy,
    blindId:strong?(G.blind&&G.blind.id):((G.cpuBlindKnowledge||[])[i]||null),
    blindRankHistory:[...(((G.cpuBlindRankHistory||[])[i])||[])].map(x=>[...(x||[])]),
    blindCandidates:strong?[]:((G.cpuBlindCandidateIds||[])[i]||[]).slice(),
    perfect:strong,
    perfectHands:strong?G.players.map(x=>new Set(x.hand.map(c=>c.id))):null
  };
}

// 確実探索専用：平民CPUの交換前初期手札にJokerが無かった場合、
// ブラインドにはJokerが入らず、貧民が初期所持していても交換で富豪へ渡すため、
// Jokerの現在の所有者は富豪だと確定できる（未出の間）。
function cpuCertainKnownJokerOwnerFromCommonInitial(i){
  if(CPU_MODE==='strong')return null;
  const p=G.players[i];
  if(!p||p.role!=='平民')return null;
  if((p.initialHandIds||[]).includes('JK'))return null;
  const rich=G.players.findIndex(x=>x.role==='富豪');
  return rich>=0?rich:null;
}

function cpuKnownOpponentHand(i,targetIndex){
  // 通常モード用：相手の残り手札が全て特定済みのときだけ返す。
  // 自分の current ではなく、既知の出札履歴・ブラインド・残枚数から一意に確定した場合に限定する。
  if(CPU_MODE==='strong')return G.players[targetIndex].hand;
  const mem=cpuMemory(i);
  const target=G.players[targetIndex];
  if(!target||target.finished)return [];

  // まず、対象がこれまで出したカードを除外し、全デッキから「対象が持ち得るカード」を構成。
  // 通常モードで完全特定できるのは、候補数が残枚数と一致する場合のみ。
  const unavailable=new Set([...mem.current,...mem.played]);
  if(mem.blindId)unavailable.add(mem.blindId);

  // 自分が現在持っている札は対象の手札ではない。
  for(const c of G.players[i].hand)unavailable.add(c.id);

  const candidates=makeDeck().filter(c=>!unavailable.has(c.id));
  if(candidates.length!==target.hand.length)return null;

  // 候補が残枚数と一致した場合のみ「全て既知」とみなす。
  return candidates;
}


function cpuCanUseFullResponseSearch(i){
  if(CPU_MODE==='strong')return true;
  if(CPU_MODE!=='normal')return false;
  const active=G.players.map((p,j)=>({p,j})).filter(x=>!x.p.finished);
  if(active.length!==2)return false;
  const richIndex=G.players.findIndex(p=>p.role==='富豪');
  if(richIndex<0||!G.players[richIndex].finished)return false;
  const blindKnown=((G.cpuBlindKnowledge||[])[i]||null);
  return !!blindKnown;
}


// 富豪がこれまで一度でも出した「数字」を記録する。
// 通常モードの富豪確定勝ち阻止探索では、2だけを例外とし、
// それ以外は一度出した数字を現在の富豪がもう持っていない前提にする。
function cpuRichPreviouslyPlayedNonTwoRanks(richIndex){
  const ranks=new Set();
  for(const r of (G.playedByRecords||[])){
    if(r.player!==richIndex)continue;
    for(const id of (r.cardIds||[])){
      const c=cardById(id);
      if(!c||c.joker||c.rank===15)continue; // 2 は例外
      ranks.add(c.rank);
    }
  }
  return ranks;
}

function cpuLimitedCombinationCount(n,k,limit){
  if(k<0||k>n)return 0;
  k=Math.min(k,n-k);
  let v=1;
  for(let j=1;j<=k;j++){
    v=v*(n-k+j)/j;
    if(v>limit)return limit+1;
  }
  return Math.round(v);
}

function* cpuChooseCardHands(cards,k,start=0,prefix=[]){
  if(k===0){
    yield [...prefix];
    return;
  }
  for(let j=start;j<=cards.length-k;j++){
    prefix.push(cards[j]);
    yield* cpuChooseCardHands(cards,k-1,j+1,prefix);
    prefix.pop();
  }
}

// 通常モード用：富豪の実手札は直接採用せず、CPUから見えていないカードの中から
// 「富豪が持ち得る手札」を作る。さらに、富豪が一度出した2以外の数字は全候補から除外する。
// 候補手札が多すぎる場合は「確実」と断定せず探索を打ち切る。
function cpuNormalPossibleRichHands(i,s,richIndex,hypotheticalPlayedIds=[]){
  const mem=cpuMemory(i);
  const richCount=s.players[richIndex].hand.length;
  const unavailable=new Set([
    ...mem.played,
    ...hypotheticalPlayedIds,
    ...s.players[i].hand.map(c=>c.id)
  ]);
  if(mem.blindId)unavailable.add(mem.blindId);

  const forbiddenRanks=cpuRichPreviouslyPlayedNonTwoRanks(richIndex);
  const pool=makeDeck().filter(c=>
    !unavailable.has(c.id)&&
    (c.joker||!forbiddenRanks.has(c.rank))
  );

  if(pool.length<richCount)return null;

  // 富豪の候補手札を全列挙できる範囲だけ「確実」と判定する。
  // 上限超過時は未証明としてこの条件を発動しない。
  const MAX_HAND_CANDIDATES=512;
  const total=cpuLimitedCombinationCount(pool.length,richCount,MAX_HAND_CANDIDATES);
  if(total>MAX_HAND_CANDIDATES)return null;

  return {pool,richCount};
}

// postState から富豪が、他プレイヤーが最善に抵抗しても先に合法上がりできるかを判定する。
// 最強モードは実手札で完全情報探索。
// 通常モードは上記の候補手札をすべて調べ、すべてで確定勝ちが証明できた時だけ true。
function cpuRichCertainlyWinsFromState(i,postState,richIndex,hypotheticalPlayedIds=[]){
  if(!postState||richIndex<0||postState.players[richIndex].finished)return false;

  if(CPU_MODE==='strong'){
    const budget={count:0,limit:12000,cutoff:false};
    return certainFullResponseWin(postState,richIndex,Infinity,budget,new Map());
  }

  if(CPU_MODE!=='normal')return false;

  const possible=cpuNormalPossibleRichHands(
    i,postState,richIndex,hypotheticalPlayedIds
  );
  if(!possible)return false;

  let checked=0;
  for(const hand of cpuChooseCardHands(possible.pool,possible.richCount)){
    const s=certainSimClone(postState);
    s.players[richIndex].hand=hand.map(c=>({...c}));

    // 通常モードでは候補手札1通りごとの探索量も抑える。
    // 上限到達は「富豪確定勝ち」と断定しない。
    const budget={count:0,limit:5000,cutoff:false};
    if(!certainFullResponseWin(s,richIndex,Infinity,budget,new Map())){
      return false;
    }
    if(budget.cutoff)return false;
    checked++;
  }
  return checked>0;
}

function cpuActionGivesRichCertainWin(i,a,richIndex){
  const base=cloneCertainSimFromGame();
  if(base.turn!==i)return false;

  let after;
  let hypotheticalPlayedIds=[];
  if(a){
    after=certainSimApplyMove(base,i,a);
    hypotheticalPlayedIds=a.cards.map(c=>c.id);
  }else{
    if(!base.pile)return false;
    after=certainSimApplyPass(base,i);
  }

  return cpuRichCertainlyWinsFromState(
    i,after,richIndex,hypotheticalPlayedIds
  );
}

function cpuFullInfoHeadsUpDepth(i,groups){
  // 1対1かつ完全情報の場合の第2段階探索深度。
  // 6組以上:4手 / 5組:5手 / 4組:6手 / 3組以下:終局まで。
  // 実際のゲームでJokerが既に出ている場合は、有限深度をさらに+1する。
  const active=G.players.filter(p=>!p.finished).length;
  if(active!==2||!cpuCanUseFullResponseSearch(i))return null;

  let depth=groups>=6?4:groups===5?5:groups===4?6:Infinity;
  if(depth!==Infinity&&G.jokerPlayed)depth+=1;
  return depth;
}


function cpuStrongModeOpponents(i){
  if(CPU_MODE!=='strong')return null;
  return G.players.map((p,j)=>({p,j})).filter(x=>x.j!==i&&!x.p.finished);
}
function cpuStrongModePlayerHasReply(target,a,revolutionBefore,forbidSingleJoker=false){
  if(CPU_MODE!=='strong'||target<0||!G.players[target]||G.players[target].finished)return false;
  const hand=G.players[target].hand;

  // Joker単騎への返しは通常の強弱比較ではなく、スペード3だけが合法。
  // 第1段階の確実上がり探索でも、この特殊ルールを必ず反映する。
  if(
    a.type==='single'&&
    a.n===1&&
    a.cards&&
    a.cards.length===1&&
    a.cards[0].joker
  ){
    return hand.some(c=>c.id==='S3');
  }

  // Use a local compatibility check mirroring current pile semantics.
  const responseRev=a.revolution?!revolutionBefore:revolutionBefore;
  const canBeat=cand=>{
    if(cand.type!==a.type||cand.n!==a.n)return false;
    return strength(cand.rank,responseRev)>strength(a.rank,responseRev);
  };
  for(const cs of combinations(hand)){
    for(const cand of analysesInState(cs,responseRev)){
      if(
        forbidSingleJoker&&
        cand.type==='single'&&
        cand.cards.length===1&&
        cand.cards[0].joker
      )continue;
      if(canBeat(cand))return true;
    }
  }
  return false;
}

// 通常モード用：「相手がこの手に確実に返せる」ことを、既知情報だけで証明する。
// 実手札は参照せず、cpuKnownOpponentHand() により残り手札が一意に特定できた相手だけを対象にする。
function cpuNormalPlayerDefinitelyHasReply(i,target,a,revolutionBefore){
  if(CPU_MODE!=='normal'||target<0||!G.players[target]||G.players[target].finished)return false;

  const hand=cpuKnownOpponentHand(i,target);
  if(!hand)return false;

  // Joker単騎への合法な返しはS3だけ。
  if(
    a.type==='single'&&
    a.n===1&&
    a.cards&&
    a.cards.length===1&&
    a.cards[0].joker
  ){
    return hand.some(c=>c.id==='S3');
  }

  const responseRev=a.revolution?!revolutionBefore:revolutionBefore;
  const canBeat=cand=>{
    if(cand.type!==a.type||cand.n!==a.n)return false;
    return strength(cand.rank,responseRev)>strength(a.rank,responseRev);
  };

  for(const cs of combinations(hand)){
    for(const cand of analysesInState(cs,responseRev)){
      if(canBeat(cand))return true;
    }
  }
  return false;
}


function cpuCanProveNoOpponentStronger(i,card){
  // Joker単騎は通常の数字比較では最強だが、スペードの3だけは返せる。
  // したがって「相手にそれより強い札がない」判定でもS3を必ず考慮する。
  if(card.joker){
    if(CPU_MODE==='strong'){
      return G.players.every((p,j)=>
        j===i||p.finished||!p.hand.some(c=>c.id==='S3')
      );
    }
    const mem=cpuMemory(i);
    return (
      mem.current.has('S3')||
      mem.played.has('S3')||
      mem.blindId==='S3'
    );
  }
  if(CPU_MODE==='strong'){
    return G.players.every((p,j)=>j===i||p.finished||!p.hand.some(c=>!c.joker&&strength(c.rank,G.revolution)>strength(card.rank,G.revolution)));
  }
  const mem=cpuMemory(i);
  const all=makeDeck();
  return all.filter(c=>strength(c.rank,G.revolution)>strength(card.rank,G.revolution))
    .every(c=>mem.current.has(c.id)||mem.played.has(c.id)||mem.blindId===c.id);
}
function cpuSpade3MayBeOutside(i){

      j!==i&&!p.finished&&p.hand.some(c=>c.id==='S3')
    );

  return (

function cpuSuitTwoMayBeOutside(i,suit){
  const id=`${suit}15`;
  if(CPU_MODE==='strong'){
    if(G.blind&&G.blind.id===id)return false;
    if((G.playedCardIds||[]).includes(id))return false;
    if(G.players[i].hand.some(c=>c.id===id))return false;
    return G.players.some((p,j)=>j!==i&&!p.finished&&p.hand.some(c=>c.id===id));
  }
  const mem=cpuMemory(i);
  return !mem.current.has(id)&&!mem.played.has(id)&&mem.blindId!==id;
}
function cardById(id){return makeDeck().find(c=>c.id===id)}
function cpuEightKnowledge(i,target){
  if(CPU_MODE==='strong'){
    const has=G.players[target]&&!G.players[target].finished&&G.players[target].hand.some(c=>!c.joker&&c.rank===8);
    const targetPlayedEight=(G.playedByRecords||[]).some(r=>r.player===target&&r.cardIds.some(id=>{const c=cardById(id);return c&&!c.joker&&c.rank===8}));
    return {certainlyHasEight:!!has,certainlyNoEight:!has,targetPlayedEight,uncertain:false};
  }
  const mem=cpuMemory(i);
  const eights=makeDeck().filter(c=>!c.joker&&c.rank===8).map(c=>c.id);
  const currentOwn=new Set(G.players[i].hand.map(c=>c.id));
  const played=new Set(mem.played);
  const accountedOutsideTarget=new Set([...currentOwn,...played]);
  if(mem.blindId)accountedOutsideTarget.add(mem.blindId);
  const unseenEights=eights.filter(id=>!accountedOutsideTarget.has(id));

  // 未確認札は、現在の相手手札と、未特定ならブラインド1枚に存在し得る。
  const otherSlots=G.players.reduce((sum,p,j)=>sum+(j!==i&&j!==target&&!p.finished?p.hand.length:0),0)+(mem.blindId?0:1);
  const certainlyHasEight=unseenEights.length>otherSlots;
  const certainlyNoEight=unseenEights.length===0;
  const targetPlayedEight=mem.playedBy.some(r=>r.player===target&&r.cardIds.some(id=>{const c=cardById(id);return c&&!c.joker&&c.rank===8}));
  return {certainlyHasEight,certainlyNoEight,targetPlayedEight,uncertain:!certainlyHasEight&&!certainlyNoEight};
}


function cpuRichThreeOrLessStrategyState(i){
  const p=G.players[i];
  if(!(p.role==='平民'||p.role==='貧民'))return null;
  const rich=G.players.findIndex(x=>x.role==='富豪'&&!x.finished);
  if(rich<0||G.players[rich].hand.length>3)return null;
  const k=cpuEightKnowledge(i,rich);

  // 第1条件：8を持たないことが確定、または既に8を出したことがある。
  const avoidPair=k.certainlyNoEight||k.targetPlayedEight;

  // 第2条件：8を確実に持つ、または不明かつまだ8を出していない。
  const avoidWeakSingle=k.certainlyHasEight||(k.uncertain&&!k.targetPlayedEight);
  return {rich,k,avoidPair,avoidWeakSingle};
}

function cpuMoveCertainlyUnanswerableByPlayer(i,a,target,revolutionBefore){
  if(CPU_MODE==='strong')return !cpuStrongModePlayerHasReply(target,a,revolutionBefore);
  // 指定した相手1人が、その手に合法に返せないことをCPUの既知情報だけで保守的に証明する。
  if(target<0||G.players[target].finished)return true;
  // 現在の場で既にパス済みの相手は、場が流れるまで応手できない。
  if(G.pile&&G.players[target].passed)return true;
  if(G.players[target].hand.length<a.n)return true;

  const mem=cpuMemory(i);
  const unavailable=new Set([...mem.current,...mem.played]);
  if(mem.blindId)unavailable.add(mem.blindId);

  // 他の未上がりプレイヤーの「枚数」だけでは対象者の具体札を除外できないため、
  // unseen のどこかに返しが存在する限り「確定パス」とはしない。
  const unseen=makeDeck().filter(c=>!unavailable.has(c.id));
  const responseRev=a.revolution?!revolutionBefore:revolutionBefore;

  // 平民CPUの初期手札にJokerが無かったなら、未出のJokerは富豪にあると確定する。
  // よって対象が富豪でない場合、その対象者の応手にJokerは使えない。
  const knownJokerOwner=cpuCertainKnownJokerOwnerFromCommonInitial(i);
  const targetCanOwnJoker=knownJokerOwner==null||target===knownJokerOwner;
  const rawUnseenJoker=unseen.some(c=>c.joker)&&targetCanOwnJoker;

  // 確実手順探索専用の前提：この手を出した後も3人全員が10枚以上なら、
  // 相手はJokerを単品の応手としては出さない。
  // group/straightへのJoker使用可能性は従来どおり残す。
  const allThreeTenOrMore=G.players.every((p,j)=>
    (j===i?Math.max(0,p.hand.length-a.n):p.hand.length)>=10
  );
  const unseenJoker=rawUnseenJoker;
  const unseenSingleJoker=rawUnseenJoker&&!allThreeTenOrMore;
  const natural=unseen.filter(c=>!c.joker);

  if(a.type==='single'){
    if(a.cards.length===1&&a.cards[0].joker)return !unseen.some(c=>c.id==='S3');
    if(unseenSingleJoker)return false;
    return !natural.some(c=>strength(c.rank,responseRev)>strength(a.rank,responseRev));
  }
  if(a.type==='group'){
    const counts={};
    for(const c of natural)counts[c.rank]=(counts[c.rank]||0)+1;
    for(const [rkStr,count] of Object.entries(counts)){
      const rk=Number(rkStr);
      if(strength(rk,responseRev)<=strength(a.rank,responseRev))continue;
      if(count+(unseenJoker?1:0)>=a.n)return false;
    }
    return true;
  }
  if(a.type==='straight'){
    const bySuit={};
    for(const [s] of SUITS)bySuit[s]=new Set();
    for(const c of natural)bySuit[c.suit].add(c.rank);
    for(const [s] of SUITS){
      for(let start=3;start<=16-a.n+1;start++){
        if(strength(start,responseRev)<=strength(a.rank,responseRev))continue;
        const seq=Array.from({length:a.n},(_,k)=>start+k);
        const missing=seq.filter(r=>!bySuit[s].has(r)).length;
        if(missing<=(unseenJoker?1:0))return false;
      }
    }
    return true;
  }
  return false;
}

function isFoulFinishInState(a,revolutionBefore){
  // 反則上がりは、カードを出す直前の革命状態で判定する。
  // 通常時に3で革命して上がる、革命中に2で革命返しして上がるのは合法。
  if(a.cards.some(c=>c.joker))return true;
  if(a.type!=='straight'&&a.cards.some(c=>!c.joker&&c.rank===8))return true;
  if(a.type==='single'&&a.cards.length===1&&a.cards[0].id==='S3')return true;
  const foulRank=revolutionBefore?3:15;
  return a.cards.some(c=>!c.joker&&c.rank===foulRank);
}

function moveClearsPileWithoutOpponent(a,revolution){
  // 自分が出した直後に場が流れ、再び自分が親になれる手だけを中継手として扱う。
  const eightCut=a.type!=='straight'&&a.rank===8;
  const strongestStraight=isStrongestStraightMove(a,revolution);
  return eightCut||strongestStraight;
}
function cpuCanProveLeadMoveUnanswerable(i,a,revolutionBefore,ownCountAfterMove=null,respectCurrentPasses=false){
  const ownAfter=ownCountAfterMove==null
    ?Math.max(0,G.players[i].hand.length-a.n)
    :ownCountAfterMove;
  const allThreeTenOrMore=G.players.every((p,j)=>
    (j===i?ownAfter:p.hand.length)>=10
  );

  if(CPU_MODE==='strong'){
    const opponents=cpuStrongModeOpponents(i)||[];
    return opponents.every(o=>!cpuStrongModePlayerHasReply(
      o.j,a,revolutionBefore,allThreeTenOrMore
    ));
  }
  // 場が流れた直後にこの手を出したと仮定し、CPUの記憶から相手が絶対に返せないかを保守的に証明する。
  // 自分の現手札・既出札・判明済みブラインドは相手が持ち得ない。交換で手放した過去の自札は除外しない。
  const mem=cpuMemory(i);
  const unavailable=new Set([...mem.current,...mem.played]);
  if(mem.blindId)unavailable.add(mem.blindId);
  const unseen=makeDeck().filter(c=>!unavailable.has(c.id));
  const opponents=G.players.map((p,j)=>({p,j})).filter(x=>x.j!==i&&!x.p.finished);
  if(!opponents.length)return true;
  if(!opponents.some(x=>x.p.hand.length>=a.n))return true;

  const responseRev=a.revolution?!revolutionBefore:revolutionBefore;

  // 平民CPUの交換前初期手札にJokerが無かった場合、Jokerは富豪が所持すると確定する。
  // 現在のトリックを評価していて、その富豪が既にパス済みなら、場が流れるまでは
  // 他の相手からJokerが出る可能性はない。場が流れた後の再帰局面にはこのpassed情報を持ち越さない。
  const knownJokerOwner=cpuCertainKnownJokerOwnerFromCommonInitial(i);
  const jokerOwnerUnavailableThisTrick=
    respectCurrentPasses&&
    knownJokerOwner!=null&&
    !!G.pile&&
    (G.players[knownJokerOwner].finished||G.players[knownJokerOwner].passed);
  const unseenJoker=unseen.some(c=>c.joker)&&!jokerOwnerUnavailableThisTrick;
  const unseenSingleJoker=unseenJoker&&!allThreeTenOrMore;
  const natural=unseen.filter(c=>!c.joker);

  if(a.type==='single'){
    if(a.cards.length===1&&a.cards[0].joker){
      return !unseen.some(c=>c.id==='S3');
    }
    if(unseenSingleJoker)return false;
    return !natural.some(c=>strength(c.rank,responseRev)>strength(a.rank,responseRev));
  }

  if(a.type==='group'){
    const counts={};
    for(const c of natural)counts[c.rank]=(counts[c.rank]||0)+1;
    for(const [rkStr,count] of Object.entries(counts)){
      const rk=Number(rkStr);
      if(strength(rk,responseRev)<=strength(a.rank,responseRev))continue;
      if(count+(unseenJoker?1:0)>=a.n)return false;
    }
    return true;
  }

  if(a.type==='straight'){
    const bySuit={};
    for(const [s] of SUITS)bySuit[s]=new Set();
    for(const c of natural)bySuit[c.suit].add(c.rank);

    // 革命中の最強3枚階段 Joker・3・4 が相手側に成立し得るなら、
    // それより弱い3枚階段は「絶対に返せない」とは証明しない。
    if(responseRev&&a.n===3&&unseenJoker){
      for(const [s] of SUITS){
        if(bySuit[s].has(3)&&bySuit[s].has(4)){
          const specialPower=strength(2,true);
          if(specialPower>strength(a.rank,true))return false;
        }
      }
    }

    for(const [s] of SUITS){
      for(let start=3;start<=16-a.n+1;start++){
        if(strength(start,responseRev)<=strength(a.rank,responseRev))continue;
        const seq=Array.from({length:a.n},(_,k)=>start+k);
        const missing=seq.filter(r=>!bySuit[s].has(r)).length;
        if(missing<= (unseenJoker?1:0))return false;
      }
    }
    return true;
  }
  return false;
}
function hasTwoOrMorePlayersWhoHaveNeverPlayed(){
  const records=G.playedByRecords||[];
  let count=0;
  for(const i of [0,1,2]){
    const played=records.some(r=>r.player===i&&r.cardIds&&r.cardIds.length>0);
    if(!played)count++;
  }
  return count>=2;
}

function cpuOpponentMayHaveStrongerNaturalPairThan(i,rank,revolution){
  const threshold=strength(rank,revolution);

  if(CPU_MODE==='strong'){
    return G.players.some((op,j)=>{
      if(j===i||op.finished)return false;
      const counts={};
      for(const c of op.hand){
        if(!c.joker)counts[c.rank]=(counts[c.rank]||0)+1;
      }
      return RANKS.some(rk=>
        strength(rk,revolution)>threshold &&
        (counts[rk]||0)>=2
      );
    });
  }

  // 通常モードでは、自分が把握済みの札以外を未知札として扱う。
  const mem=cpuMemory(i);
  const unavailable=new Set([...mem.current,...mem.played]);
  if(mem.blindId)unavailable.add(mem.blindId);

  return RANKS.some(rk=>{
    if(strength(rk,revolution)<=threshold)return false;
    const unknownNaturals=SUITS
      .map(([s])=>`${s}${rk}`)
      .filter(id=>!unavailable.has(id))
      .length;
    return unknownNaturals>=2;
  });
}

function cpuIsUnsafeSinglePlusJokerPairInHand(i,hand,a,revolution){
  if(!a||a.type!=='group'||a.n!==2||!a.cards.some(c=>c.joker))return false;
  const natural=a.cards.find(c=>!c.joker);
  if(!natural)return false;
  const sameRankCount=hand.filter(c=>!c.joker&&c.rank===natural.rank).length;
  return sameRankCount===1&&cpuOpponentMayHaveStrongerNaturalPairThan(i,natural.rank,revolution);
}

function certainRunOutMinSteps(i,cards,revolution,memo=new Map()){
  if(!cards.length)return 0;

  // 残り全部を1手で合法かつ反則上がりせず出せるなら最短は1手。
  if(analysesInState(cards,revolution).some(a=>
    !isFoulFinishInState(a,revolution)&&
    !cpuIsUnsafeSinglePlusJokerPairInHand(i,cards,a,revolution)
  ))return 1;

  // 未出札者が2人以上いる序盤では再帰探索を止める。
  if(hasTwoOrMorePlayersWhoHaveNeverPlayed())return Infinity;

  const key=`${i}:${revolution?'R':'N'}:${cards.map(c=>c.id).sort().join(',')}`;
  if(memo.has(key))return memo.get(key);
  // 循環防止。探索中の同一状態は失敗扱い。
  memo.set(key,Infinity);

  let best=Infinity;
  for(const cs of combinations(cards)){
    if(cs.length===cards.length)continue;
    for(const a of analysesInState(cs,revolution)){
      if(cpuIsUnsafeSinglePlusJokerPairInHand(i,cards,a,revolution))continue;
      const clears=moveClearsPileWithoutOpponent(a,revolution);
      const unanswerable=cpuCanProveLeadMoveUnanswerable(i,a,revolution,cards.length-a.n);
      if(!clears&&!unanswerable)continue;
      const used=new Set(a.cards.map(c=>c.id));
      const remaining=cards.filter(c=>!used.has(c.id));
      const nextRevolution=a.revolution?!revolution:revolution;
      const rest=certainRunOutMinSteps(i,remaining,nextRevolution,memo);
      if(Number.isFinite(rest))best=Math.min(best,1+rest);
    }
  }
  memo.set(key,best);
  return best;
}
function canCertainlyRunOutWithoutOpponent(i,cards,revolution,memo=new Map()){
  return Number.isFinite(certainRunOutMinSteps(i,cards,revolution,memo));
}

function cpuCanCertainlyFinishAfterSingleJoker(i,move){
  if(!(move&&move.type==='single'&&move.cards.length===1&&move.cards[0].joker))return false;
  if(G.players[i].hand.length===1)return false; // Joker上がり自体は反則。

  // Joker単騎はS3で返され得るため、「Joker後は自分が親」と仮定しない。
  // まず相手が一度も返せない確実経路を調べ、完全情報が使える場合は
  // S3返しを含む相手の全合法応手まで探索して、本当に確実に上がれる時だけ例外とする。
  const stage1=cpuMoveCertainFinishSteps(i,move,new Map());
  if(Number.isFinite(stage1))return true;
  if(cpuCanUseFullResponseSearch(i)){
    return cpuMoveCertainFinishWithResponses(
      i,move,createCertainSearchBudget(),Infinity
    );
  }
  return false;
}
function cpuCanCertainlyFinishAfterSp3Return(i,move){
  if(!(move&&move.type==='single'&&move.cards.length===1&&move.cards[0].id==='S3'))return false;
  if(G.players[i].hand.length===1)return false; // S3単品上がり自体は反則。

  const stage1=cpuMoveCertainFinishSteps(i,move,new Map());
  if(Number.isFinite(stage1))return true;
  if(cpuCanUseFullResponseSearch(i)){
    return cpuMoveCertainFinishWithResponses(
      i,move,createCertainSearchBudget(),Infinity
    );
  }
  return false;
}


function cpuCertainSearchDepthForState(cards,revolution,applyJokerBonus=true){
  const groups=optimalHandPartition(cards,revolution).groupCount;

  let depth;
  if(CPU_MODE==='strong'){
    // 最強: 6組以上=2手、5組=4手、4組=4手、3組以下=終局まで
    if(groups>=6)depth=2;
    else if(groups===5)depth=4;
    else if(groups===4)depth=4;
    else depth=Infinity;
  }else{
    // 通常: 5組以上=2手、4組=3手、3組=3手、2組以下=終局まで
    if(groups>=5)depth=2;
    else if(groups===4)depth=3;
    else if(groups===3)depth=3;
    else depth=Infinity;
  }

  // 実際のゲームでJokerが一度でも出た後に開始する探索だけ、有限深度を+1する。
  // 探索途中の仮想局面でJokerが出ても、途中から深度は増やさない。
  if(applyJokerBonus&&depth!==Infinity&&G.jokerPlayed)depth+=1;

  return depth;
}

function createCertainSearchBudget(){
  return {count:0,limit:20000,cutoff:false};
}

function countCertainState(budget){
  if(!budget)return true;
  budget.count++;
  if(budget.count>budget.limit){
    budget.cutoff=true;
    return false;
  }
  return true;
}


function certainMoveSearchPower(a,revolution){
  const jokerBonus=a.cards.some(c=>c.joker)?1000:0;
  return jokerBonus+strength(a.rank,revolution)*10+a.n;
}
function certainCardSetKey(cards){
  return cards.map(c=>c.id).sort().join('|');
}
function secondWeakestThenUpThenWeakest(items,powerFn){
  if(items.length<=1)return [...items];
  const ordered=[...items].sort((a,b)=>
    powerFn(a)-powerFn(b) ||
    String(a.key||'').localeCompare(String(b.key||''))
  );
  return [...ordered.slice(1),ordered[0]];
}
function orderCertainMovesForHand(hand,moves,revolution,preservingOnly=false){
  if(!moves||!moves.length)return [];
  const part=optimalHandPartition(hand,revolution);

  // 最適分割の各「まとまり」。単品も1組として扱う。
  const groups=[];
  for(const a of part.bundles){
    groups.push({
      key:certainCardSetKey(a.cards),
      power:certainMoveSearchPower(a,revolution),
      move:a
    });
  }
  for(const c of part.singles){
    const a={type:'single',n:1,rank:c.joker?16:c.rank,cards:[c]};
    groups.push({
      key:certainCardSetKey([c]),
      power:certainMoveSearchPower(a,revolution),
      move:a
    });
  }

  // 8単品・8ペアは、通常の順序から外して「最弱のまとまりの直前」に回す。
  // 8トリオ以上にはこの特別扱いを適用しない。
  const isDeferredEightGroup=g=>
    g.move &&
    !g.move.cards.some(c=>c.joker) &&
    g.move.rank===8 &&
    (
      g.move.type==='single' ||
      (g.move.type==='group'&&g.move.n===2)
    );

  const orderedByPower=[...groups].sort((a,b)=>
    a.power-b.power ||
    String(a.key||'').localeCompare(String(b.key||''))
  );

  let groupOrder;
  if(orderedByPower.length<=1){
    groupOrder=[...orderedByPower];
  }else{
    const weakest=orderedByPower[0];
    const middleAndStrong=orderedByPower.slice(1);

    // 8単品・8ペアはここから一旦除外。
    const deferredEights=middleAndStrong.filter(isDeferredEightGroup);
    const normalMiddle=middleAndStrong.filter(g=>!isDeferredEightGroup(g));

    // 最弱自身が8単品/8ペアの場合も、最弱として最後に残す。
    groupOrder=[
      ...normalMiddle,
      ...deferredEights,
      weakest
    ];
  }

  const groupPos=new Map(groupOrder.map((g,idx)=>[g.key,idx]));

  const preserving=[];
  const breaking=[];
  for(const a of moves){
    const k=certainCardSetKey(a.cards);
    if(groupPos.has(k))preserving.push(a);
    else breaking.push(a);
  }

  preserving.sort((a,b)=>
    groupPos.get(certainCardSetKey(a.cards))-groupPos.get(certainCardSetKey(b.cards)) ||
    certainMoveSearchPower(a,revolution)-certainMoveSearchPower(b,revolution) ||
    moveAnalysisKey(a).localeCompare(moveAnalysisKey(b))
  );

  // まとまりを崩す候補も通常は「2番目に弱い候補→強い候補→最弱」の順。
  let breakingFiltered=[...breaking];

  // 空場では、8ペアを崩して8を1枚だけ出す入口は探索しない。
  if(!G.pile){
    const eightPairIds=new Set(
      part.bundles
        .filter(a=>
          a.type==='group'&&
          a.n===2&&
          a.rank===8&&
          !a.cards.some(c=>c.joker)
        )
        .flatMap(a=>a.cards.map(c=>c.id))
    );

    if(eightPairIds.size){
      breakingFiltered=breakingFiltered.filter(a=>
        !(
          a.type==='single'&&
          a.cards.length===1&&
          !a.cards[0].joker&&
          a.cards[0].rank===8&&
          eightPairIds.has(a.cards[0].id)
        )
      );
    }
  }

  const breakingWrapped=breakingFiltered.map(a=>({
    a,
    key:moveAnalysisKey(a),
    power:certainMoveSearchPower(a,revolution),
    deferredEight:
      !a.cards.some(c=>c.joker)&&
      a.rank===8&&
      (
        a.type==='single' ||
        (a.type==='group'&&a.n===2)
      )
  }));

  const breakingByPower=[...breakingWrapped].sort((x,y)=>
    x.power-y.power ||
    String(x.key||'').localeCompare(String(y.key||''))
  );

  let breakingOrdered=[];
  if(breakingByPower.length===1){
    breakingOrdered=[breakingByPower[0].a];
  }else if(breakingByPower.length>1){
    const weakest=breakingByPower[0];
    const rest=breakingByPower.slice(1);
    const deferred=rest.filter(x=>x.deferredEight);
    const normal=rest.filter(x=>!x.deferredEight);
    breakingOrdered=[
      ...normal,
      ...deferred,
      weakest
    ].map(x=>x.a);
  }

  // 7組以上の第1段階探索などでは、現在の最適分割を維持する手だけに限定できる。
  if(preservingOnly)return preserving;

  return [...preserving,...breakingOrdered];
}
// 後方互換用。探索箇所では可能な限り orderCertainMovesForHand を使う。

function cpuMoveCertainFinishStepsBounded(i,a,memo=new Map(),budget=null){
  // 通常・最強共通の第1段階探索では、探索開始前にすでに上がっている相手は
  // もともと探索対象外であり、確実上がり失敗の理由にはしない。
  const p=G.players[i];
  const used=new Set(a.cards.map(c=>c.id));
  const remaining=p.hand.filter(c=>!used.has(c.id));
  if(!remaining.length)return isFoulFinish(a)?Infinity:1;

  const nextRev=a.revolution?!G.revolution:G.revolution;
  const keepsControl=moveClearsPileWithoutOpponent(a,G.revolution)||cpuCanProveLeadMoveUnanswerable(i,a,G.revolution,null,true);
  if(!keepsControl)return Infinity;

  const depthLeft=cpuCertainSearchDepthForState(remaining,nextRev,true);
  const rest=certainRunOutMinStepsBounded(i,remaining,nextRev,memo,depthLeft,budget);
  return Number.isFinite(rest)?1+rest:Infinity;
}


// 7組以上専用：探索開始時の最適分割を固定し、そのまとまりを一切崩さず終局まで探索する。
// 各局面で optimalHandPartition() を再計算しないため、序盤の探索負荷を大幅に抑える。
// 単品も1組として固定し、探索対象から落とさない。
function cpuStage1FixedPartitionCertainRoute(i,rootLegal,budget=null){
  const hand=G.players[i].hand;
  const part=optimalHandPartition(hand,G.revolution);
  if(part.groupCount<7)return null;

  // v302までの確実上がり探索と同じ序盤ガードを維持する。
  // まだ2人以上が一度もカードを出していない局面では、終局までの再帰探索を開始しない。
  // この専用関数だけがガードを迂回すると、ゲーム開始直後から固定分割の全終局探索へ入り、
  // CPUが通常の優先条件・スコア評価へ進むまで長時間ブロックされる。
  if(hasTwoOrMorePlayersWhoHaveNeverPlayed())return null;

  const fixedGroups=[
    ...part.bundles.map(a=>a.cards.map(c=>c.id).sort()),
    ...part.singles.map(c=>[c.id])
  ];
  const groupKey=ids=>[...ids].sort().join('|');
  const groupKeys=fixedGroups.map(groupKey);
  const indexByKey=new Map(groupKeys.map((k,idx)=>[k,idx]));

  // 入口は現在の合法手のうち、固定した最適分割をそのまま出す手だけ。
  // ここでは orderCertainMovesForHand() による再分割を避け、固定分割の順序を直接使う。
  const rootByKey=new Map();
  for(const a of rootLegal){
    const k=groupKey(a.cards.map(c=>c.id));
    if(indexByKey.has(k)&&!rootByKey.has(k))rootByKey.set(k,a);
  }
  const rootGroups=fixedGroups.map((ids,gi)=>{
    const a=rootByKey.get(groupKey(ids));
    return a?{gi,a,power:certainMoveSearchPower(a,G.revolution),key:groupKey(ids)}:null;
  }).filter(Boolean).sort((x,y)=>x.power-y.power||x.key.localeCompare(y.key));
  // 既存の確実探索と同じく、最弱を最後へ回す。
  // ただし8の単品・8のペアは通常位置から外し、最弱の直前に回す。
  // そのため8が2番目に弱い場合は、3番目に弱いまとまりから探索を始める。
  let roots;
  if(rootGroups.length<=1){
    roots=rootGroups;
  }else{
    const weakest=rootGroups[0];
    const middleAndStrong=rootGroups.slice(1);

    const isEightSingleOrPair=entry=>{
      const a=entry&&entry.a;
      if(!a)return false;
      const single=a.type==='single'&&a.cards.length===1;
      const pair=a.type==='group'&&a.n===2&&a.cards.length===2;
      return (single||pair)&&a.cards.every(c=>!c.joker&&c.rank===8);
    };

    const eightEntries=middleAndStrong.filter(isEightSingleOrPair);
    const otherEntries=middleAndStrong.filter(entry=>!isEightSingleOrPair(entry));

    roots=[...otherEntries,...eightEntries,weakest];
  }
  if(!roots.length)return null;

  const cardById=new Map(hand.map(c=>[c.id,c]));

  // 各固定グループについて「通常／革命」の2状態だけを先に解析する。
  // 相手が返せるかの証明を探索木の各節点で何度も計算しない。
  const variantCache=new Map();
  const variantsFor=(gi,revolution,remainingHand)=>{
    const baseKey=`${gi}:${revolution?'R':'N'}`;
    let base=variantCache.get(baseKey);
    if(!base){
      const cards=fixedGroups[gi].map(id=>cardById.get(id)).filter(Boolean);
      base=analysesInState(cards,revolution).filter(a=>a.cards.length===cards.length).map(a=>({
        a,
        clears:moveClearsPileWithoutOpponent(a,revolution),
        unanswerable:cpuCanProveLeadMoveUnanswerable(i,a,revolution,remainingHand.length-a.n),
        nextRev:a.revolution?!revolution:revolution,
        foul:isFoulFinishInState(a,revolution)
      }));
      variantCache.set(baseKey,base);
    }
    // 危険な「単品1枚＋Joker」ペアだけは、残り手札に応じて毎節点判定する。
    return base.filter(v=>!cpuIsUnsafeSinglePlusJokerPairInHand(i,remainingHand,v.a,revolution));
  };

  const memo=new Map();
  const handForMask=mask=>{
    const ids=[];
    for(let gi=0;gi<fixedGroups.length;gi++){
      if((mask>>gi)&1)ids.push(...fixedGroups[gi]);
    }
    return ids.map(id=>cardById.get(id)).filter(Boolean);
  };

  function canFinish(mask,revolution){
    if(mask===0)return true;
    if(!countCertainState(budget))return false;
    const key=`FP:${mask}:${revolution?'R':'N'}`;
    if(memo.has(key))return memo.get(key);
    memo.set(key,false);

    const remainingHand=handForMask(mask);
    for(let gi=0;gi<fixedGroups.length;gi++){
      if(((mask>>gi)&1)===0)continue;
      const nextMask=mask&~(1<<gi);
      for(const v of variantsFor(gi,revolution,remainingHand)){
        if(nextMask===0){
          if(!v.foul){memo.set(key,true);return true;}
          continue;
        }
        if(!v.clears&&!v.unanswerable)continue;
        if(canFinish(nextMask,v.nextRev)){
          memo.set(key,true);
          return true;
        }
        if(budget&&budget.cutoff)return false;
      }
    }
    return false;
  }

  const fullMask=(1<<fixedGroups.length)-1;
  for(const root of roots){
    const {gi,a}=root;
    const remainingMask=fullMask&~(1<<gi);
    if(remainingMask===0){
      if(!isFoulFinish(a))return a;
      continue;
    }
    const keepsControl=
      moveClearsPileWithoutOpponent(a,G.revolution)||
      cpuCanProveLeadMoveUnanswerable(i,a,G.revolution,null,true);
    if(!keepsControl)continue;
    const nextRev=a.revolution?!G.revolution:G.revolution;
    if(canFinish(remainingMask,nextRev))return a;
    if(budget&&budget.cutoff)break;
  }
  return null;
}

function certainRunOutMinStepsBounded(i,cards,revolution,memo=new Map(),depthLeft=null,budget=null,preservingOnly=false){
  if(!cards.length)return 0;
  if(!countCertainState(budget))return Infinity;

  const dynamicDepth=cpuCertainSearchDepthForState(cards,revolution,false);
  if(depthLeft==null)depthLeft=dynamicDepth;
  else if(depthLeft!==Infinity){
    if(dynamicDepth===Infinity)depthLeft=Infinity;
    else depthLeft=Math.max(depthLeft,dynamicDepth);
  }

  if(depthLeft!==Infinity&&depthLeft<=0)return Infinity;

  // 全手札を一度に合法上がりできるなら即確定。
  const finishNow=orderCertainMovesForHand(
    cards,
    analysesInState(cards,revolution).filter(a=>
      !isFoulFinishInState(a,revolution)&&
      !cpuIsUnsafeSinglePlusJokerPairInHand(i,cards,a,revolution)
    ),
    revolution,
    preservingOnly
  );
  if(finishNow.length)return 1;

  if(hasTwoOrMorePlayersWhoHaveNeverPlayed())return Infinity;

  const key=`B:${depthLeft===Infinity?'INF':depthLeft}:${i}:${revolution?'R':'N'}:${cards.map(c=>c.id).sort().join(',')}`;
  if(memo.has(key))return memo.get(key);
  memo.set(key,Infinity);

  // 現在出せる候補を集めて探索する。
  // 7組以上の「まとまり維持のみ」探索では、全カード組合せを列挙すると非常に重くなるため、
  // 最適分割に含まれる各まとまりだけを直接候補化する。
  const candidates=[];
  const seen=new Set();

  const candidateCardSets=preservingOnly
    ?optimalHandPartition(cards,revolution).bundles.map(b=>b.cards)
    :combinations(cards);

  for(const cs of candidateCardSets){
    if(!preservingOnly&&cs.length===cards.length)continue;
    for(const a of analysesInState(cs,revolution)){
      if(cpuIsUnsafeSinglePlusJokerPairInHand(i,cards,a,revolution))continue;
      const k=moveAnalysisKey(a);
      if(seen.has(k))continue;
      seen.add(k);
      const clears=moveClearsPileWithoutOpponent(a,revolution);
      const unanswerable=cpuCanProveLeadMoveUnanswerable(i,a,revolution,cards.length-a.n);
      if(clears||unanswerable)candidates.push(a);
    }
  }

  for(const a of orderCertainMovesForHand(cards,candidates,revolution,preservingOnly)){
    if(budget&&budget.cutoff)break;

    const used=new Set(a.cards.map(c=>c.id));
    const remaining=cards.filter(c=>!used.has(c.id));
    const nextRevolution=a.revolution?!revolution:revolution;
    const nextDepth=depthLeft===Infinity?Infinity:Math.max(0,depthLeft-1);
    const rest=certainRunOutMinStepsBounded(i,remaining,nextRevolution,memo,nextDepth,budget,preservingOnly);

    // 一つでも確実ルートが見つかったら、手数比較をせず即終了。
    if(Number.isFinite(rest)){
      const result=1+rest;
      memo.set(key,result);
      return result;
    }
  }

  // 局面上限で打ち切られた枝は「確実」と認定しない。
  if(budget&&budget.cutoff)return Infinity;

  memo.set(key,Infinity);
  return Infinity;
}

function cloneCertainSimFromGame(){
  return {
    players:G.players.map(p=>({
      hand:p.hand.map(c=>({...c})),
      role:p.role,
      passed:!!p.passed,
      finished:!!p.finished,
      foul:!!p.foul
    })),
    pile:G.pile?{
      ...G.pile,
      cards:(G.pile.cards||[]).map(c=>({...c})),
      suits:[...(G.pile.suits||[])],
      sequence:G.pile.sequence?[...G.pile.sequence]:undefined
    }:null,
    lead:G.lead,
    turn:G.turn,
    revolution:!!G.revolution,
    lock:G.lock,
        commonPoorRevolutionLock:!!G.commonPoorRevolutionLock,
    commonPoorNoLeadRevolutionOnce:!!G.commonPoorNoLeadRevolutionOnce,
    finishedAtStart:G.players.map(p=>!!p.finished)
  };
}
function certainSimNextActive(s,from){
  for(let k=1;k<=3;k++){
    const j=(from+k)%3,p=s.players[j];
    if(!p.finished&&(!s.pile||!p.passed))return j;
  }
  return from;
}
function certainSimSuitSignature(a){
  if(a.type==='straight')return a.suits[0];
  if(a.type==='single')return a.suits[0]||null;
  return a.suits.join('');
}
function certainSimCompatible(s,a){
  const p=s.pile;
  if(a.revolutionOnlyLowJokerStraight&&!s.revolution)return false;
  if(!p)return true;
  
  if(a.revolution){
    const actor=s.players[s.turn];
    const richIndex=s.players.findIndex(x=>x.role==='富豪'&&!x.finished);
    const commonPoor=actor&&(actor.role==='平民'||actor.role==='貧民')&&richIndex>=0;
    if(commonPoor&&s.commonPoorRevolutionLock){
      const revolutionStarter=s.commonPoorRevolutionLock-1;
      if(revolutionStarter!==s.turn)return false;
    }
  }
  if(p.type!==a.type||p.n!==a.n)return false;
  if(p.type==='single'&&p.rank===16)return a.cards.length===1&&a.cards[0].id==='S3';
  if(strength(a.rank,s.revolution)<=strength(p.rank,s.revolution))return false;

  if(s.lock){
    const natural=a.cards.filter(c=>!c.joker).map(c=>c.suit).sort();
    const jc=a.cards.filter(c=>c.joker).length;
    if(a.type==='single'){
      if(jc===0&&natural[0]!==s.lock)return false;
    }else if(a.type==='straight'){
      if(natural.some(x=>x!==s.lock))return false;
    }else{
      const req=s.lock.split('').sort(),remaining=[...req];
      for(const suit of natural){
        const k=remaining.indexOf(suit);
        if(k<0)return false;
        remaining.splice(k,1);
      }
      if(remaining.length>jc)return false;
    }
  }
  return true;
}
function certainSimLegalMoves(s,playerIndex){
  const p=s.players[playerIndex];
  if(p.finished||(s.pile&&p.passed))return [];
  const out=[],seen=new Set();
  for(const cs of combinations(p.hand)){
    for(const a of analysesInState(cs,s.revolution)){
      if(!certainSimCompatible(s,a))continue;
      const k=moveAnalysisKey(a);
      if(seen.has(k))continue;
      seen.add(k);
      // 反則上がりになる最終手は確実上がりルートでは採用しない。
      if(p.hand.length===a.n&&isFoulFinishInState(a,s.revolution))continue;
      out.push(a);
    }
  }
  return orderCertainMovesForHand(p.hand,out,s.revolution);
}
function certainSimClone(s){
  return {
    players:s.players.map(p=>({
      hand:p.hand.map(c=>({...c})),
      role:p.role,
      passed:p.passed,finished:p.finished,foul:p.foul
    })),
    pile:s.pile?{
      ...s.pile,
      cards:(s.pile.cards||[]).map(c=>({...c})),
      suits:[...(s.pile.suits||[])],
      sequence:s.pile.sequence?[...s.pile.sequence]:undefined
    }:null,
    lead:s.lead,turn:s.turn,revolution:s.revolution,lock:s.lock,
        commonPoorRevolutionLock:s.commonPoorRevolutionLock,
    commonPoorNoLeadRevolutionOnce:s.commonPoorNoLeadRevolutionOnce,
    finishedAtStart:[...(s.finishedAtStart||s.players.map(p=>!!p.finished))]
  };
}
function certainSimClearPile(s,starter){
  s.pile=null;s.lead=null;s.lock=null;
  s.commonPoorRevolutionLock=0;
  s.commonPoorNoLeadRevolutionOnce=false;
  s.players.forEach(p=>p.passed=false);
  s.turn=s.players[starter].finished?certainSimNextActive(s,starter):starter;
}
function certainSimApplyPass(s,i){
  const ns=certainSimClone(s);
  ns.players[i].passed=true;
  const others=ns.players.map((p,j)=>({p,j}))
    .filter(x=>x.j!==ns.lead&&!x.p.finished);
  if(ns.pile&&others.length&&others.every(x=>x.p.passed)){
    certainSimClearPile(ns,ns.lead);
  }else{
    ns.turn=certainSimNextActive(ns,i);
  }
  return ns;
}
function certainSimApplyMove(s,i,a){
  const ns=certainSimClone(s);
  const p=ns.players[i];
  ns.commonPoorNoLeadRevolutionOnce=false;
  const prev=ns.pile;
  const prevSig=prev?certainSimSuitSignature(prev):null;
  const used=new Set(a.cards.map(c=>c.id));
  p.hand=p.hand.filter(c=>!used.has(c.id));
  p.passed=false;
  ns.pile={...a,cards:a.cards.map(c=>({...c})),suits:[...(a.suits||[])],sequence:a.sequence?[...a.sequence]:undefined};
  ns.lead=i;

  if(prev&&!a.cards.some(c=>c.joker)){
    const newSig=certainSimSuitSignature(a);
    if(prevSig&&newSig&&prevSig===newSig)ns.lock=newSig;
  }
  const sp3=prev&&prev.type==='single'&&prev.rank===16&&a.type==='single'&&a.cards[0].id==='S3';
  const eight=a.type!=='straight'&&a.rank===8;
  const strongestStraight=isStrongestStraightMove(a,ns.revolution);

  if(a.revolution){
    const richIndexBefore=ns.players.findIndex(x=>x.role==='富豪'&&!x.finished);
    if(richIndexBefore>=0&&(p.role==='平民'||p.role==='貧民')){
      ns.commonPoorRevolutionLock=i+1;
    }
    ns.revolution=!ns.revolution;
  }

  if(!p.hand.length){
    p.finished=true;
    p.foul=isFoulFinishInState(a,s.revolution);
  }

  if(sp3||eight||strongestStraight){
    certainSimClearPile(ns,i);
  }else{
    const others=ns.players.map((x,j)=>({x,j}))
      .filter(o=>o.j!==ns.lead&&!o.x.finished);
    if(others.length&&others.every(o=>o.x.passed)){
      certainSimClearPile(ns,ns.lead);
    }else{
      ns.turn=certainSimNextActive(ns,i);
    }
  }
  return ns;
}
function certainSimKey(s,root,rootDepth){
  return [
    root,rootDepth===Infinity?'I':rootDepth,s.turn,s.lead??'N',
    s.revolution?'R':'N',s.lock||'-',
    s.commonPoorRevolutionLock?`C${s.commonPoorRevolutionLock}`:'-',s.commonPoorNoLeadRevolutionOnce?'N':'-',
    (s.finishedAtStart||[]).map(x=>x?'1':'0').join(''),
    s.pile?`${s.pile.type}:${s.pile.n}:${s.pile.rank}:${certainCardSetKey(s.pile.cards)}`:'EMPTY',
    ...s.players.map(p=>`${p.finished?'F':'A'}${p.passed?'P':'-'}:${p.hand.map(c=>c.id).sort().join(',')}`)
  ].join('/');
}
function certainFullResponseWin(s,root,rootDepth,budget,memo){
  if(!countCertainState(budget))return false;
  if(s.players[root].finished)return !s.players[root].foul;
  // 相手が先に上がった枝は「自分が確実に上がる」保証を失う。
  if(s.players.some((p,j)=>
    j!==root &&
    p.finished &&
    !(s.finishedAtStart&&s.finishedAtStart[j])
  ))return false;
  if(rootDepth!==Infinity&&rootDepth<=0)return false;

  const key=certainSimKey(s,root,rootDepth);
  if(memo.has(key))return memo.get(key);

  const i=s.turn;
  const allMoves=certainSimLegalMoves(s,i);
  const allThreeTenOrMore=s.players.every(p=>p.hand.length>=10);
  const moves=i===root
    ?allMoves.filter(a=>!cpuIsUnsafeSinglePlusJokerPairInHand(root,s.players[root].hand,a,s.revolution))
    :allMoves.filter(a=>!(
      allThreeTenOrMore&&
      a.type==='single'&&
      a.cards.length===1&&
      a.cards[0].joker
    ));
  const canPass=!!s.pile;

  if(i===root){
    // 自分は、まとまりを崩さない候補から順に一つでも勝てる手を探す。
    for(const a of moves){
      if(budget&&budget.cutoff)break;
      const ns=certainSimApplyMove(s,i,a);
      const nextDepth=rootDepth===Infinity?Infinity:rootDepth-1;
      if(certainFullResponseWin(ns,root,nextDepth,budget,memo)){
        memo.set(key,true);return true;
      }
    }
    if(canPass&&!budget?.cutoff){
      const ns=certainSimApplyPass(s,i);
      if(certainFullResponseWin(ns,root,rootDepth,budget,memo)){
        memo.set(key,true);return true;
      }
    }
    memo.set(key,false);return false;
  }

  // 相手は敵対的に「合法な全応手」を選び得る。全分岐で自分が勝てる必要がある。
  const actions=[...moves];
  if(canPass)actions.push(null);
  if(!actions.length){
    memo.set(key,false);return false;
  }
  for(const a of actions){
    if(budget&&budget.cutoff){memo.set(key,false);return false}
    const ns=a?certainSimApplyMove(s,i,a):certainSimApplyPass(s,i);
    if(!certainFullResponseWin(ns,root,rootDepth,budget,memo)){
      memo.set(key,false);return false;
    }
  }
  memo.set(key,true);return true;
}

// 残り2組の「確実敗北」探索専用。
// 確実勝利探索とは逆に、最弱のまとまりから入口を調べる。
function orderCertainLossMovesForHand(hand,moves,revolution){
  if(!moves||!moves.length)return [];
  const part=optimalHandPartition(hand,revolution);

  const groupPower=new Map();
  for(const a of part.bundles){
    groupPower.set(certainCardSetKey(a.cards),certainMoveSearchPower(a,revolution));
  }
  for(const c of part.singles){
    const a={type:'single',n:1,rank:c.joker?16:c.rank,cards:[c]};
    groupPower.set(certainCardSetKey([c]),certainMoveSearchPower(a,revolution));
  }

  return [...moves]
    .map((a,idx)=>{
      const k=certainCardSetKey(a.cards);
      return {
        a,idx,
        // 現在の最適分割そのものに含まれるまとまりは、そのまとまりの強さを使う。
        // 分割を崩す入口は、その手自体の強さで並べる。
        power:groupPower.has(k)?groupPower.get(k):certainMoveSearchPower(a,revolution),
        preserving:groupPower.has(k)?0:1
      };
    })
    .sort((x,y)=>
      (x.power-y.power)||
      (x.preserving-y.preserving)||
      moveAnalysisKey(x.a).localeCompare(moveAnalysisKey(y.a))||
      (x.idx-y.idx)
    )
    .map(x=>x.a);
}

// root が「3位を相手に強制される」かを完全情報で判定する。
// 2位は敗北扱いしない。root の手番では、1つでも3位を回避できる合法行動があれば
// 「3位確定」ではない。相手の手番では、1つでも root の3位を強制できる応手があれば3位確定。
function certainFullResponseForcedLoss(s,root,budget,memo){
  if(!countCertainState(budget))return false;

  // 自分が合法上がりできた枝は1位または2位なので、3位ではない。
  // 反則上がりは3位回避とはみなさない。
  if(s.players[root].finished)return !!s.players[root].foul;

  // 【都落ちの終端判定】
  // 探索開始時点で富豪がまだ上がっていない場合、富豪以外が先に上がった時点で
  // 富豪の3位が確定する。
  // ・root自身が富豪なら、その瞬間にrootの3位確定。
  // ・rootが平民/貧民なら、もう一方の非富豪が先に上がればrootは2位確定なので3位ではない。
  const richIndex=s.players.findIndex(p=>p.role==='富豪');
  if(
    richIndex>=0&&
    !s.finishedAtStart?.[richIndex]&&
    !s.players[richIndex].finished
  ){
    if(root===richIndex){
      const newlyFinishedOpponent=s.players.findIndex((p,j)=>
        j!==root&&
        p.finished&&
        !(s.finishedAtStart&&s.finishedAtStart[j])
      );
      if(newlyFinishedOpponent>=0)return true;
    }else{
      const newlyFinishedNonRich=s.players.findIndex((p,j)=>
        j!==richIndex&&
        j!==root&&
        p.finished&&
        !(s.finishedAtStart&&s.finishedAtStart[j])
      );
      if(newlyFinishedNonRich>=0)return false;
    }
  }

  // root がまだ上がっておらず、他の2人がともに上がった時点で3位が確定する。
  // 探索開始時点ですでに1人上がっていた場合も、残る相手が先に上がればここで3位確定。
  if(s.players.every((p,j)=>j===root||p.finished))return true;

  const key='L3:'+certainSimKey(s,root,Infinity);
  if(memo.has(key))return memo.get(key);

  const i=s.turn;
  const allMoves=certainSimLegalMoves(s,i);
  const moves=i===root
    ?allMoves.filter(a=>!cpuIsUnsafeSinglePlusJokerPairInHand(root,s.players[root].hand,a,s.revolution))
    :allMoves;
  const canPass=!!s.pile;
  const actions=[...moves];
  if(canPass)actions.push(null);

  // 行動不能だけでは3位確定とは証明しない。
  if(!actions.length){
    memo.set(key,false);
    return false;
  }

  if(i===root){
    // 自分は3位を回避する最善手を選ぶ。
    // 1つでも3位を回避できる枝があれば、この局面は3位確定ではない。
    memo.set(key,true); // 再帰循環時は保守的に3位候補とする
    for(const a of actions){
      if(budget&&budget.cutoff){memo.set(key,false);return false}
      const ns=a?certainSimApplyMove(s,i,a):certainSimApplyPass(s,i);
      if(!certainFullResponseForcedLoss(ns,root,budget,memo)){
        memo.set(key,false);
        return false;
      }
    }
    memo.set(key,true);
    return true;
  }

  // 相手は root を3位にする最善応手を選ぶ。
  // 1つでも3位を強制できる枝があれば、そのルートは3位確定。
  memo.set(key,false);
  for(const a of actions){
    if(budget&&budget.cutoff){memo.set(key,false);return false}
    const ns=a?certainSimApplyMove(s,i,a):certainSimApplyPass(s,i);
    if(certainFullResponseForcedLoss(ns,root,budget,memo)){
      memo.set(key,true);
      return true;
    }
  }
  memo.set(key,false);
  return false;
}

function cpuMoveCertainForcedLossWithResponses(i,a,budget=null){
  // 完全情報が使える局面で、この入口から3位を相手に強制されるかを判定する。
  if(!cpuCanUseFullResponseSearch(i))return false;

  const s=cloneCertainSimFromGame();
  if(s.turn!==i)return false;

  const first=certainSimApplyMove(s,i,a);

  // この入口で合法上がりすれば1位または2位なので3位ではない。
  if(first.players[i].finished)return !!first.players[i].foul;

  return certainFullResponseForcedLoss(first,i,budget||createCertainSearchBudget(),new Map());
}

function cpuPassCertainForcedLossWithResponses(i,budget=null){
  // パスそのものも「3位確定か」を比較対象にする。
  if(!cpuCanUseFullResponseSearch(i)||!G.pile)return false;

  const s=cloneCertainSimFromGame();
  if(s.turn!==i)return false;

  const first=certainSimApplyPass(s,i);
  return certainFullResponseForcedLoss(first,i,budget||createCertainSearchBudget(),new Map());
}


// 残り2組専用：このまとまりを残した場合、相手が親で出し得るどの手にも
// まとまりを丸ごと使って応手できないことを完全情報で判定する。
// 通常モードでは完全情報探索が許可されている局面だけ使用し、未知手札を透視しない。
function cpuBundleCannotReplyToAnyOpponentLead(i,bundle){
  if(!bundle||!bundle.cards||!bundle.cards.length)return false;
  if(!cpuCanUseFullResponseSearch(i))return false;

  const opponents=G.players
    .map((p,j)=>({p,j}))
    .filter(x=>x.j!==i&&!x.p.finished);

  // 相手が誰も残っていないなら「死んだまとまり」とは扱わない。
  if(!opponents.length)return false;

  let opponentHasAnyLead=false;

  for(const {p:op} of opponents){
    const seenLead=new Set();

    for(const cs of combinations(op.hand)){
      for(const lead of analysesInState(cs,G.revolution)){
        const lk=moveAnalysisKey(lead);
        if(seenLead.has(lk))continue;
        seenLead.add(lk);

        // 相手自身の反則上がりになる最終手は、実際の有効な「出し得る手」から除く。
        if(op.hand.length===lead.n&&isFoulFinishInState(lead,G.revolution))continue;

        opponentHasAnyLead=true;

        // 8切りなら、その場は即座に流れるためこちらは応手できない。
        const leadCuts=
          lead.type!=='straight'&&lead.rank===8;
        if(leadCuts)continue;

        const responseRev=lead.revolution?!G.revolution:G.revolution;

        // 同じカード集合が応手時にもどのような分析になるかを再計算する。
        // 革命手を相手が出した場合にも、革命後の強さで正しく比較する。
        for(const reply of analysesInState(bundle.cards,responseRev)){
          if(reply.type!==lead.type||reply.n!==lead.n)continue;

          // Joker単騎に返せるのはスペード3単騎だけ。
          if(lead.type==='single'&&lead.rank===16){
            if(reply.cards.length===1&&reply.cards[0].id==='S3')return false;
            continue;
          }

          if(strength(reply.rank,responseRev)>strength(lead.rank,responseRev)){
            return false;
          }
        }
      }
    }
  }

  return opponentHasAnyLead;
}

function cpuMoveCertainFinishWithResponses(i,a,budget=null,depthOverride=null){
  // 最強モード、または通常モードでも「富豪が先に上がった1対1＋ブラインド特定済み」の
