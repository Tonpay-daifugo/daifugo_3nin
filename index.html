      }

      if(opponentHasJoker){
        const nonBundleMoves=legal.filter(a=>a.type==='single');

        if(nonBundleMoves.length){
          legal=nonBundleMoves;
        }else if(canPassAsActionEarly){
          if(await cpuTryPass(i))return;
        }
      }
    }
  }

  // パスも通常の行動候補として評価する。
  // 通常の合法手よりはかなり不利（2500点）だが、強い回避ペナルティが重なる局面ではパスを選べる。
  // 空場、1対1で相手残り3枚以下、富豪残り3枚以下で平民/貧民の誰もまだ応戦していない局面、
  // または平民/貧民残り3枚以下に対する富豪の絶対パス禁止局面では候補に入れない。
  if(canPassAsAction&&!certainNow.length&&legal.length&&!twoCardLockMove){
    const best=legal[0];
    const bestScore=preferredScore(best);
    const passScore=2500;
    if(passScore<bestScore){
      if(await cpuTryPass(i))return;
    }
  }

  // 残り2枚条件で現在縛りを起こせる場合は、その縛り手を採用する。
  // 確実上がりルートは runCpu 前半で既に即時採用されているため、ここでは競合しない。
  if(twoCardLockMove){
    await playMove(i,twoCardLockMove);
    return;
  }
  if(!legal.length&&!G.pile&&nonFoulLegal.length){
    legal=[...availableNonFoulLegal()];
  }

  // 最終フォールバック：
  // 空場ではパスできないため、絶対条件同士が両立せず「安全な合法手」が0件になった場合でも
  // ゲームを停止させない。実際にルール上出せる rawLegal から必ず1手選ぶ。
  // これは通常の優先順位では使わず、nonFoulLegal すら0件の不可避局面だけで発動する。
  if(!legal.length&&!G.pile&&rawLegal.length){
    legal=rawLegal.filter(a=>!isAbsoluteForbidden(a));
  }

  if(!legal.length){
    // 場札がある場合は、絶対禁止後に出せる札が0件ならパスする。
    if(G.pile){
      if(await cpuTryPass(i,legal))return;
    }else{
      // 親ではパスできないため、反則上がり回避を破らない nonFoulLegal のみから救済する。
      // rawLegal は使わず、「反則札だけを残す手」を復活させない。
      if(nonFoulLegal.length){
        legal=[...nonFoulLegal];
      }
    }

    // それでも0件なら理論上の異常状態。停止ループを避けるため手番を再評価する。
    if(!legal.length){
      G.turn=i;
      render();
      setTimeout(runCpu,0);
      return;
    }
  }
  await playMove(i,legal[0]);
  return;
  }finally{
    CPU_RICH_CERTAIN_WIN_PASS_BLOCK=-1;
    CPU_RUN_ACTIVE=false;
  }
}
function setupGame(next=false){
  const old=G;
  CPU_MODE_LOCKED=false;
  CPU_RUN_ACTIVE=false;
  CPU_RICH_CERTAIN_WIN_PASS_BLOCK=-1;
  const startsNewSet=!next||old.gameInSet===4;
  const setNo=!next?1:(startsNewSet?old.setNo+1:old.setNo);
  const gameInSet=!next?1:(startsNewSet?1:old.gameInSet+1);
  let blind;
  if(startsNewSet){
    const candidates=makeDeck().filter(c=>!c.joker);
    blind=candidates[Math.floor(Math.random()*candidates.length)];
  }else blind=old.blind;
  const deck=shuffle(makeDeck().filter(c=>c.id!==blind.id));

  // 同一セットの第2～4ゲームでは、直前ゲームの確定順位から階級を復元する。
  // 表示処理などで old.players[].role が誤って変化していても、全員平民になることを防ぐ。
  let carriedRoles=['平民','平民','平民'];
  if(!startsNewSet&&next){
    const prevOrder=(old.gameHistory&&old.gameHistory.length)
      ?old.gameHistory[old.gameHistory.length-1].order
      :old.lastOrder;
    if(prevOrder&&prevOrder.length===3){
      carriedRoles=[null,null,null];
      carriedRoles[prevOrder[0]]='富豪';
      carriedRoles[prevOrder[1]]='平民';
      carriedRoles[prevOrder[2]]='貧民';
    }else{
      carriedRoles=old.players.map(p=>p.role);
    }
  }

  const players=[0,1,2].map(i=>{const hand=deck.slice(i*13,(i+1)*13);return {hand,initialHandIds:hand.map(c=>c.id),knownOwnedCardIds:hand.map(c=>c.id),role:startsNewSet?'平民':(next?carriedRoles[i]:'平民'),passed:false,finished:false,foul:false,exchangeGaveNonJoker:false}});
  const cpuBlindKnowledge=startsNewSet?[null,null,null]:[...((old&&old.cpuBlindKnowledge)||[null,null,null])];

  // セット内だけ持ち越すブラインド推定用の記憶。
  // 第1ゲームで富豪/平民になったCPUは「出た数字＋スート」を保持し、
  // 次ゲーム以降の観測と照合してブラインド候補を絞る。
  // 新セットでは全て破棄する。
  const cpuBlindRankHistory=startsNewSet
    ?[[],[],[]]
    :((old&&old.cpuBlindRankHistory)||[[],[],[]]).map(x=>(x||[]).map(v=>[...(v||[])]));
  const cpuBlindCandidateIds=startsNewSet
    ?[null,null,null]
    :((old&&old.cpuBlindCandidateIds)||[null,null,null]).map(x=>x?[...x]:null);
  const cpuBlindInferenceActive=startsNewSet
    ?[false,false,false]
    :[...((old&&old.cpuBlindInferenceActive)||[false,false,false])];

  G={players,blind,pile:null,pileHistory:[],lead:null,turn:0,revolution:false,lock:null,selected:new Set(),finishers:[],lastOrder:null,lastPoints:[0,0,0],scores:next?[...old.scores]:[0,0,0],gameHistory:next?[...(old.gameHistory||[])]:[],gameNo:next?old.gameNo+1:1,setNo,gameInSet,over:false,resultPending:false,resultModalShown:false,phase:'setup',pendingExchange:null,jokerPlayed:false,spade3Played:false,playedCardIds:[],playedByRecords:[],lastPlayedMove:null,lastClearPassContext:null,cpuBlindKnowledge,cpuBlindRankHistory,cpuBlindCandidateIds,cpuBlindInferenceActive,receivedFlashCardId:null,receivedFlashUntil:0,richFoulCoup:false,commonPoorRevolutionLock:0,commonPoorNoLeadRevolutionOnce:false,turnCount:0,trickPassers:new Set(),eightCutPending:false};
  $('#log').innerHTML='';
  addLog(`第${G.setNo}セット・第${G.gameInSet}ゲームの準備を開始しました`);
  render();
  if(startsNewSet){
    // 第1セットは直接開始プレイヤーを選ぶ。第2セット以降は「セット開始」を経由する。
    if(G.setNo===1)showStarterChoice();
    else showSetStart();
  }else{
    G.turn=old.lastOrder[2];
    beginExchange(old.lastOrder);
  }
}
function startPreparedGame(){
  CPU_MODE_LOCKED=true;
  // 交換・開始画面の状態を完全に解除してからゲームへ入る。
  $('#modal').classList.remove('show','starterLight','resultLight','exchangeLight');
  document.body.classList.remove('exchangePhase');
  G.over=false;
  G.players.forEach(p=>p.passed=false);
  G.phase='playing';
  G.selected.clear();
  sortHand(G.players[0].hand);
  addLog(`第${G.setNo}セット・第${G.gameInSet}ゲーム開始。${playerLabel(G.turn)}からです`);
  render();
  if(G.receivedFlashCardId){
    const flashId=G.receivedFlashCardId;
    const delay=Math.max(0,(G.receivedFlashUntil||0)-Date.now());
    setTimeout(()=>{if(G.receivedFlashCardId===flashId){G.receivedFlashCardId=null;G.receivedFlashUntil=0;render()}},delay);
  }
  if(G.turn!==0)setTimeout(runCpu,500);
}

function strongestCardCandidates(hand){
  const max=Math.max(...hand.map(c=>strength(c.rank,false)));
  return hand.filter(c=>strength(c.rank,false)===max).sort((a,b)=>(a.suit||'Z').localeCompare(b.suit||'Z'));
}


function optimalHandPartition(hand,revolution=false){
  // 手札全体を、合法な「まとまり」と単品へ重複なく分割する。
  // 評価は ①総組数が最少 ②同数なら単品数が最少。
  // 最大13枚なのでビットDPで厳密探索する。
  const n=hand.length;
  if(!n)return {bundles:[],singles:[],groupCount:0,singleCount:0};

  const idToIndex=new Map(hand.map((c,idx)=>[c.id,idx]));
  const meldByMask=new Map();

  for(const cs of combinations(hand)){
    if(cs.length<2)continue;
    for(const a of analysesInState(cs,revolution)){
      if(a.type==='single')continue;
      if(a.type==='group'&&a.n<2)continue;
      if(a.type==='straight'&&a.n<3)continue;
      let mask=0;
      for(const c of a.cards){
        const idx=idToIndex.get(c.id);
        if(idx===undefined){mask=0;break}
        mask|=(1<<idx);
      }
      if(!mask)continue;
      // 同じカード集合に複数のJoker階段解釈がある場合は、
      // 同じ枚数なら現在の革命状態で最も強い階段解釈を残す。
      if(!meldByMask.has(mask)){
        meldByMask.set(mask,{mask,a});
      }else{
        const prev=meldByMask.get(mask);
        const bothJokerStraights=
          prev.a.type==='straight'&&prev.a.cards.some(c=>c.joker)&&
          a.type==='straight'&&a.cards.some(c=>c.joker);
        if(
          bothJokerStraights&&
          strength(a.rank,revolution)>strength(prev.a.rank,revolution)
        ){
          meldByMask.set(mask,{mask,a});
        }
      }
    }
  }

  // 【まとまり判定・Joker階段】
  // Jokerを使う階段候補が複数ある場合は、手札全体を横断して
  // ①最も枚数が多い階段だけを残し、
  // ②同じ枚数なら現在の革命状態で最も強い階段だけを残す。
  // これは「まとまり」の認識だけを制限する処理で、合法手自体は削除しない。
  // そのため、S3優先などの特例やパス禁止条件では必要に応じて崩して出せる。
  {
    const jokerStraights=[...meldByMask.entries()].filter(([,m])=>
      m.a.type==='straight'&&m.a.cards.some(c=>c.joker)
    );

    if(jokerStraights.length>1){
      const maxN=Math.max(...jokerStraights.map(([,m])=>m.a.n));
      const longest=jokerStraights.filter(([,m])=>m.a.n===maxN);

      let strongest=longest[0];
      for(const entry of longest.slice(1)){
        if(
          strength(entry[1].a.rank,revolution)>
          strength(strongest[1].a.rank,revolution)
        ){
          strongest=entry;
        }
      }

      const keepMask=strongest[0];
      for(const [mask,m] of jokerStraights){
        if(mask!==keepMask)meldByMask.delete(mask);
      }
    }
  }

  const melds=[...meldByMask.values()];
  const containing=Array.from({length:n},()=>[]);
  for(const m of melds){
    for(let i=0;i<n;i++)if((m.mask>>i)&1)containing[i].push(m);
  }

  const memo=new Map();
  function solve(mask){
    if(mask===0)return {groupCount:0,singleCount:0,bundles:[],singles:[]};
    if(memo.has(mask))return memo.get(mask);

    let first=0;
    while(first<n&&((mask>>first)&1)===0)first++;

    // first を単品にする場合
    const singleRest=solve(mask&~(1<<first));
    let best={
      groupCount:singleRest.groupCount+1,
      singleCount:singleRest.singleCount+1,
      bundles:singleRest.bundles,
      singles:[hand[first],...singleRest.singles]
    };

    // first を含むまとまりを採用する場合
    for(const m of containing[first]){
      if((m.mask&mask)!==m.mask)continue;
      const rest=solve(mask&~m.mask);
      const cand={
        groupCount:rest.groupCount+1,
        singleCount:rest.singleCount,
        bundles:[m.a,...rest.bundles],
        singles:rest.singles
      };
      if(
        cand.groupCount<best.groupCount ||
        (cand.groupCount===best.groupCount&&cand.singleCount<best.singleCount)
      ){
        best=cand;
      }
    }

    memo.set(mask,best);
    return best;
  }

  return solve((1<<n)-1);
}


// 指定した手が、「現在採用されている1つの分割」だけでなく、
// 同じ最小組数・同じ最小単品数を達成する別の最適分割の1組として成立するか判定する。
// これにより、同率の別分割ならまとまりを崩さず出せる手を誤って「分割崩し」としない。
function cpuMoveFitsAnyEqualOptimalPartition(hand,revolution,move,basePartition){
  if(!move||!move.cards||!move.cards.length)return false;

  const used=new Set(move.cards.map(c=>c.id));
  const remaining=hand.filter(c=>!used.has(c.id));
  const rest=optimalHandPartition(remaining,revolution);

  const moveIsSingle=move.type==='single'&&move.cards.length===1;
  const totalGroups=rest.groupCount+1;
  const totalSingles=rest.singleCount+(moveIsSingle?1:0);

  return (
    totalGroups===basePartition.groupCount&&
    totalSingles===basePartition.singleCount
  );
}


// 【優先】最小組数が同じでも単品数が異なる分け方がある場合、
// 現在の場に対して「まとまりを崩さず合法手を出せる」分け方を優先する。
// これは通常の出札評価用であり、上位の確実上がり・3位回避探索そのものは変更しない。
function cpuPartitionAvoidingPass(hand,revolution,basePartition,legalMoves){
  if(!G.pile||!legalMoves||!legalMoves.length)return basePartition;

  const key=a=>a.cards.map(c=>c.id).sort().join('|');
  const baseGroupKeys=new Set([
    ...basePartition.bundles.map(key),
    ...basePartition.singles.map(c=>c.id)
  ]);

  // 既存の最適分割のまとまりをそのまま出せるなら、すでにパス不要なので変更しない。
  const baseCanRespond=legalMoves.some(a=>baseGroupKeys.has(key(a)));
  if(baseCanRespond)return basePartition;

  const candidates=[];
  for(const a of legalMoves){
    // 追加条件：
    // 残り手札が5組以上の時、この「パスしなくて済む分け方」のために
    // Jokerを使う出し方は採用しない。
    if(basePartition.groupCount>=5&&a.cards.some(c=>c.joker))continue;

    const used=new Set(a.cards.map(c=>c.id));
    const remaining=hand.filter(c=>!used.has(c.id));
    const rest=optimalHandPartition(remaining,revolution);

    const candidateGroupCount=rest.groupCount+1;
    if(candidateGroupCount!==basePartition.groupCount)continue;

    const isSingle=a.type==='single'&&a.cards.length===1;
    const candidateSingleCount=rest.singleCount+(isSingle?1:0);

    // 新条件は「同じ組数だが単品数が異なる分け方」がある場合だけ適用する。
    if(candidateSingleCount===basePartition.singleCount)continue;

    const cand=isSingle
      ?{
          groupCount:candidateGroupCount,
          singleCount:candidateSingleCount,
          bundles:[...rest.bundles],
          singles:[a.cards[0],...rest.singles]
        }
      :{
          groupCount:candidateGroupCount,
          singleCount:candidateSingleCount,
          bundles:[a,...rest.bundles],
          singles:[...rest.singles]
        };

    candidates.push({partition:cand,move:a});
  }

  if(!candidates.length)return basePartition;

  // パスを避けられる候補同士では、従来の評価方針を残し、単品数が少ない方を採用する。
  // 同数なら弱い札を含む応手を先にして決定を安定させる。
  candidates.sort((x,y)=>
    x.partition.singleCount-y.partition.singleCount ||
    certainMoveSearchPower(x.move,revolution)-certainMoveSearchPower(y.move,revolution) ||
    key(x.move).localeCompare(key(y.move))
  );

  return candidates[0].partition;
}


function isSpade3InOptimalBundle(hand,revolution=false){
  const s3=hand.find(c=>c.id==='S3');
  if(!s3)return false;
  const part=optimalHandPartition(hand,revolution);
  return part.bundles.some(a=>a.cards.some(c=>c.id==='S3'));
}

function exchangeProtectedCardIds(hand){
  // 交換前手札を「組数最少→同数なら単品最少」で最適分割し、
  // その分割で採用されたまとまりだけを保護する。
  const part=optimalHandPartition(hand,false);
  const protectedIds=new Set();
  for(const a of part.bundles)for(const c of a.cards)protectedIds.add(c.id);
  return protectedIds;
}

function richExchangeCard(hand){
  // まとまりになっていない単品のうち最弱を渡す。8と2は除外。
  const protectedIds=exchangeProtectedCardIds(hand);
  const rankCounts={};
  for(const c of hand)if(!c.joker)rankCounts[c.rank]=(rankCounts[c.rank]||0)+1;

  const candidates=hand.filter(c=>
    !c.joker &&
    c.rank!==8 &&
    c.rank!==15 &&
    rankCounts[c.rank]===1 &&
    !protectedIds.has(c.id)
  );

  if(candidates.length){
    const ordered=[...candidates].sort((a,b)=>
      strength(a.rank,false)-strength(b.rank,false) ||
      (a.suit||'Z').localeCompare(b.suit||'Z')
    );
    const lowSingles=ordered.filter(c=>c.rank<=5);
    // 5以下の単品が複数ある場合は、その中で2番目に弱いものを渡す。
    if(lowSingles.length>=2)return lowSingles[1];
    return ordered[0];
  }

  // 条件を満たす単品がない場合の安全なフォールバック。
  // まず8・2を除いた非Joker最弱、それもなければ従来の最弱。
  const fallback=hand.filter(c=>!c.joker&&c.rank!==8&&c.rank!==15);
  if(fallback.length){
    return [...fallback].sort((a,b)=>
      strength(a.rank,false)-strength(b.rank,false) ||
      (a.suit||'Z').localeCompare(b.suit||'Z')
    )[0];
  }
  return weakestCard(hand);
}
function weakestCard(hand){return [...hand].sort((a,b)=>strength(a.rank,false)-strength(b.rank,false)||(a.suit||'Z').localeCompare(b.suit||'Z'))[0]}
function beginExchange(order){
  G.phase='exchange';
  const rich=order[0],poor=order[2],common=order[1];
  // 交換画面に入る直前にも階級を確定順位から同期する。
  G.players[rich].role='富豪';
  G.players[common].role='平民';
  G.players[poor].role='貧民';
  render();
  const poorCandidates=strongestCardCandidates(G.players[poor].hand);
  const poorCard=poorCandidates[0];
  if(rich===0){
    G.pendingExchange={rich,poor,poorCard,poorCandidates,chosen:null};
    showExchange();
  }else{
    const richCard=richExchangeCard(G.players[rich].hand);
    if(poor===0){
      G.pendingExchange={rich,poor,poorCard,poorCandidates,richCard};
      showPoorExchangePreview();
    }else{
      completeExchange({rich,poor,poorCard,richCard});
    }
  }
}
function completeExchange({rich,poor,poorCard,richCard}){
  // 次ゲームの開始プレイヤーは前ゲームの貧民。
  // setupGame 側の値に依存せず、交換完了時にも明示して操作不能を防ぐ。
  G.turn=poor;
  G.players[rich].hand=G.players[rich].hand.filter(c=>c.id!==richCard.id);
  G.players[poor].hand=G.players[poor].hand.filter(c=>c.id!==poorCard.id);
  G.players[rich].hand.push(poorCard);
  G.players[poor].hand.push(richCard);
  // CPUは交換で自分が持ったカードも、自分の所持履歴として記憶する。
  G.players[rich].knownOwnedCardIds=Array.from(new Set([...(G.players[rich].knownOwnedCardIds||[]),poorCard.id]));
  G.players[poor].knownOwnedCardIds=Array.from(new Set([...(G.players[poor].knownOwnedCardIds||[]),richCard.id]));
  // 貧民CPUは、自分が富豪へ渡した札がジョーカーだったかを当該ゲーム中記憶する。
  G.players[poor].exchangeGaveNonJoker=!poorCard.joker;
  // 人間プレイヤーが交換でもらったカードを、ゲーム開始後約2秒間点滅させる。
  const receivedByHuman=rich===0?poorCard:(poor===0?richCard:null);
  G.receivedFlashCardId=receivedByHuman?receivedByHuman.id:null;
  G.receivedFlashUntil=receivedByHuman?Date.now()+2000:0;
  sortHand(G.players[0].hand);
  G.pendingExchange=null;
  if(rich===0||poor===0){
    addLog(`${playerLabel(rich)}は ${cardText(richCard)}、${playerLabel(poor)}は ${cardText(poorCard)} を渡して交換しました`);
    closeModal(false);
    startPreparedGame();
  }else{
    addLog('富豪と貧民のカード交換が完了しました（交換内容は非公開）');
    closeModal(false);
    startPreparedGame();
  }
}

$('#rulesBtn').onclick=()=>{const box=$('#modalbox');box.classList.remove('exchangeSevenWide');box.classList.add('rulesHalfWidth');box.innerHTML=`<h2>採用ルール</h2><div class="rules"><p><b>構成：</b>3人、通常札39枚（♠♥♦の3スート）＋ジョーカー1枚、ブラインド1枚、各13枚。ブラインドカードは4ゲームを1セットとして固定し、第4ゲーム終了後に確認できます。</p><p><b>強さ：</b>3＜4＜…＜A＜2＜JK。革命中は数字が逆転し、JKは常に最強。</p><p><b>出し方：</b>1枚、同ランク2枚以上、同一スートで3枚以上の階段。ジョーカーは不足カードの代用可。</p><p><b>特殊ルール：</b>3枚以上の同ランク出しで革命、8切り、スペ3返し、スート縛り（ジョーカーは縛りの不足スートを代用可能）、最強階段。</p><p><b>最強階段：</b>通常時におけるA-2-JKの3枚階段、ならびに革命時における3-4-JKの3枚階段は最強階段とします。最強階段が出された場合、場は直ちに流れます。</p><p><b>パス：</b>一度パスすると場が流れるまで復帰不可。場が流れて空場になった直後はパス不可。</p><p><b>反則上がり：</b>通常時の2、革命時の3、ジョーカーを含む手での上がり。8は階段以外では絶対に上がれず、スペード3は単騎上がりが反則です。</p><p><b>セット開始：</b>4ゲームを1セットとします。第1セットは開始プレイヤーを直接選び、第2セット以降は「セット開始」を押した後に選択します。新セットの第1ゲームは全員平民で、カード交換は行いません。</p><p><b>得点：</b>通常ゲームは富豪6点、平民3点、貧民0点。各セットの第4ゲームのみ富豪8点。得点は最初からやり直すまで累積し、ゲーム別得点も表示します。</p><p><b>都落ち：</b>前ゲームの富豪がまだ上がっていない状態で他のプレイヤーが合法的に上がると、その人が富豪、残る1人が平民、旧富豪が貧民となり、その時点でゲーム終了です。</p><p><b>効果音：</b>出札、パス、8切り、革命・革命返しで異なる音が鳴ります。画面上部のスライダーで音量を調節できます。</p><p><b>カード交換：</b>第2～4ゲームでは富豪と貧民が1枚交換します。富豪は相手のカードを受け取る前に渡す1枚を選びます。貧民の最強ランクが複数枚ある場合、貧民本人は渡すスートを選べます。交換完了後にゲームを開始し、前ゲームの貧民から始めます。新セットの第1ゲームは交換しません。</p><p class="small"></p></div><button class="btn" id="rulesClose">閉じる</button>`;$('#rulesClose').onclick=closeModal;openModal()};
