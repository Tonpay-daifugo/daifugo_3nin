  // 完全情報局面では第2段階探索を行う。
  if(!cpuCanUseFullResponseSearch(i))return false;
  const s=cloneCertainSimFromGame();
  if(s.turn!==i)return false;

  const rootHand=s.players[i].hand;
  const groups=optimalHandPartition(rootHand,s.revolution).groupCount;
  let depth=depthOverride;
  if(depth==null){
    const headsUpFullInfoDepth=cpuFullInfoHeadsUpDepth(i,groups);
    if(headsUpFullInfoDepth!==null){
      depth=headsUpFullInfoDepth;
    }else{
      // 3人局面などは従来の最強モード相当の深度。
      depth=(groups>=6?2:groups===5?4:groups===4?4:Infinity);
    }
  }

  const first=certainSimApplyMove(s,i,a);
  if(first.players[i].finished)return !first.players[i].foul;
  const remainingDepth=depth===Infinity?Infinity:Math.max(0,depth-1);
  return certainFullResponseWin(first,i,remainingDepth,budget,new Map());
}

function cpuMoveCertainFinishSteps(i,a,memo=new Map()){
  const p=G.players[i];
  const used=new Set(a.cards.map(c=>c.id));
  const remaining=p.hand.filter(c=>!used.has(c.id));
  if(!remaining.length)return isFoulFinish(a)?Infinity:1;
  const nextRev=a.revolution?!G.revolution:G.revolution;
  const keepsControl=moveClearsPileWithoutOpponent(a,G.revolution)||cpuCanProveLeadMoveUnanswerable(i,a,G.revolution,null,true);
  if(!keepsControl)return Infinity;
  const rest=certainRunOutMinSteps(i,remaining,nextRev,memo);
  return Number.isFinite(rest)?1+rest:Infinity;
}
function cpuEightMoveThenNextFinish(i,a){
  if(!(a&&(a.type==='single'||(a.type==='group'&&a.n===2))&&a.cards.some(c=>!c.joker&&c.rank===8)))return false;
  const p=G.players[i],used=new Set(a.cards.map(c=>c.id));
  const remaining=p.hand.filter(c=>!used.has(c.id));
  if(!remaining.length)return false;
  return analysesInState(remaining,G.revolution).some(x=>!isFoulFinishInState(x,G.revolution));
}

function cpuCanProveNoRevolutionReturn(i,move){
  if(!move||!move.revolution)return false;
  if(move.type==='group'&&move.n===4&&move.cards.some(c=>c.joker))return true;
  if(move.n!==3)return false;
  const mem=cpuMemory(i),nextRev=!G.revolution;
  const unavailable=new Set([...mem.current,...mem.played]);
  for(const c of move.cards)unavailable.add(c.id);
  if(mem.blindId)unavailable.add(mem.blindId);
  const unseen=makeDeck().filter(c=>!unavailable.has(c.id));

  // 革命返しの探索は「ちょうど3枚」の組み合わせだけに限定する。
  // 4枚以上の部分集合は生成しない。
  for(let a=0;a<unseen.length-2;a++){
    for(let b=a+1;b<unseen.length-1;b++){
      for(let c=b+1;c<unseen.length;c++){
        const cs=[unseen[a],unseen[b],unseen[c]];
        for(const cand of analyses(cs)){
          if(!cand.revolution||cand.n!==3)continue;
          if(strength(cand.rank,nextRev)>strength(move.rank,nextRev))return false;
        }
      }
    }
  }
  return true;
}
function cpuRevolutionExceptionCertain(i,a){
  if(!a.revolution||!cpuCanProveNoRevolutionReturn(i,a))return false;
  const p=G.players[i],used=new Set(a.cards.map(c=>c.id));
  const remaining=p.hand.filter(c=>!used.has(c.id));
  if(!remaining.length)return !isFoulFinish(a);
  return canCertainlyRunOutWithoutOpponent(i,remaining,!G.revolution);
}
function cpuPoorMayUseS3BeforeJoker(i){
  const p=G.players[i];
  return p.role==='貧民'&&p.exchangeGaveNonJoker===true;
}


async function runCpu(){
  if(G.over||G.phase!=='playing'||G.turn===0)return;
  const i=G.turn,p=G.players[i];
  await sleep(450);
  if(G.over||G.phase!=='playing'||G.turn!==i)return;

  // 同じCPU手番に対する重複 runCpu() をここで遮断する。
  // 1本目が探索・エフェクト待ち・playMove() 中なら、後から来た呼び出しは何もしない。
  if(CPU_RUN_ACTIVE)return;
  CPU_RUN_ACTIVE=true;
  CPU_RICH_CERTAIN_WIN_PASS_BLOCK=-1;

  try{

  // 空場ではそのCPUは必ず親。過去のpassed状態が残っていても強制解除する。
  if(!G.pile){
    p.passed=false;
    G.lead=null;
  }

  if(G.pile&&p.passed){
    if(!G.trickPassers)G.trickPassers=new Set();
    G.trickPassers.add(i);
    if(checkFlow()){
      render();
      setTimeout(runCpu,400);
      return;
    }
    G.turn=nextActive(i);
    render();
    setTimeout(runCpu,100);
    return;
  }

  const rawLegal=allLegal(p);

  // 場札に対する合法な応手が0枚なら、パスは戦略的選択ではなく強制。
  // 残り1組の相手が次に上がれる場合でも、「パス禁止」で停止させず即パスする。
  // また、この場合は最適分割や確実探索を行う必要がないので先に処理する。
  if(G.pile&&rawLegal.length===0){
    if(await cpuTryPass(i))return;
  }

  // 反則上がりそのもの、および「出した後に反則札しか残らない手」を最上位で除外する。
  // 後者は後段の候補復活・フォールバックでも絶対に戻さない。
  const leavesOnlyFoulMoveKeys=new Set(
    rawLegal
      .filter(a=>moveLeavesOnlyFoulCards(p,a))
      .map(a=>a.cards.map(c=>c.id).sort().join('|'))
  );

  const nonFoulLegal=rawLegal.filter(a=>
    !(p.hand.length===a.n&&isFoulFinish(a)) &&
    !leavesOnlyFoulMoveKeys.has(a.cards.map(c=>c.id).sort().join('|'))
  );

  // 【絶対】1枚しかない数字＋Jokerで作るペアについて、
  // 相手がそれより強い自然ペアを持つ可能性がある場合は出さない。
  // 場札があって他に出せる手がない場合は、この危険ペアを候補から外したまま後段のパス判定へ進む。
  const unsafeJokerPairMoveKeys=new Set(
    nonFoulLegal
      .filter(a=>cpuIsUnsafeSinglePlusJokerPairInHand(i,p.hand,a,G.revolution))
      .map(a=>a.cards.map(c=>c.id).sort().join('|'))
  );

  const safeNonFoulLegal=nonFoulLegal.filter(a=>
    !unsafeJokerPairMoveKeys.has(a.cards.map(c=>c.id).sort().join('|'))
  );

  // 空場ではパスできないため、危険ペア以外に合法手が一切ない場合だけ
  // ゲームを停止させないため元の合法手を残す。場札がある場合は0件のままパスへ進める。
  let legal=(safeNonFoulLegal.length||G.pile)
    ?[...safeNonFoulLegal]
    :[...nonFoulLegal];

  // 同一CPU手番・同一手札・同一革命状態では最適分割は不変なので、
  // runCpu() 内では1回だけ計算し、後続の全判定で共有する。
  const currentOptimalPartition=optimalHandPartition(p.hand,G.revolution);

  // 1手番内で確実経路探索の結果を共有する。
  const certainStepsByKey=new Map();
  const moveKey=a=>a.cards.map(c=>c.id).sort().join('|');
  // 確実上がりは最上位なので、反則上がり関連だけを除いた全合法手から探索する。
  // Joker温存・3位回避・死んだまとまり等の下位条件では入口を削らない。
  const topCertainLegal=[...nonFoulLegal];

  // 【最上位・絶対】自分の残り手札から、相手に手番を渡さず合法的に上がれる、
  // または相手が返してきてもその後の応手を含めて確実に上がれるルートが存在する場合、
  // 他のすべての絶対条件・優先条件より先にそのルートだけを残す。
  {
    // 1枚も出していないプレイヤーが2人以上いる間は、
    // 第1段階・第2段階とも確実手順探索を行わない。
    const skipCertainFinishSearch=hasTwoOrMorePlayersWhoHaveNeverPlayed();

    const orderedTop=orderCertainMovesForHand(
      p.hand,
      topCertainLegal,
      G.revolution
    );
    const stage1PreservingOnly=currentOptimalPartition.groupCount>=7;
    const orderedStage1=stage1PreservingOnly
      ?orderCertainMovesForHand(
          p.hand,
          topCertainLegal,
          G.revolution,
          true
        )
      :orderedTop;
    let firstTopCertain=null;

    const searchStage1AtDepth=(a,depthOverride,budget,preservingOnly=false)=>{
      const used=new Set(a.cards.map(c=>c.id));
      const remaining=p.hand.filter(c=>!used.has(c.id));
      if(!remaining.length)return isFoulFinish(a)?Infinity:1;
      const nextRev=a.revolution?!G.revolution:G.revolution;
      const keepsControl=
        moveClearsPileWithoutOpponent(a,G.revolution)||
        cpuCanProveLeadMoveUnanswerable(i,a,G.revolution,null,true);
      if(!keepsControl)return Infinity;
      const memo=new Map();
      const rest=certainRunOutMinStepsBounded(i,remaining,nextRev,memo,depthOverride,budget,preservingOnly);
      return Number.isFinite(rest)?1+rest:Infinity;
    };

    // 第1段階：相手が一度も返せない確実経路。
    // 7組以上では、探索開始時の最適分割を固定し、そのまとまりを一切崩さず終局まで探索する。
    // この専用探索では、全入口で1つのbudgetを共有し、合計20,000局面に達した時点で探索全体を打ち切る。
    // 7組未満では従来の可変深度探索を使う。
    // 第2段階でも使うため、これらは分岐の外側で宣言する。
    let depthReduction=0;
    let remainingEntries=[];
    if(!skipCertainFinishSearch&&stage1PreservingOnly){
      const stage1Budget=createCertainSearchBudget();
      firstTopCertain=cpuStage1FixedPartitionCertainRoute(
        i,
        topCertainLegal,
        stage1Budget
      );
      // budget.cutoff の場合も別入口用のbudgetは作り直さない。
      // 確実上がりが見つからなければ、このまま第2段階を飛ばして通常の優先条件スコア評価へ進む。
    }else if(!skipCertainFinishSearch){
      depthReduction=0;
      remainingEntries=[...orderedStage1];
      const stage1Budget=createCertainSearchBudget();

      while(!firstTopCertain&&remainingEntries.length&&!stage1Budget.cutoff){
        const attemptedThisDepth=new Set();
        let cutoff=false;

        for(const a of remainingEntries){
          const k=moveKey(a);
          attemptedThisDepth.add(k);
          const used=new Set(a.cards.map(c=>c.id));
          const rem=p.hand.filter(c=>!used.has(c.id));
          const nextRev=a.revolution?!G.revolution:G.revolution;
          let d=cpuCertainSearchDepthForState(rem,nextRev);
          if(d===Infinity){
            if(depthReduction>0)d=Math.max(1,5-depthReduction);
          }else{
            d=Math.max(1,d-depthReduction);
          }

          const steps=searchStage1AtDepth(a,d,stage1Budget,false);
          certainStepsByKey.set(k,steps);
          if(Number.isFinite(steps)){firstTopCertain=a;break}
          if(stage1Budget.cutoff){cutoff=true;break}
        }
        if(firstTopCertain||!cutoff||stage1Budget.cutoff)break;
        remainingEntries=remainingEntries.filter(a=>!attemptedThisDepth.has(moveKey(a)));
        depthReduction++;
        if(depthReduction>5)break;
      }
    }

    // 第2段階：相手の合法な全応手を含め、入口順を最初から探索し直す。
    if(
      !skipCertainFinishSearch&&
      !firstTopCertain&&
      !stage1PreservingOnly&&
      cpuCanUseFullResponseSearch(i)
    ){
      depthReduction=0;
      remainingEntries=[...orderedTop];
      while(!firstTopCertain&&remainingEntries.length){
        const budget=createCertainSearchBudget();
        const attemptedThisDepth=new Set();
        let cutoff=false;

        for(const a of remainingEntries){
          const k=moveKey(a);
          attemptedThisDepth.add(k);
          const groups=currentOptimalPartition.groupCount;
          const headsUpDepth=cpuFullInfoHeadsUpDepth(i,groups);
          let d=headsUpDepth!==null
            ?headsUpDepth
            :(groups>=6?2:groups===5?4:groups===4?4:Infinity);
          if(d===Infinity){
            if(depthReduction>0)d=Math.max(1,5-depthReduction);
          }else{
            d=Math.max(1,d-depthReduction);
          }

          if(cpuMoveCertainFinishWithResponses(i,a,budget,d)){
            certainStepsByKey.set(k,1);
            firstTopCertain=a;
            break;
          }
          if(budget.cutoff){cutoff=true;break}
        }
        if(firstTopCertain||!cutoff)break;
        remainingEntries=remainingEntries.filter(a=>!attemptedThisDepth.has(moveKey(a)));
        depthReduction++;
        if(depthReduction>5)break;
      }
    }

    if(firstTopCertain){
      // 【最上位・絶対】
      // 確実上がりルートが見つかった時点で、他の絶対条件・優先条件・パス評価へ進まず即採用する。
      // firstTopCertain は nonFoulLegal から探索しており、探索側でも反則上がりを除外済み。
      await playMove(i,firstTopCertain);
      return;
    }
    var TOP_CERTAIN_ROUTE_ACTIVE=false;
  }


  // 下位の絶対条件で禁止した手を、後段の候補復元で復活させないための手番内記録。
  const absoluteForbiddenMoveKeys=new Set();
  const forbidAbsoluteMove=a=>absoluteForbiddenMoveKeys.add(moveKey(a));
  const isAbsoluteForbidden=a=>absoluteForbiddenMoveKeys.has(moveKey(a));
  const availableNonFoulLegal=()=>nonFoulLegal.filter(a=>!isAbsoluteForbidden(a));
  const applyAbsoluteForbidden=()=>{
    legal=legal.filter(a=>!isAbsoluteForbidden(a));
  };

  // 【反則上がり回避・絶対】終盤で、ある手を出すと反則札だけが残る一方、
  // 別の合法手なら非反則札を最後に残せる場合は、後者だけを候補にする。
  // 例：10+JK なら 10→JK は反則になるため除外し、JK→10 を残す。
  if(legal.length){
    const nonDeadEnd=legal.filter(a=>
      !leavesOnlyFoulMoveKeys.has(a.cards.map(c=>c.id).sort().join('|'))
    );
    if(nonDeadEnd.length)legal=nonDeadEnd;
  }

  // 【確実上がりの次・絶対】3位回避探索を行う。
  // 発動条件：
  // ・残り手札が4組以下
  // ・または、自分が富豪で、未上がりの相手の誰かが6枚以下
  // 「3位を相手に強制される入口」を終局まで完全情報探索する。
  // 2位は敗北扱いしない。3位確定の入口は、3位を回避できる入口が1つでもある限り候補から除外する。
  // パス可能な局面ではパス自体も同じ基準で比較し、パスだけが3位を回避できる場合に限ってパスを優先する。
  const certainLossMoveKeys=new Set();
  let allCurrentMovesCertainLoss=false;
  let passCertainLoss=false;
  {
    const currentGroups=currentOptimalPartition.groupCount;
    const richOpponentSixOrLess=
      p.role==='富豪'&&
      G.players.some((x,j)=>j!==i&&!x.finished&&x.hand.length<=6);

    if((currentGroups<=4||richOpponentSixOrLess)&&
       legal.length&&cpuCanUseFullResponseSearch(i)){
      const lossOrdered=orderCertainLossMovesForHand(p.hand,legal,G.revolution);

      for(const a of lossOrdered){
        const budget=createCertainSearchBudget();
        if(cpuMoveCertainForcedLossWithResponses(i,a,budget)){
          certainLossMoveKeys.add(a.cards.map(c=>c.id).sort().join('|'));
        }
        // 局面上限に達した入口は「3位確定」と断定しない。
      }

      allCurrentMovesCertainLoss=
        legal.length>0&&
        legal.every(a=>certainLossMoveKeys.has(a.cards.map(c=>c.id).sort().join('|')));

      if(G.pile){
        passCertainLoss=cpuPassCertainForcedLossWithResponses(i,createCertainSearchBudget());
      }

      // 3位を回避できる「出す」入口が1つでもあれば、3位確定入口を完全に除外する。
      if(certainLossMoveKeys.size&&!allCurrentMovesCertainLoss){
        legal=legal.filter(a=>!certainLossMoveKeys.has(a.cards.map(c=>c.id).sort().join('|')));
      }
    }
  }

  // 【絶対】残り手札が2組で、
  // 「相手が親で何を出しても、このまとまりを丸ごと使って応手できないまとまり」と
  // その他のまとまりに分かれる場合は、死んだまとまりを先に処理して残さない。
  // ただし、その他のまとまりを現在出すことで確実に上がれる場合はそちらを優先する。
  // また、現在のトリックで富豪が既にパスしている場合は適用しない。
  {
    const part=currentOptimalPartition;
    const groups=[
      ...part.bundles,
      ...part.singles.map(c=>({
        type:'single',
        n:1,
        rank:c.joker?16:c.rank,
        cards:[c],
        suits:c.joker?[]:[c.suit],
        revolution:false
      }))
    ];

    const richIndexForDeadBundle=G.players.findIndex(x=>x.role==='富豪');
    const richHasPassedNow=
      !!G.pile&&
      richIndexForDeadBundle>=0&&
      !G.players[richIndexForDeadBundle].finished&&
      G.players[richIndexForDeadBundle].passed;

    if(
      groups.length===2&&
      !richHasPassedNow&&
      cpuCanUseFullResponseSearch(i)
    ){
      const groupKey=a=>a.cards.map(c=>c.id).sort().join('|');
      const dead=groups.filter(g=>cpuBundleCannotReplyToAnyOpponentLead(i,g));
      const live=groups.filter(g=>!dead.includes(g));

      // 「死んだまとまり＋その他のまとまり」という構成の時だけ発動。
      if(dead.length===1&&live.length===1){
        const deadKey=groupKey(dead[0]);
        const liveKey=groupKey(live[0]);

        const deadMoves=legal.filter(a=>groupKey(a)===deadKey);
        const liveMoves=legal.filter(a=>groupKey(a)===liveKey);

        // その他のまとまりを出せば確実に上がれる場合は、この絶対条件を適用しない。
        const liveCanWinNow=liveMoves.some(a=>{
          const stage1=cpuMoveCertainFinishSteps(i,a,new Map());
          if(Number.isFinite(stage1))return true;
          return cpuMoveCertainFinishWithResponses(
            i,a,createCertainSearchBudget(),Infinity
          );
        });

        if(deadMoves.length&&!liveCanWinNow){
          legal=deadMoves;
        }
      }
    }
  }


  // 【絶対】富豪の残り手札が6枚以下で、
  // 自分が平民または貧民なら、各合法手とパスについて
  // 「その後、富豪が相手の最善抵抗を受けても確実に先に上がれるか」を探索する。
  // 富豪の確定勝ちを与えない行動が1つでもある場合、確定勝ちを与える行動は選ばない。
  // 通常モードでは、富豪が過去に一度出した2以外の数字は
  // 富豪が現在1枚も持っていないという前提で候補手札を構成する。
  {
    const richIndex=G.players.findIndex(x=>x.role==='富豪');
    const rich=richIndex>=0?G.players[richIndex]:null;
    const meIsCommonPoor=p.role==='平民'||p.role==='貧民';

    if(
      rich&&
      !rich.finished&&
      rich.hand.length<=6&&
      meIsCommonPoor&&
      legal.length
    ){
      const richCertainMoveKeys=new Set();

      for(const a of legal){
        if(cpuActionGivesRichCertainWin(i,a,richIndex)){
          richCertainMoveKeys.add(
            a.cards.map(c=>c.id).sort().join('|')
          );
        }
      }

      const passGivesRichCertainWin=
        !!G.pile&&cpuActionGivesRichCertainWin(i,null,richIndex);

      const safeMoves=legal.filter(a=>
        !richCertainMoveKeys.has(
          a.cards.map(c=>c.id).sort().join('|')
        )
      );

      // 出す手の中に富豪の確定勝ちを崩せるものがあるなら、
      // 富豪確定勝ちを与える出札を除外する。
      if(safeMoves.length){
        legal=safeMoves;

        // パスだけが富豪の確定勝ちを与える場合は、この手番中の戦略的パスを禁止。
        if(passGivesRichCertainWin){
          CPU_RICH_CERTAIN_WIN_PASS_BLOCK=i;
        }
      }else if(
        G.pile&&
        !passGivesRichCertainWin&&
        !passCertainLoss
      ){
        // 出す候補がすべて富豪の確定勝ちを与える一方、
        // パスならそれを崩せ、かつパス自体が3位確定ではない場合はパスを優先する。
        if(await cpuTryPass(i))return;
      }
      // 出す手もパスもすべて富豪確定勝ちになる場合は、
      // この条件では候補を削らず既存ロジックに戻す。
    }
  }

  // 【絶対】8以外の単品を持っておらず、
  // 現在の最適分割に含まれる「どのまとまり」を出しても、
  // 相手がパスしない限り確実に負ける場合は、まとまりを崩して1枚で出す。
  // 既存の3位回避探索で、現在出せるすべてのまとまりが3位確定と証明された場合だけ発動する。
  {
    const partitionNow=currentOptimalPartition;
    const hasNonEightSingle=partitionNow.singles.some(c=>c.joker||c.rank!==8);

    // 最適分割に含まれる「まとまり」のうち、現在合法に出せるものだけを対象にする。
    // ペア・トリオ・革命・階段など、種類を限定しない。
    const partitionBundleKeys=new Set(
      partitionNow.bundles.map(a=>a.cards.map(c=>c.id).sort().join('|'))
    );
    const bundleMoves=nonFoulLegal.filter(a=>
      a.cards.length>=2 &&
      partitionBundleKeys.has(a.cards.map(c=>c.id).sort().join('|'))
    );

    const everyBundleCertainlyLoses=
      bundleMoves.length>0&&
      cpuCanUseFullResponseSearch(i)&&
      bundleMoves.every(a=>
        certainLossMoveKeys.has(a.cards.map(c=>c.id).sort().join('|'))
      );

    if(!hasNonEightSingle&&everyBundleCertainlyLoses){
      const bundleCardIds=new Set();
      for(const bundle of bundleMoves){
        for(const c of bundle.cards){
          if(!c.joker)bundleCardIds.add(c.id);
        }
      }

      const brokenBundleSingles=rawLegal.filter(a=>
        a.type==='single'&&
        a.cards.length===1&&
        !a.cards[0].joker&&
        bundleCardIds.has(a.cards[0].id)&&
        !(p.hand.length===1&&isFoulFinish(a))
      );

      if(brokenBundleSingles.length){
        brokenBundleSingles.sort((x,y)=>
          strength(x.rank,G.revolution)-strength(y.rank,G.revolution)||
          (x.cards[0].suit||'Z').localeCompare(y.cards[0].suit||'Z')
        );
        legal=[brokenBundleSingles[0]];
      }
    }
  }

  // 【最強モード限定・絶対】富豪がまだ上がっていない場合に限り、
  // 平民と貧民のどちらかが確実に上がれるルートを持つなら、
  // その本人は確実上がりルートを選び、もう一方は必要であればパスして妨害しない。
  // 全員平民のゲーム、および富豪が上がった後は適用しない。
  let STRONG_COMMON_POOR_COOP=false;
  let STRONG_COMMON_POOR_PASS=false;
  if(CPU_MODE==='strong'){
    const richIndexForCoop=G.players.findIndex(x=>x.role==='富豪');
    const richStillPlayingForCoop=
      richIndexForCoop>=0&&!G.players[richIndexForCoop].finished;
    const meIsCommonPoor=
      richStillPlayingForCoop&&(p.role==='平民'||p.role==='貧民');

    if(meIsCommonPoor){
      const mateRole=p.role==='平民'?'貧民':'平民';
      const mateIndex=G.players.findIndex((x,j)=>
        j!==i&&!x.finished&&x.role===mateRole
      );

      // 最上位の自分自身の確実上がり探索は前段ですでに完了済み。
      // ここでは最強モードの平民・貧民協調用として再確認する。
      // 7組以上ではメインの第1段階と同じく、固定した最適分割を維持する終局探索だけを行い、
      // 見つからなくても第2段階（全応手探索）へは進まない。
      const mineCandidateLegal=legal.filter(a=>
        !certainLossMoveKeys.has(a.cards.map(c=>c.id).sort().join('|'))
      );
      const mineGroupCount=currentOptimalPartition.groupCount;
      let myCertainFirst=null;

      if(mineGroupCount>=7){
        const orderedMine=orderCertainMovesForHand(
          p.hand,
          mineCandidateLegal,
          G.revolution,
          true
        );
        for(const a of orderedMine){
          const used=new Set(a.cards.map(c=>c.id));
          const rem=p.hand.filter(c=>!used.has(c.id));
          const nextRev=a.revolution?!G.revolution:G.revolution;
          const d=cpuCertainSearchDepthForState(rem,nextRev);
          const steps=(()=>{
            if(!rem.length)return isFoulFinish(a)?Infinity:1;
            const keepsControl=moveClearsPileWithoutOpponent(a,G.revolution)||cpuCanProveLeadMoveUnanswerable(i,a,G.revolution,null,true);
            if(!keepsControl)return Infinity;
            const rest=certainRunOutMinStepsBounded(i,rem,nextRev,new Map(),d,createCertainSearchBudget(),true);
            return Number.isFinite(rest)?1+rest:Infinity;
          })();
          if(Number.isFinite(steps)){myCertainFirst=a;break}
        }
      }else{
        const orderedMine=orderCertainMovesForHand(
          p.hand,
          mineCandidateLegal,
          G.revolution
        );
        for(const a of orderedMine){
          const steps=cpuMoveCertainFinishStepsBounded(i,a,new Map(),createCertainSearchBudget());
          if(Number.isFinite(steps)){myCertainFirst=a;break}
        }
        if(!myCertainFirst){
          for(const a of orderedMine){
            if(cpuMoveCertainFinishWithResponses(i,a,createCertainSearchBudget(),null)){
              myCertainFirst=a;break;
            }
          }
        }
      }

      if(myCertainFirst){
        legal=[myCertainFirst];
        STRONG_COMMON_POOR_COOP=true;
      }else if(mateIndex>=0){
        // もう一方の平民/貧民が現在の手札から確実に上がれるかを見る。
        // 相方も7組以上なら固定分割の第1段階だけとし、第2段階には進まない。
        const mate=G.players[mateIndex];
        const mateRawLegal=allLegal(mate).filter(a=>
          !(mate.hand.length===a.n&&isFoulFinish(a))&&!moveLeavesOnlyFoulCards(mate,a)
        );
        const mateLegal=mateRawLegal.filter(a=>
          !cpuIsUnsafeSinglePlusJokerPairInHand(mateIndex,mate.hand,a,G.revolution)
        );
        const mateGroupCount=optimalHandPartition(mate.hand,G.revolution).groupCount;
        let mateCertain=false;

        if(mateGroupCount>=7){
          const mateOrdered=orderCertainMovesForHand(mate.hand,mateLegal,G.revolution,true);
          mateCertain=mateOrdered.some(a=>{
            const used=new Set(a.cards.map(c=>c.id));
            const rem=mate.hand.filter(c=>!used.has(c.id));
            if(!rem.length)return !isFoulFinish(a);
            const nextRev=a.revolution?!G.revolution:G.revolution;
            const keepsControl=moveClearsPileWithoutOpponent(a,G.revolution)||cpuCanProveLeadMoveUnanswerable(mateIndex,a,G.revolution);
            if(!keepsControl)return false;
            const d=cpuCertainSearchDepthForState(rem,nextRev);
            const rest=certainRunOutMinStepsBounded(mateIndex,rem,nextRev,new Map(),d,createCertainSearchBudget(),true);
            return Number.isFinite(rest);
          });
        }else{
          const mateOrdered=orderCertainMovesForHand(mate.hand,mateLegal,G.revolution);
          mateCertain=mateOrdered.some(a=>
            Number.isFinite(cpuMoveCertainFinishStepsBounded(mateIndex,a,new Map(),createCertainSearchBudget()))
          );
          if(!mateCertain&&cpuCanUseFullResponseSearch(mateIndex)){
            mateCertain=mateOrdered.some(a=>
              cpuMoveCertainFinishWithResponses(mateIndex,a,createCertainSearchBudget(),null)
            );
          }
        }

        // 相方に確実上がりがあり、自分が現在パス可能ならパスして妨害しない。
        if(mateCertain&&G.pile){
          STRONG_COMMON_POOR_PASS=true;
        }
      }
    }
  }

  const isLead=!G.pile;
  const isSingle=a=>a.type==='single'&&a.cards.length===1;
  const isSingleS3=a=>isSingle(a)&&a.cards[0].id==='S3';
  const mustUseS3AgainstJoker=
    !!(
      G.pile&&
      G.pile.type==='single'&&
      G.pile.rank===16&&
      G.lead!==null&&
      G.lead!==i&&
      G.players[G.lead]&&
      G.players[G.lead].hand.length<=8&&
      legal.some(isSingleS3)
    );
  const isSingleJoker=a=>isSingle(a)&&a.cards[0].joker;
  const isSingleEight=a=>isSingle(a)&&!a.cards[0].joker&&a.cards[0].rank===8;
  const isEightPair=a=>a.type==='group'&&a.n===2&&a.cards.some(c=>!c.joker&&c.rank===8);
  const hasS3=p.hand.some(c=>c.id==='S3');
  const hasJoker=p.hand.some(c=>c.joker);
  const hasOtherThree=p.hand.some(c=>!c.joker&&c.rank===3&&c.id!=='S3');
  const nobodyPassed=G.players.every(x=>x.finished||!x.passed);
  const richIndex=G.players.findIndex(x=>x.role==='富豪');
  const richStillPlaying=richIndex>=0&&!G.players[richIndex].finished;
  const commonOrPoor=(p.role==='平民'||p.role==='貧民')&&richStillPlaying;
  const richThreeStrategy=cpuRichThreeOrLessStrategyState(i);
  const active=G.players.map((x,j)=>({x,j})).filter(o=>!o.x.finished);
  const headsUpOpponentAtThreeOrLess=
    active.length===2&&active.some(o=>o.j!==i&&o.x.hand.length<=3);
  const richAtThreeOrLess=
    richStillPlaying&&G.players[richIndex].hand.length<=3;
  const otherCommonPoorHasPlayedThisTrick=(()=>{
    if(!richAtThreeOrLess||!(p.role==='平民'||p.role==='貧民'))return false;
    const otherIndex=G.players.findIndex((x,j)=>
      j!==i&&!x.finished&&(x.role==='平民'||x.role==='貧民'));
    if(otherIndex<0)return false;
    return (G.pileHistory||[]).some(entry=>entry.player===otherIndex);
  })();
  const richHasPassedThisTrick=
    richIndex>=0&&G.players[richIndex].passed;
  const mustNotPassForRichAtThreeOrLess=
    richAtThreeOrLess&&
    !richHasPassedThisTrick&&
    (p.role==='平民'||p.role==='貧民')&&
    !otherCommonPoorHasPlayedThisTrick;
  const commonPoorAtThreeOrLess=
    p.role==='富豪'&&G.players.some((x,j)=>
      j!==i&&!x.finished&&(x.role==='平民'||x.role==='貧民')&&x.hand.length<=3);
  const mustNotPassToPreventImmediateFinish=cpuPassWouldGiveOpponentImmediateFinish(i);

  // 後段の優先条件・パス判断でも参照するため、ブロックスコープの外で定義する。
  const canPassAsActionEarly=
    !!G.pile&&!headsUpOpponentAtThreeOrLess&&!mustNotPassForRichAtThreeOrLess&&!commonPoorAtThreeOrLess&&!mustNotPassToPreventImmediateFinish;

  // 【確実上がりの次・絶対】3位回避を優先する。
  // 出せる全入口が3位確定でも、パスも3位確定なら無条件にはパスしない。
  // パスだけが3位を回避できる場合に限りパスする。
  if(allCurrentMovesCertainLoss&&canPassAsActionEarly&&!passCertainLoss){
    if(await cpuTryPass(i))return;
  }


  // 【絶対】自分がパスすると次の相手がその1手で上がる局面でも、
  // 自分とその相手が平民・貧民の組み合わせで富豪が未上がりならパスする。
  // ただし、上記の3位回避完全情報探索でそのパスが3位確定と証明されている場合、
  // または別の明示的なパス禁止絶対条件に抵触する場合は強制しない。
  if(G.pile&&!passCertainLoss&&!cpuStrategicPassForbiddenByAbsolute(i)){
    const afterPass=certainSimApplyPass(cloneCertainSimFromGame(),i);
    const next=afterPass.turn;
    const opp=afterPass.players[next];
    if(next!==i&&opp&&!opp.finished&&opp.hand.length){
      const selfRole=p.role;
      const oppRole=G.players[next].role;
      const commonPoorPair=
        (selfRole==='平民'&&oppRole==='貧民')||
        (selfRole==='貧民'&&oppRole==='平民');
      const richStillPlayingNow=G.players.some(x=>x.role==='富豪'&&!x.finished);
      if(commonPoorPair&&richStillPlayingNow){
        const opponentCanFinishNext=analysesInState(opp.hand,afterPass.revolution).some(a=>
          a.cards.length===opp.hand.length&&
          certainSimCompatible(afterPass,a)&&
          !isFoulFinishInState(a,afterPass.revolution)
        );
        if(opponentCanFinishNext){
          if(await cpuTryPass(i))return;
        }
      }
    }
  }

  // 3位を回避できる出し手が存在する場合、3位確定入口は候補へ戻さない。
  if(certainLossMoveKeys.size&&!allCurrentMovesCertainLoss){
    legal=legal.filter(a=>!certainLossMoveKeys.has(a.cards.map(c=>c.id).sort().join('|')));
  }

  if(!TOP_CERTAIN_ROUTE_ACTIVE&&!STRONG_COMMON_POOR_COOP&&!STRONG_COMMON_POOR_PASS){
  // 【絶対】富豪が未上がりで、平民/貧民がカードを出して残り3枚以下になった後に富豪がパスした場合、
  // 最後の平民/貧民は原則パス。ただし、この手から相手へ手番を渡さず確実に上がれる手がある場合は出す。
  if(G.pile&&richStillPlaying&&G.lead!==null){
    const leader=G.players[G.lead],rich=G.players[richIndex];
    const isLastCommonPoor=i!==G.lead&&(p.role==='平民'||p.role==='貧民');
    const leaderMadeThreeOrLess=(leader.role==='平民'||leader.role==='貧民')&&leader.hand.length<=3;
    if(isLastCommonPoor&&leaderMadeThreeOrLess&&rich.passed&&!headsUpOpponentAtThreeOrLess&&!mustNotPassForRichAtThreeOrLess){
      let firstCertainLocal=null;
      for(const a of orderCertainMovesForHand(p.hand,legal.filter(a=>!certainLossMoveKeys.has(a.cards.map(c=>c.id).sort().join('|'))),G.revolution)){
        const steps=cpuMoveCertainFinishSteps(i,a,new Map());
        if(Number.isFinite(steps)){firstCertainLocal=a;break}
      }
      if(firstCertainLocal){
        legal=[firstCertainLocal];
      }
      else{if(await cpuTryPass(i))return}
    }
  }

  // 【絶対】各ゲーム最初の1手：K以上での革命、および3での革命は禁止。
  // K以上の非革命手は許可する。
  if((G.turnCount||0)===0&&legal.length){
    legal=legal.filter(a=>!a.revolution||(a.rank<13&&a.rank!==3));
  }
  // 【絶対】各ゲーム開始後1ターン目で、最初にカードを出す人は2のペアを出さない。
  if((G.turnCount||0)===0&&legal.length){
    legal=legal.filter(a=>!(a.type==='group'&&a.n===2&&a.rank===15));
  }


  // 【絶対】反則上がりにならない数字が1種類しかない時は、反則対象札から先に処理する。
  if(legal.length&&p.hand.some(isFoulRiskCard)){
    const safeRanks=new Set(p.hand.filter(c=>!isFoulRiskCard(c)).map(c=>String(c.rank)));
    if(safeRanks.size===1){
      const riskOnly=legal.filter(a=>a.cards.every(isFoulRiskCard));
      if(riskOnly.length)legal=riskOnly;
      const riskLeft=a=>{const used=new Set(a.cards.map(c=>c.id));return p.hand.filter(c=>!used.has(c.id)&&isFoulRiskCard(c)).length};
      if(legal.length){const min=Math.min(...legal.map(riskLeft));legal=legal.filter(a=>riskLeft(a)===min)}
    }
  }

  // 【絶対】場が流れた直後は8単騎・8ペアを出さない。
  // ただし、その8切りの次の1手で確実に合法上がりできる場合は許可。
  if(isLead&&legal.length){
    const filtered=legal.filter(a=>!(isSingleEight(a)||isEightPair(a))||cpuEightMoveThenNextFinish(i,a));
    if(filtered.length)legal=filtered;
  }

  // 【絶対】富豪が上がっていない時、平民と貧民は「相方」が起こした革命に対して、
  // 場が流れるまでは革命返しをしない。
  // 革命を起こした本人の再革命は許可する。
  // ただし、残り手札で自分が確実に上がれる革命手は例外として許可する。
  if(commonOrPoor&&legal.length&&G.commonPoorRevolutionLock){
    const revolutionStarter=G.commonPoorRevolutionLock-1;
    if(revolutionStarter!==i){
      legal=legal.filter(a=>!a.revolution||cpuRevolutionExceptionCertain(i,a));
    }
  }

  // 【絶対】残り手札が2枚でJokerを含み、相手がスペード3を持っている可能性がある場合はパスする。
  if(G.pile&&p.hand.length===2&&p.hand.some(c=>c.joker)&&canPassAsActionEarly){
    const opponentMayHaveS3=(()=>{
      if(CPU_MODE==='strong'){
        return G.players.some((x,j)=>j!==i&&!x.finished&&x.hand.some(c=>c.id==='S3'));
      }
      const mem=cpuMemory(i);
      if(mem.current.has('S3')||mem.played.has('S3')||mem.blindId==='S3')return false;
      return true;
    })();
    if(opponentMayHaveS3){
      if(await cpuTryPass(i))return;
    }
  }

  // 【絶対】相手の単騎への追従で、残り5枚以下の人が誰もいない間はジョーカーを出さない。
  // ただしCPU自身が5枚以下なら使用可。ほかの誰かが5枚以下の場合も使用可。
  const anyoneAtFiveOrLess=G.players.some(x=>!x.finished&&x.hand.length<=5);
  if(G.pile&&G.pile.type==='single'&&!anyoneAtFiveOrLess&&p.hand.length>5){
    for(const a of nonFoulLegal){
      if(a.cards.some(c=>c.joker))forbidAbsoluteMove(a);
    }
    applyAbsoluteForbidden();
  }

  // 【優先・高】ジョーカー未出現かつ自分も未所持なら、スペ3単騎を強く避ける。
  // ただし、貧民が交換時に富豪へ渡した札が非ジョーカーだった場合、その貧民には適用しない。
  // 絶対禁止ではなく、preferredScore で強いペナルティを与える。

  // 【絶対】誰もパスしておらず、相手がスペード3を持っている可能性がある時はJoker単騎を出さない。
  // ただし、現在カードを出した相手の残り手札が5枚以下で、その場札より強いものを自分が持っていない時は、
  // 完全情報なら相手の実手札を見て判断し、完全情報でない時だけ50%の確率でJoker単騎を許可する。
  // 自分が平民で、現在カードを出した相手が貧民の場合はこの例外を適用せずJokerを出さない。
  const anyOpponentMayHaveS3=(()=>{
    if(CPU_MODE==='strong'){
      return G.players.some((x,j)=>j!==i&&!x.finished&&x.hand.some(c=>c.id==='S3'));
    }
    const mem=cpuMemory(i),s3='S3';
    if(mem.current.has(s3)||mem.played.has(s3)||mem.blindId===s3)return false;
    return G.players.some((x,j)=>j!==i&&!x.finished);
  })();

  const shortLeaderNoStrongerInOwnHand=(()=>{
    if(!G.pile||G.pile.type!=='single'||G.lead===null||G.lead===i)return false;
    const leader=G.players[G.lead];
    if(!leader||leader.finished||leader.hand.length>5)return false;
    const pileRank=G.pile.rank;
    if(pileRank===16)return false;
    const ownStronger=p.hand.some(c=>{
      if(c.joker)return false;
      return strength(c.rank,G.revolution)>strength(pileRank,G.revolution);
    });
    return !ownStronger;
  })();

  const commonVsPoorNoJokerException=
    p.role==='平民'&&G.lead!==null&&G.players[G.lead].role==='貧民';

  const jokerSingleRiskException=(()=>{
    if(!(nobodyPassed&&anyOpponentMayHaveS3&&shortLeaderNoStrongerInOwnHand&&!commonVsPoorNoJokerException))return false;

    if(cpuCanUseFullResponseSearch(i)){
      // 完全情報が使える局面では確率を使わず、現在の出し手の実手札を見て判断する。
      if(G.lead===null||G.lead===i)return false;
      const leader=G.players[G.lead];
      const pileRank=G.pile&&G.pile.rank;
      if(!leader||!G.pile||pileRank===16)return false;

      // 相手が♠3を実際に持っているならJoker単騎は出さない。
      if(leader.hand.some(c=>c.id==='S3'))return false;

      // 相手が場札より強い通常札を持っているなら、Jokerを使う必要はないと判断して出さない。
      const leaderHasStrongerNatural=leader.hand.some(c=>
        !c.joker&&strength(c.rank,G.revolution)>strength(pileRank,G.revolution)
      );
      return !leaderHasStrongerNatural;
    }

    // 完全情報でない局面だけ50%の確率でJoker単騎を許可する。
    return Math.random()<0.50;
  })();

  if(nobodyPassed&&anyOpponentMayHaveS3&&!jokerSingleRiskException){
    for(const a of nonFoulLegal){
      if(isSingleJoker(a))forbidAbsoluteMove(a);
    }
    applyAbsoluteForbidden();
  }

  // 【絶対】富豪がまだ上がっていない時、貧民の単騎に対して平民はジョーカーを出さない。
  // ジョーカー後に相手へ手番を渡さず確実に上がり切れる場合のみ例外。
  if(richStillPlaying&&G.pile&&G.pile.type==='single'&&p.role==='平民'&&G.lead!==null&&G.players[G.lead].role==='貧民'){
    for(const a of nonFoulLegal){
      if(isSingleJoker(a)&&!cpuCanCertainlyFinishAfterSingleJoker(i,a))forbidAbsoluteMove(a);
    }
    applyAbsoluteForbidden();
  }

  // 【絶対】富豪未上がり時、平民のジョーカーに対して貧民はスペ3返ししない。
  // スペ3返し後に相手へ手番を渡さず確実に上がり切れる場合のみ例外。
  if(richStillPlaying&&p.role==='貧民'&&G.pile&&G.pile.type==='single'&&G.pile.cards.some(c=>c.joker)){
    const leader=G.players[G.lead];
    if(leader&&leader.role==='平民'){
      for(const a of nonFoulLegal){
        if(isSingleS3(a)&&!cpuCanCertainlyFinishAfterSp3Return(i,a))forbidAbsoluteMove(a);
      }
      applyAbsoluteForbidden();
    }
  }

  // 【絶対】ジョーカー出現後、スペ3だけを3として持つ場合の強制手（革命中は無効）。
  // ただし、スペード3が現在手札の最適分割でまとまりの一部なら適用しない。
  const spade3Bundled=isSpade3InOptimalBundle(p.hand,G.revolution);
  if(!G.revolution&&G.jokerPlayed&&hasS3&&!hasOtherThree&&!spade3Bundled){
    if(isLead){
      const forced=nonFoulLegal.filter(isSingleS3);
      if(forced.length)legal=forced;
    }else if(G.pile&&G.pile.type==='single'&&strength(G.pile.rank,false)<strength(8,false)&&p.hand.some(c=>!c.joker&&c.rank===8)){
      const forced=nonFoulLegal.filter(isSingleEight);

      // 8単騎を出した結果、最適分割上の単品が2つ以上増える場合は
      // この強制条件を適用しない。単品の増加が0～1個なら8を出す。
      const singlesBefore=currentOptimalPartition.singles.length;
      const forcedWithoutTwoNewSingles=forced.filter(a=>{
        const remaining=p.hand.filter(c=>!a.cards.some(x=>x.id===c.id));
        const after=optimalHandPartition(remaining,G.revolution);
        const singlesAfter=(after?.singles||[]).length;
        return singlesAfter-singlesBefore<2;
      });

      if(forcedWithoutTwoNewSingles.length)legal=forcedWithoutTwoNewSingles;
    }
  }

  // 【絶対】場が流れて空場になったときはパスしない。
  // 「自分が以前出した札がまだ場にあり、他者が出札して手番が戻った」局面は空場ではないため、パスしてよい。
  // 絶対禁止（反則上がり／残りが反則札だけになる手）を復活させず、安全な合法手だけから必ず1手選ぶ。
  if((headsUpOpponentAtThreeOrLess||mustNotPassForRichAtThreeOrLess||commonPoorAtThreeOrLess||mustNotPassToPreventImmediateFinish)&&nonFoulLegal.length){
    // 【最上位・絶対】
    // ・1対1で相手残り3枚以下
    // ・富豪残り3枚以下で、平民/貧民のもう一人がまだこの場でカードを出していない
    // ・平民または貧民の残り3枚以下に対する富豪
    // ・パスすると次の相手がその1手で上がる局面（平民↔貧民かつ富豪未上がりを除く）
    // のいずれかでは、安全な合法手が1つでもある限りパスしない。
    if(!legal.length)legal=[...availableNonFoulLegal()];
  }else if(!legal.length&&isLead){
    legal=[...availableNonFoulLegal()];
  }
  if(!legal.length){
    if(!G.pile&&nonFoulLegal.length){
      // 空場ではパス不可。優先条件で候補が消えていても安全な合法手を復元する。
      legal=[...availableNonFoulLegal()];
    }else if(!G.pile&&rawLegal.length){
      // 安全手そのものが存在しない不可避局面では、停止せず実合法手を復元する。
      legal=rawLegal.filter(a=>!isAbsoluteForbidden(a));
    }else{
      // 絶対禁止を適用した結果、実際に選べる出札が0件。
      // rawLegalに禁止札が残っていても、それを理由にパスを禁止しない。
      if(await cpuTryPass(i,legal))return;
    }
  }

  // 【高優先】1人が上がって1対1になった直後、その上がった人の最後の場札に対して、
  // 残った相手が「現在の場に返せる組み合わせ」を持ち得ないとCPUの記憶から証明できるなら、
  // ジョーカーを温存する。ジョーカーなしで出せる手がなければパスする。
  function remainingOpponentCannotReplyToCurrentPile(otherIndex){
    if(!G.pile)return false;
    if(CPU_MODE==='strong'){
      // 完全情報では、相手の実手札から現在の場への合法な返しを直接列挙する。
      return !cpuStrongModePlayerHasReply(otherIndex,G.pile,G.revolution);
    }
    const other=G.players[otherIndex];
    if(!other||other.finished)return true;
    if(other.hand.length<G.pile.n)return true;

    const mem=cpuMemory(i);
    const unavailable=new Set([...mem.current,...mem.played]);
    if(mem.blindId)unavailable.add(mem.blindId);
    const unseen=makeDeck().filter(c=>!unavailable.has(c.id));

    const pile=G.pile;
    const unseenJoker=unseen.some(c=>c.joker);
    const natural=unseen.filter(c=>!c.joker);

    if(pile.type==='single'){
      // 場がJokerならスペ3だけが返せる。
      if(pile.rank===16)return !unseen.some(c=>c.id==='S3');

      // 縛り中は同スートのみ。Jokerは縛りを無視して返せる。
      if(unseenJoker)return false;
      return !natural.some(c=>{
        if(G.lock&&c.suit!==G.lock)return false;
        return strength(c.rank,G.revolution)>strength(pile.rank,G.revolution);
      });
    }

    if(pile.type==='group'){
      // 同じ枚数の同ランク組だけが返せる。3人制なので通常カードは各数字最大3枚。
      const counts={};
      for(const c of natural){
        if(G.lock&&!G.lock.includes(c.suit))continue;
        counts[c.rank]=(counts[c.rank]||0)+1;
      }
      for(const [rkStr,count] of Object.entries(counts)){
        const rk=Number(rkStr);
        if(strength(rk,G.revolution)<=strength(pile.rank,G.revolution))continue;
        if(count+(unseenJoker?1:0)>=pile.n)return false;
      }
      return true;
    }

    if(pile.type==='straight'){
      const bySuit={};
      for(const [s] of SUITS)bySuit[s]=new Set();
      for(const c of natural)bySuit[c.suit].add(c.rank);

      // 革命中の Joker・3・4 も返し候補として考慮。
      if(G.revolution&&pile.n===3&&unseenJoker){
        for(const [s] of SUITS){
          if(G.lock&&s!==G.lock)continue;
          if(bySuit[s].has(3)&&bySuit[s].has(4)&&
             strength(2,true)>strength(pile.rank,true))return false;
        }
      }

      for(const [s] of SUITS){
        if(G.lock&&s!==G.lock)continue;
        for(let start=3;start<=16-pile.n+1;start++){
          if(strength(start,G.revolution)<=strength(pile.rank,G.revolution))continue;
          const seq=Array.from({length:pile.n},(_,k)=>start+k);
          const missing=seq.filter(r=>!bySuit[s].has(r)).length;
          if(missing<=(unseenJoker?1:0))return false;
        }
      }
      return true;
    }
    return false;
  }

  {
    const activeNow=G.players.map((x,j)=>({x,j})).filter(o=>!o.x.finished);
    const justFinishedLeader=G.lead!==null&&G.players[G.lead]&&G.players[G.lead].finished;
    if(G.pile&&activeNow.length===2&&justFinishedLeader&&!headsUpOpponentAtThreeOrLess&&!mustNotPassForRichAtThreeOrLess&&!commonPoorAtThreeOrLess){
      const other=activeNow.find(o=>o.j!==i);
      if(other&&remainingOpponentCannotReplyToCurrentPile(other.j)){
        const noJoker=legal.filter(a=>!a.cards.some(c=>c.joker));
        if(noJoker.length){
          legal=noJoker;
        }else{
          if(await cpuTryPass(i))return;
        }
      }
    }
  }

  }
  if(STRONG_COMMON_POOR_PASS&&G.pile){
    if(await cpuTryPass(i))return;
  }

  // 最上位の確実手順探索は前半で一度だけ実行済み。ここでは再探索しない。

  // 【優先】富豪が革命したら、平民・貧民は革命返しする。
  // 【優先】完全情報の時は、相手が革命返しできる手札なら革命しない。
  // ただし平民・貧民は、富豪が革命返しできないなら革命してよい。
  // 確実上がりの最上位ルートがある場合は、そちらを優先する。
  if(!TOP_CERTAIN_ROUTE_ACTIVE&&legal.length){
    const lastPilePlay=(G.pileHistory&&G.pileHistory.length)
      ?G.pileHistory[G.pileHistory.length-1]
      :null;

    // 現在の場そのものが富豪による革命手である場合、
    // 平民・貧民は合法な革命返しがあればそれを優先する。
    if(
      G.pile&&G.pile.revolution&&
      lastPilePlay&&
      G.players[lastPilePlay.player]?.role==='富豪'&&
      (p.role==='平民'||p.role==='貧民')
    ){
      const counterMoves=legal.filter(a=>a.revolution);
      if(counterMoves.length)legal=counterMoves;
    }

    // 通常モードでも相手全員の手札を完全に特定できている局面は完全情報として扱う。
    const activeOpponents=G.players
      .map((x,j)=>({x,j}))
      .filter(o=>o.j!==i&&!o.x.finished);

    const knownHands=new Map();
    let completeInfo=CPU_MODE==='strong';
    if(!completeInfo){
      completeInfo=activeOpponents.every(o=>{
        const h=cpuKnownOpponentHand(i,o.j);
        if(!h)return false;
        knownHands.set(o.j,h);
        return true;
      });
    }

    const handForOpponent=j=>
      CPU_MODE==='strong'?G.players[j].hand:knownHands.get(j);

    const playerCanRevolutionReply=(j,firstMove)=>{
      const hand=handForOpponent(j);
      if(!hand)return false;

      // firstMove 後の革命状態で、同じ枚数・同じ型の革命返しが可能かを実手札から判定。
      const afterRev=firstMove.revolution?!G.revolution:G.revolution;
      for(const cs of combinations(hand)){
        for(const cand of analysesInState(cs,afterRev)){
          if(!cand.revolution)continue;
          if(cand.type!==firstMove.type||cand.n!==firstMove.n)continue;
          if(strength(cand.rank,afterRev)>strength(firstMove.rank,afterRev))return true;
        }
      }
      return false;
    };

    if(completeInfo&&legal.length){
      const richIndex=G.players.findIndex(x=>x.role==='富豪'&&!x.finished);
      const filtered=legal.filter(a=>{
        if(!a.revolution)return true;

        // 平民・貧民は、富豪が革命返しできないことが分かっていれば革命してよい。
        // 他方の平民/貧民が革命返しできることだけを理由には革命を避けない。
        if((p.role==='平民'||p.role==='貧民')&&richIndex>=0){
          return !playerCanRevolutionReply(richIndex,a);
        }

        // 上記例外以外では、完全情報下で相手の誰かが革命返し可能なら革命を避ける。
        const canBeCountered=activeOpponents.some(o=>playerCanRevolutionReply(o.j,a));
        return !canBeCountered;
      });

      // 優先条件なので、革命以外の候補が残る場合だけ革命候補を除外する。
      if(filtered.length)legal=filtered;
    }
  }

  // ---------- ここから「なるべく」条件のみ ----------
  // 旧来の優先条件はすべて削除し、以下の条件だけをスコア化する。
  const rankCounts={};for(const c of p.hand)if(!c.joker)rankCounts[c.rank]=(rankCounts[c.rank]||0)+1;
  const allCommon=G.players.every(x=>x.role==='平民');
  // 最上位の確実手順探索はこの時点までに完了している。
  // 優先条件評価のためだけに全候補を再探索すると、深い局面でCPUが長時間停止するため、
  // ここでは既に「確実」と証明済みのキャッシュだけを参照する。
  const certainFinishMoves=new Set(
    TOP_CERTAIN_ROUTE_ACTIVE
      ? legal.map(a=>moveKey(a))
      : legal
          .filter(a=>{
            const k=moveKey(a);
            return certainStepsByKey.has(k)&&Number.isFinite(certainStepsByKey.get(k));
          })
          .map(a=>moveKey(a))
  );
  const key=a=>moveKey(a);
  // 【優先】場札が単品の時、自分以外の誰かがAの後に2を出す可能性があるならAを避ける。
  // Aしか出せない場合は、場が空でない限りパスする。
  function shouldAvoidAceMove(a){
    if(!G.pile||G.pile.type!=='single')return false;
    if(!isSingle(a)||a.cards[0].joker||a.cards[0].rank!==14)return false;

    // 既に縛り中ならそのスート、未縛りでもAによって縛りが成立するならAのスートだけが2候補。
    let requiredSuit=null;
    if(G.lock){
      requiredSuit=G.lock;
    }else{
      const prevSig=suitSignature(G.pile);
      const aceSig=suitSignature(a);
      if(prevSig&&aceSig&&prevSig===aceSig)requiredSuit=aceSig;
    }

    if(CPU_MODE==='strong'){
      return G.players.some((op,j)=>{
        if(j===i||op.finished||op.passed)return false;
        return op.hand.some(c=>
          !c.joker&&
          c.rank===15&&
          (!requiredSuit||c.suit===requiredSuit)
        );
      });
    }

    const mem=cpuMemory(i);
    const possibleTwos=makeDeck().filter(c=>
      !c.joker&&
      c.rank===15&&
      (!requiredSuit||c.suit===requiredSuit)
    );

    // 自分の現手札・既出札・確定ブラインドで所在が説明できない2が1枚でもあれば、
    // 誰かがその2を出す可能性があると保守的に判定する。
    return possibleTwos.some(c=>
      !mem.current.has(c.id)&&
      !mem.played.has(c.id)&&
      mem.blindId!==c.id
    );
  }
  const targets3=G.players.map((x,j)=>({x,j,k:j===i?null:cpuEightKnowledge(i,j)})).filter(o=>o.j!==i&&!o.x.finished&&o.x.hand.length<=3);
  const commonPoorTargets3=targets3.filter(o=>o.x.role==='平民'||o.x.role==='貧民');
  const nonRichTargets3=targets3.filter(o=>o.x.role!=='富豪');

  // 【優先】まとまり判定はまず手札全体を最小組数で分割する。
  // 同じ最小組数で単品数が異なる分け方があり、
  // 現在の場に対して一方ならまとまりを崩さず応手できる場合は、パスしなくて済む方を採用する。
  // ただし残り手札が5組以上なら、この優先条件ではJokerを使う出し方を採用しない。
  // また、組数・単品数まで同じ別の最適分割で合法手が1組として成立する場合は、
  // その手を「まとまり崩し」と判定しない。
  const optimalPartition=cpuPartitionAvoidingPass(
    p.hand,
    G.revolution,
    currentOptimalPartition,
    legal
  );

  // 【優先】1枚しかない数字＋Jokerで作るペアについて、
  // 相手がそれより強い自然ペアを持っている可能性がある場合は、そのJokerペアを出さず、
  // 危険な「単品＋Joker」ペアは上段の絶対条件ですでに出札候補から除外済み。
  // 新仕様では「まとまりを解除する」は行わず、最適分割自体はそのまま維持する。
  const protectedBundles=optimalPartition.bundles
    .map(a=>new Set(a.cards.map(c=>c.id)));

  const partitionSingles=[...optimalPartition.singles];

  function bundleBreakPenalty(a){
    if(mustUseS3AgainstJoker&&isSingleS3(a))return 0;

    // 現在選ばれた分割では一部を崩して見えても、
    // 同じ最小組数・同じ最小単品数の別分割でこの手が1組になるなら崩し扱いしない。
    if(cpuMoveFitsAnyEqualOptimalPartition(
      p.hand,G.revolution,a,currentOptimalPartition
    ))return 0;

    const moveIds=new Set(a.cards.map(c=>c.id));
    let penalty=0;
    for(const bundle of protectedBundles){
      let overlap=0;
      const overlappedCards=[];
      for(const id of bundle){
        if(moveIds.has(id)){
          overlap++;
          const c=p.hand.find(x=>x.id===id);
          if(c)overlappedCards.push(c);
        }
      }
      if(overlap>0&&overlap<bundle.size){
        // 空場でない時は、通常2／革命3はまとまりから崩してよい。
        // さらに相手がその最強札を持っていないことが確定していれば、
        // 通常A／革命4も崩してよい。
        const allAllowed=overlappedCards.length>0&&overlappedCards.every(canBreakProtectedRankOnFollow);
        if(!allAllowed)penalty+=1200;
      }
    }
    return penalty;
  }
  const remainingGroups=Math.max(1,optimalPartition.groupCount);

  // まとまり崩しフィルタ前の合法手を保持する。
  // A/2（革命中は4/3）を仮に外したときに解放される弱いカードの判定は、
  // フィルタ後のlegalではなく、この元の合法手一覧を基準に行う。
  const legalBeforePartitionFilter=[...legal];

  function canBreakProtectedRankOnFollow(card){
    if(isLead||!card||card.joker)return false;
    const freeRank=G.revolution?3:15;   // 通常2、革命3
    const conditionalRank=G.revolution?4:14; // 通常A、革命4
    if(card.rank===freeRank)return true;
    if(card.rank===conditionalRank&&unpassedOpponentsCertainlyLackRank(freeRank))return true;
    return false;
  }

  // パスしていない相手が指定ランクを持っていないことを、CPUの記憶から保守的に判定する。
  // そのランク4枚が「自分の現手札・既出札・判明済みブラインド」のいずれかで全て説明できる場合のみ確定扱い。
  function unpassedOpponentsCertainlyLackRank(rank){
    if(CPU_MODE==='strong'){
      return G.players.every((x,j)=>j===i||x.finished||x.passed||!x.hand.some(c=>!c.joker&&c.rank===rank));
    }
    const opponents=G.players.map((x,j)=>({x,j}))
      .filter(o=>o.j!==i&&!o.x.finished&&!o.x.passed);
    if(!opponents.length)return true;
    const mem=cpuMemory(i);
    const unavailable=new Set([...mem.current,...mem.played]);
    if(mem.blindId)unavailable.add(mem.blindId);
    return SUITS.every(([s])=>unavailable.has(`${s}${rank}`));
  }

  // 【優先】2/A（革命中は3/4）をまとまりから崩せる局面で、
  // そのカードを仮にまとまりから外した結果、より弱いカードが単品として解放されるなら、
  // 2/Aより先にその弱いカードを出す。
  //
  // ここでは実際に2/Aを出した後を記憶するのではなく、現在手札だけを使って仮想判定する。
  function hypotheticallyFreedWeakSingles(){
    if(isLead)return [];

    const freeRank=G.revolution?3:15;          // 通常2、革命3
    const conditionalRank=G.revolution?4:14;  // 通常A、革命4
    const candidates=[];

    for(const bundle of optimalPartition.bundles){
      for(const highCard of bundle.cards){
        if(highCard.joker)continue;

        const isFree=highCard.rank===freeRank;
        const isConditional=
          highCard.rank===conditionalRank&&
          unpassedOpponentsCertainlyLackRank(freeRank);

        if(!isFree&&!isConditional)continue;

        const remaining=p.hand.filter(c=>c.id!==highCard.id);
        const after=optimalHandPartition(remaining,G.revolution);
        const afterSingleIds=new Set(after.singles.map(c=>c.id));
        const highPower=strength(highCard.rank,G.revolution);

        for(const c of bundle.cards){
          if(c.id===highCard.id||c.joker)continue;
          if(!afterSingleIds.has(c.id))continue;
          if(strength(c.rank,G.revolution)>=highPower)continue;

          // 現在の場に、その解放カード自体を単品として合法的に出せる場合だけ候補にする。
          // ここではまとまり崩しフィルタ前の合法手一覧を使う。
          const playableNow=legalBeforePartitionFilter.some(a=>
            a.type==='single'&&
            a.cards.length===1&&
            a.cards[0].id===c.id
          );
          if(playableNow)candidates.push(c);
        }
      }
    }

    // 重複を除去。
    const seen=new Set();
    return candidates.filter(c=>{
      if(seen.has(c.id))return false;
      seen.add(c.id);
      return true;
    });
  }

  const freedWeakSinglesNow=hypotheticallyFreedWeakSingles();
  const freedWeakIdsNow=new Set(freedWeakSinglesNow.map(c=>c.id));

  // 【まとまり判定】組数は「その手を出す前の現在手札」の最適分割で判定する。
  // 現在手札の最適分割に含まれるまとまりを部分的に崩す手は避ける。
  // そのような手しかない場合は、後段でパス可能ならパスする。
  // 確定上がりルートは絶対条件なのでこの判定より優先する。
  let mustPassForGroupIncrease=false;
  if(legal.length&&!certainFinishMoves.size){
    const partitionBundleKeys=new Set(
      optimalPartition.bundles
        .map(x=>x.cards.map(c=>c.id).sort().join('|'))
    );
    const partitionSingleIds=new Set(partitionSingles.map(c=>c.id));

    const preservesCurrentPartition=a=>{
      // 現在の最適分割で単品になっているカードだけを出す手は分割を崩さない。
      if(a.cards.every(c=>partitionSingleIds.has(c.id)))return true;

      // 現在の最適分割の「まとまり」1組を丸ごと出す手も分割を崩さない。
      const k=a.cards.map(c=>c.id).sort().join('|');
      if(partitionBundleKeys.has(k))return true;

      // 現在選ばれた1つの分割には含まれていなくても、
      // 同じ最小組数・同じ最小単品数になる別の最適分割で1組として成立するなら、
      // 「組数が増える出し方」ではないので残す。
      if(cpuMoveFitsAnyEqualOptimalPartition(
        p.hand,G.revolution,a,currentOptimalPartition
      ))return true;

      // 相手のJoker単騎には、出し手の残り手札が8枚以下の時だけ、
      // まとまりを崩してでもスペード3を出してよい。
      if(mustUseS3AgainstJoker&&isSingleS3(a))return true;

      // A/2（革命中は4/3）を仮にまとまりから外すことで解放される
      // より弱い単品は、まとまり崩しフィルタの例外として残す。
      if(
        a.type==='single'&&
        a.cards.length===1&&
        freedWeakIdsNow.has(a.cards[0].id)
      )return true;

      // 空場でない時の例外：
      // 通常2／革命3はまとまりから崩してよい。
      // 相手が通常2／革命3を持っていないことが確定している場合は、
      // 通常A／革命4も崩してよい。組数が増えても許可する。
      if(!isLead&&a.cards.length>0&&a.cards.every(canBreakProtectedRankOnFollow))return true;

      return false;
    };

    const nonIncreasing=legal.filter(preservesCurrentPartition);
    if(nonIncreasing.length){
      legal=nonIncreasing;
    }else{
      mustPassForGroupIncrease=true;
    }
  }

  // 現在カードを出した相手がスペード3を持っている可能性が残るかをCPU記憶から判定する。
  
  function opponentJustPassedOnMySingle(currentStrongCard){
    if(!isLead||!currentStrongCard)return false;
    const ctx=G.lastClearPassContext;
    if(!ctx||ctx.leader!==i||ctx.type!=='single')return false;

    // 縛りが起きていたトリックでのパスは、数字の強さだけを根拠にできないため除外する。
    if(ctx.locked)return false;

    // 直前に相手がパスした単品が、現在持っている強いカード以下である場合だけ、
    // そのパスを「強い方から出す」根拠に使う。
    if(strength(ctx.rank,G.revolution)>strength(currentStrongCard.rank,G.revolution))return false;

    return (ctx.passers||[]).some(j=>j!==i);
  }


  function handAllPairs(hand,revolution=G.revolution){
    const part=optimalHandPartition(hand,revolution);
    return part.groupCount>0&&part.singleCount===0&&
      part.bundles.every(x=>x.type==='group'&&x.n===2);
  }
  function isPairMove(a){return a.type==='group'&&a.n===2}
  function moveBreaksProtectedBundle(a){
    const moveIds=new Set(a.cards.map(c=>c.id));
    for(const bundle of protectedBundles){
      let overlap=0;
      for(const id of bundle)if(moveIds.has(id))overlap++;
      if(overlap>0&&overlap<bundle.size)return true;
    }
    return false;
  }
  function moveCreatesLock(a){
    if(!G.pile||a.cards.some(c=>c.joker))return false;
    const prev=suitSignature(G.pile);
    const now=suitSignature(a);
    return !!(prev&&now&&prev===now);
  }
  function preferredScore(a){
    if(!a)return Infinity;
    let s=0;const natural=a.cards.filter(c=>!c.joker),single=isSingle(a),certain=certainFinishMoves.has(key(a));
    const r=single&&!a.cards[0].joker?a.cards[0].rank:null;

    // 富豪残り3枚以下への平民/貧民の出し方。
    // 確実上がりルートは常にこの条件より優先する。
    if(richThreeStrategy&&!certain){
      const richWillPass=cpuMoveCertainlyUnanswerableByPlayer(i,a,richThreeStrategy.rich,G.revolution);

      // 富豪が8を持たないことが確定、または既に8を出したことがある：
      // 原則ペアを出さない。ただし富豪の確定パス手は許可。
      if(richThreeStrategy.avoidPair&&a.type==='group'&&a.n===2&&!richWillPass)s+=4500;

      // 富豪が8を確実に持つ、または8の所在不明かつ未出：
      // 通常時の8より弱い単品を原則出さない。富豪の確定パス手は許可。
      // 革命中は strength() により「8より弱い」を革命状態の強弱で判定する。
      if(richThreeStrategy.avoidWeakSingle&&single&&!a.cards[0].joker&&
         strength(a.cards[0].rank,G.revolution)<strength(8,G.revolution)&&!richWillPass){
        s+=4500;
      }
    }

    // 【優先】相手がJoker単騎を出し、その出し手の残り手札が8枚以下なら、
    // まとまりを崩してでもスペード3を優先する。
    // 上位の絶対条件でスペ3返しが禁止される場合は、その絶対条件を優先する。
    if(mustUseS3AgainstJoker){
      if(isSingleS3(a))s-=5000;
      else s+=1500;
    }

    // 【優先】場札がペアの時、Jokerを使わずに出せる合法なペアが1つでもあるなら、
    // Jokerを含むペアより、Jokerを使わないペアを優先する。
    if(G.pile&&isPairMove(G.pile)&&isPairMove(a)){
      const hasNaturalPair=legal.some(x=>isPairMove(x)&&!x.cards.some(c=>c.joker));
      if(hasNaturalPair){
        if(a.cards.some(c=>c.joker))s+=4200;
        else s-=1200;
      }
    }

    // 【優先】まとまりを崩すしか出し方がないときは、縛りを成立させる出し方を優先する。
    // まとまりを崩さない合法手が1つでもある場合、この条件は適用しない。
    const onlyBundleBreakingMoves=
      legal.length>0&&legal.every(x=>moveBreaksProtectedBundle(x));

    if(onlyBundleBreakingMoves&&moveBreaksProtectedBundle(a)){
      if(moveCreatesLock(a)){
        s-=1800;
      }else{
        const breakingAlternatives=legal.filter(x=>moveBreaksProtectedBundle(x));
        if(breakingAlternatives.some(moveCreatesLock))s+=1800;
      }
    }

    // 【優先・最強モード限定】富豪がまだ上がっていない時、
    // 平民または貧民の残り手札がすべてペアなら、平民と貧民は空場でペアを優先する。
    // 場札が単品で、自分が8を合法的に出せる場合は8を優先する。
    if(CPU_MODE==='strong'&&richStillPlaying&&(p.role==='平民'||p.role==='貧民')){
      const common=G.players.find(x=>!x.finished&&x.role==='平民');
      const poor=G.players.find(x=>!x.finished&&x.role==='貧民');
      const eitherAllPairs=
        !!((common&&handAllPairs(common.hand,G.revolution))||(poor&&handAllPairs(poor.hand,G.revolution)));

      if(eitherAllPairs){
        if(isLead){
          if(isPairMove(a))s-=4200;
          else s+=1800;
        }else if(G.pile&&G.pile.type==='single'){
          const isSingleEightMove=isSingle(a)&&!a.cards[0].joker&&a.cards[0].rank===8;
          const hasLegalSingleEight=legal.some(x=>isSingle(x)&&!x.cards[0].joker&&x.cards[0].rank===8);
          if(hasLegalSingleEight){
            if(isSingleEightMove)s-=5200;
            else s+=2200;
          }
        }
      }
    }

    // 【優先・最強モード限定】平民と貧民の残り手札がともにすべてペアの場合、
    // 富豪は空場でペアを出さない。富豪自身も全てペアなら、最弱ペアを崩して単品で出す。
    if(CPU_MODE==='strong'&&richStillPlaying&&p.role==='富豪'&&isLead){
      const common=G.players.find(x=>!x.finished&&x.role==='平民');
      const poor=G.players.find(x=>!x.finished&&x.role==='貧民');
      const bothOpponentsAllPairs=!!(common&&poor&&
        handAllPairs(common.hand,G.revolution)&&handAllPairs(poor.hand,G.revolution));
      if(bothOpponentsAllPairs){
        const selfAllPairs=handAllPairs(p.hand,G.revolution);
        if(selfAllPairs){
          const pairRanks=[...new Set(p.hand.filter(c=>!c.joker).map(c=>c.rank)
            .filter(r=>p.hand.filter(c=>!c.joker&&c.rank===r).length>=2))]
            .sort((x,y)=>strength(x,G.revolution)-strength(y,G.revolution));
          const weakestPairRank=pairRanks[0];
          const isWeakestPairSingle=isSingle(a)&&!a.cards[0].joker&&a.cards[0].rank===weakestPairRank;
          if(isWeakestPairSingle)s-=6500;
          else if(isPairMove(a))s+=6500;
          else s+=2200;
        }else{
          if(isPairMove(a))s+=5200;
          else s-=1200;
        }
      }
    }

    // 【優先・最強モード限定】富豪の手札がすべてペアの場合、
    // 平民・貧民は空場でペアを出さない。
    // 場札がペアで、自分が8を2枚以上持つ場合は8ペアを優先する。
    // ただし平民または貧民の手札がすべてペアの場合は適用しない。
    if(CPU_MODE==='strong'&&richStillPlaying&&(p.role==='平民'||p.role==='貧民')){
      const rich=G.players[richIndex];
      const common=G.players.find(x=>!x.finished&&x.role==='平民');
      const poor=G.players.find(x=>!x.finished&&x.role==='貧民');
      const eitherCommonPoorAllPairs=
        !!((common&&handAllPairs(common.hand,G.revolution))||(poor&&handAllPairs(poor.hand,G.revolution)));

      if(rich&&handAllPairs(rich.hand,G.revolution)&&!eitherCommonPoorAllPairs){
        if(isLead&&isPairMove(a))s+=5000;

        if(G.pile&&isPairMove(G.pile)){
          const eightCount=p.hand.filter(c=>!c.joker&&c.rank===8).length;
          const isEightPair=isPairMove(a)&&a.rank===8;
          if(eightCount>=2){
            if(isEightPair)s-=5000;
            else s+=1800;
          }
        }
      }
    }

    // 【優先】1人が上がって1対1になり、相手の残り手札がすべてペアなら
    // 自分はペアを出さない。場札がペアで8を2枚以上持つ場合は8ペアを優先し、
    // 場を流した後はペア以外を優先する。
    // 最強モードでは実手札、通常モードでは既知情報から「全てペア」と確定できる場合に適用する。
    if(active.length===2){
      const opp=active.find(o=>o.j!==i);
      let opponentAllPairs=false;
      if(opp){
        if(CPU_MODE==='strong'){
          opponentAllPairs=handAllPairs(opp.x.hand,G.revolution);
        }else{
          // 通常モードでは相手の実手札を透視しない。
          // 相手の残り札がすべてCPUに確定している場合だけ全ペア判定を行う。
          const knownHand=cpuKnownOpponentHand(i,opp.j);
          if(knownHand)opponentAllPairs=handAllPairs(knownHand,G.revolution);
        }
      }
      if(opp&&opponentAllPairs){
        if(isLead&&isPairMove(a))s+=5000;
        if(G.pile&&isPairMove(G.pile)){
          const eightCount=p.hand.filter(c=>!c.joker&&c.rank===8).length;
          const isEightPair=isPairMove(a)&&a.rank===8;
          if(eightCount>=2){
            if(isEightPair)s-=5000;
            else if(isPairMove(a))s+=2500;
          }
        }
      }
    }

    // 【優先】2/A（革命中は3/4）を仮にまとまりから外すことで
    // より弱いカードが現在単品として出せるようになるなら、その弱いカードを先に出す。
    if(!certain&&freedWeakSinglesNow.length){
      const weakestFreedPower=Math.min(
        ...freedWeakSinglesNow.map(c=>strength(c.rank,G.revolution))
      );

      const isFreedWeakSingle=
        single&&
        !a.cards[0].joker&&
        freedWeakIdsNow.has(a.cards[0].id)&&
        strength(a.cards[0].rank,G.revolution)===weakestFreedPower;

      const highRank=G.revolution?3:15;
      const lowerHighRank=G.revolution?4:14;
      const isBreakHighSingle=
        single&&
        !a.cards[0].joker&&
        (a.cards[0].rank===highRank||a.cards[0].rank===lowerHighRank);

      if(isFreedWeakSingle)s-=2600;
      else if(isBreakHighSingle)s+=1200;
    }

    // 0) ペア・トリオ・階段のまとまりを崩す手を避ける。
    if(!certain&&!(mustUseS3AgainstJoker&&isSingleS3(a)))s+=bundleBreakPenalty(a);

    // 【優先】ペアが4組以上ある場合、通常時は3のペアを出さない。
    // 革命中は3ではなく2のペアを出さない。
    if(!certain){
      const pairBundles=optimalPartition.bundles.filter(x=>
        x.type==='group'&&x.n===2&&!x.cards.some(c=>c.joker)
      );
      const avoidedPairRank=G.revolution?15:3;
      if(
        pairBundles.length>=4&&
        a.type==='group'&&
        a.n===2&&
        a.rank===avoidedPairRank&&
        !a.cards.some(c=>c.joker)
      ){
        s+=3000;
      }
    }

    // 0.5) 残り手札が3組以上で、全て8以外のペアで構成されている場合、
    // 空場では最弱のペアを出さない。
    if(isLead&&!certain){
      const bundles=optimalPartition.bundles;
      const allPairs=
        optimalPartition.groupCount>=3&&
        optimalPartition.singleCount===0&&
        bundles.length===optimalPartition.groupCount&&
        bundles.every(x=>
          x.type==='group'&&
          x.n===2&&
          x.rank!==8&&
          !x.cards.some(c=>c.joker)
        );

      if(allPairs){
        const weakestPairPower=Math.min(...bundles.map(x=>strength(x.rank,G.revolution)));
        if(a.type==='group'&&a.n===2&&strength(a.rank,G.revolution)===weakestPairPower)s+=3000;
      }
    }

    // 0.6) 空場で、残り手札がちょうどペア3組なら最弱のペアを出さない。
    if(isLead&&!certain&&optimalPartition.groupCount===3&&optimalPartition.singleCount===0){
      const pairs=optimalPartition.bundles.filter(x=>x.type==='group'&&x.n===2);
      if(pairs.length===3){
        const weakestPower=Math.min(...pairs.map(x=>strength(x.rank,G.revolution)));
        if(a.type==='group'&&a.n===2&&strength(a.rank,G.revolution)===weakestPower)s+=2200;
      }
    }

    // 0.7) 残り手札がペア2組で親の場合：
    // 原則弱いペアから。強いペアより強いペアを相手が確実に持たない場合、
    // または直前に「現在の強いペア以下」のペアへ相手がパスし、
    // そのトリックで縛りが起きていなかった場合は強いペアから出す。
    if(isLead&&!certain&&optimalPartition.groupCount===2&&optimalPartition.singleCount===0){
      const pairs=optimalPartition.bundles.filter(x=>x.type==='group'&&x.n===2);
      if(pairs.length===2&&a.type==='group'&&a.n===2){
        const ordered=[...pairs].sort((x,y)=>strength(x.rank,G.revolution)-strength(y.rank,G.revolution));
        const weakPair=ordered[0],strongPair=ordered[1];

        const opponentCanHaveStrongerPair=(()=>{
          if(CPU_MODE==='strong'){
            const threshold=strength(strongPair.rank,G.revolution);
            return G.players.some((op,j)=>{
              if(j===i||op.finished)return false;

              const counts={};
              for(const c of op.hand){
                if(!c.joker)counts[c.rank]=(counts[c.rank]||0)+1;
              }
              const hasJoker=op.hand.some(c=>c.joker);

              return RANKS.some(rk=>{
                if(strength(rk,G.revolution)<=threshold)return false;

                const naturalCount=counts[rk]||0;

                // 同ランク2枚を持っている場合は当然強いペアを作れる。
                if(naturalCount>=2)return true;

                // 同ランクの単品1枚＋Jokerでも、そのランクのペアを作れる。
                if(naturalCount>=1&&hasJoker)return true;

                return false;
              });
            });
          }

          // 通常モードでも、既知情報から
          // 「同ランク2枚」または「同ランク1枚＋Joker」の可能性が残るなら
          // 強いペアを持ち得ると保守的に判定する。
          const mem=cpuMemory(i);
          const unavailable=new Set([...mem.current,...mem.played]);
          if(mem.blindId)unavailable.add(mem.blindId);

          const jokerUnavailable=
            unavailable.has('JK')||
            G.jokerPlayed===true;

          for(const rk of RANKS){
            if(strength(rk,G.revolution)<=strength(strongPair.rank,G.revolution))continue;

            const availableNaturals=SUITS
              .map(([s])=>`${s}${rk}`)
              .filter(id=>!unavailable.has(id))
              .length;

            if(availableNaturals>=2)return true;
            if(availableNaturals>=1&&!jokerUnavailable)return true;
          }
          return false;
        })();

        const ctx=G.lastClearPassContext;
        const opponentPassedOnMyPair=
          !!ctx&&
          ctx.leader===i&&
          ctx.type==='group'&&
          ctx.n===2&&
          !ctx.locked&&
          (ctx.passers||[]).some(j=>j!==i)&&
          // 直前にパスされたペアが、現在残っている強いペア以下の強さであり、
          // そのトリックで縛りが起きていなかった場合だけ根拠として扱う。
          strength(ctx.rank,G.revolution)<=strength(strongPair.rank,G.revolution);

        const preferStrong=!opponentCanHaveStrongerPair||opponentPassedOnMyPair;
        const target=preferStrong?strongPair:weakPair;
        if(a.rank===target.rank)s-=1000;
        else s+=1000;
      }
    }

    // 1) 現在出せるカードの中で、3より強く、最適分割上のまとまりに含まれていない単品は、
    // ゲーム上もっとも弱い数字から出す。革命中は3ではなく2を基準にする。
    // ただし空場で、最適分割上の単品が通常時は3・8・2、革命中は2・8・3だけで構成されている場合は、
    // 単品以外の合法手を優先する。通常時のスペード3にはこの回避条件を適用しない。
    const isolatedSingleIds=new Set(partitionSingles.filter(c=>!c.joker).map(c=>c.id));
      const playableIsolatedSingles=legal.filter(x=>
        isSingle(x)&&
        !x.cards[0].joker&&
        isolatedSingleIds.has(x.cards[0].id)
      );

      const playableIsolatedRanks=[...new Set(playableIsolatedSingles.map(x=>x.cards[0].rank))]
        .filter(x=>G.revolution ? x<15 : x>3);

      if(single&&!a.cards[0].joker&&playableIsolatedRanks.length){
        const weakestPlayableIsolated=
          G.revolution
            ?Math.max(...playableIsolatedRanks)
            :Math.min(...playableIsolatedRanks);

        if(
          r===weakestPlayableIsolated&&
          isolatedSingleIds.has(a.cards[0].id)
        )s-=700;
      }

      if(isLead){
        const naturalSingles=partitionSingles.filter(c=>!c.joker);
        const allowedRanks=G.revolution?new Set([15,8,3]):new Set([3,8,15]);
        const onlySpecialSingles=
          naturalSingles.length>0&&
          naturalSingles.every(c=>allowedRanks.has(c.rank));
        const hasLegalNonSingle=legal.some(x=>!isSingle(x));

        if(onlySpecialSingles&&hasLegalNonSingle&&single&&!a.cards[0].joker){
          const c=a.cards[0];
          const exemptSpade3=!G.revolution&&c.id==='S3';
          const targetSingle=G.revolution
            ?(c.rank===15||c.rank===8||c.rank===3)
            :(c.rank===3||c.rank===8||c.rank===15);

          if(targetSingle&&!exemptSpade3)s+=4200;
        }
      }

    // 1.1) 空場で、最適分割の結果が3枚以上すべて単品なら、
    // ゲーム上の強さで最弱のカードは出さない。
    if(isLead&&p.hand.length>=3&&single){
      const allSingles=optimalPartition.bundles.length===0&&partitionSingles.length===p.hand.length;
      if(allSingles){
        const naturalSingles=partitionSingles.filter(c=>!c.joker);
        if(naturalSingles.length){
          const weakest=Math.min(...naturalSingles.map(c=>strength(c.rank,G.revolution)));
          if(!a.cards[0].joker&&strength(a.cards[0].rank,G.revolution)===weakest)s+=900;
        }
      }
    }

    // 1.25) 空場でないとき、最適分割上で指定ランク以外の単品がない場合は、
    // そのランクを単品で出してよい。通常時は2、革命中は3に適用する。
    if(!isLead&&single&&!a.cards[0].joker){
      const freerank=G.revolution?3:15;
      const otherSingleExists=partitionSingles
        .some(c=>!c.joker&&c.rank!==freerank);
      if(r===freerank&&!otherSingleExists)s-=500;
    }

    // 1.3) 相手の場札に出せる単品が通常時Aと2だけで、2を複数枚持っていない場合は2を優先する。
    // ただし、パスしていない相手が2を持っていないことが確定しているならAを優先する。
    // 革命中は2→3、A→4として同様に判定する。
    if(G.pile&&G.pile.type==='single'&&!certain){
      const highRank=G.revolution?3:15; // 通常2、革命3
      const lowerRank=G.revolution?4:14; // 通常A、革命4
      const legalNaturalSingles=legal.filter(x=>isSingle(x)&&!x.cards[0].joker);
      const legalRanks=[...new Set(legalNaturalSingles.map(x=>x.cards[0].rank))];
      const exactlyTwoRanks=legalRanks.length===2&&legalRanks.includes(highRank)&&legalRanks.includes(lowerRank);
      const highCount=rankCounts[highRank]||0;
      if(exactlyTwoRanks&&highCount<2){
        const chooseLower=unpassedOpponentsCertainlyLackRank(highRank);
        if(single&&!a.cards[0].joker){
          if(chooseLower){
            if(r===lowerRank)s-=3000;
            else if(r===highRank)s+=1800;
          }else{
            if(r===highRank)s-=3000;
            else if(r===lowerRank)s+=1800;
          }
        }
      }
    }

    // 1.35) 残り手札の最適分割がちょうど3組で、
    // 「8」「8より弱い単品1枚」「単品以外1組」の構成なら、
    // 8より弱いその単品は出さず、単品以外を優先する。
    {
      const eightStrength=strength(8,G.revolution);
      const weakSingles=partitionSingles.filter(c=>!c.joker&&strength(c.rank,G.revolution)<eightStrength);
      const eightSingles=partitionSingles.filter(c=>!c.joker&&c.rank===8);
      const nonSingleBundles=optimalPartition.bundles.filter(x=>x.type!=='single');
      const exactlyThreeGroups=
        optimalPartition.groupCount===3 &&
        partitionSingles.length===2 &&
        eightSingles.length===1 &&
        weakSingles.length===1 &&
        nonSingleBundles.length===1;

      if(exactlyThreeGroups&&!certain){
        const weakId=weakSingles[0].id;
        if(single&&a.cards[0].id===weakId)s+=1800;
        else if(a.type!=='single')s-=1200;
      }
    }

    // 1.4) 革命できる手では、その革命ランクよりゲーム上弱い札と強い札を比較する。
    // 弱い札の方が多い場合は革命を優先し、強い札の方が多い場合は革命を避ける。
    if(a.revolution&&!certain){
      let weaker=0,stronger=0;
      const revolutionPower=strength(a.rank,G.revolution);
      for(const c of p.hand){
        if(c.joker)continue;
        const power=strength(c.rank,G.revolution);
        if(power<revolutionPower)weaker++;
        else if(power>revolutionPower)stronger++;
      }
      if(weaker>stronger)s-=1200;
      else if(stronger>weaker)s+=1800;
    }

    // 1.5) 空場で残り手札が5組以上なら、強い手を温存する。
    // 強弱はゲーム上の強さで判定する。通常時は3が最弱、革命中は2が最弱。
    // 単騎は通常時A・2／革命中4・3を強い側として温存する。
    // 同ランク組札の強い手判定は従来どおり通常時K以上／革命中5以下。
    // 階段は3枚以上をすべて強い手とし、長いほどさらに強いものとして温存する。
    if(isLead&&remainingGroups>=5&&!certain){
      let strongLeadPenalty=0;
      if(a.type==='single'){
        const c=a.cards[0];
        if(c.joker) strongLeadPenalty=1800;
        else if(!G.revolution&&c.rank>=14) strongLeadPenalty=1800; // 通常時：A・2
        else if(G.revolution&&c.rank<=4) strongLeadPenalty=1800; // 革命中：4・3
      }else if(a.type==='straight'){
        // 3枚=1800、4枚=2200、5枚=2600…と長いほど温存を強める。
        strongLeadPenalty=1800+Math.max(0,a.cards.length-3)*400;
      }else{
        const rs=a.cards.filter(c=>!c.joker).map(c=>c.rank);
        if(a.cards.some(c=>c.joker)) strongLeadPenalty=1800;
        else if(rs.length){
          const strongGroup=!G.revolution?Math.max(...rs)>=13:Math.min(...rs)<=5;
          if(strongGroup)strongLeadPenalty=1800;
        }
      }
      s+=strongLeadPenalty;
    }

    // 2) 8より強く、最適分割でまとまりに含まれていない単品がある場合、
    // 相手の単品に対して8を単品で出すのを避ける。
    const strongerIsolatedSingleExists=partitionSingles.some(c=>
      !c.joker&&
      strength(c.rank,G.revolution)>strength(8,G.revolution)
    );
    if(
      G.pile&&
      G.pile.type==='single'&&
      strongerIsolatedSingleExists&&
      single&&
      r===8
    )s+=900;

    // 3) 【高優先】空場で、単騎候補が通常は8・A以上・スペード3、革命中は8・4以下しかない場合は組札を強く優先。
    if(isLead){
      const naturalSingles=legal.filter(x=>isSingle(x)&&!x.cards[0].joker);
      const isRestrictedSingle=x=>{
        const c=x.cards[0];
        if(G.revolution)return c.rank===8||c.rank<=4;
        return c.rank===8||c.rank>=14||c.id==='S3';
      };
      const onlyRestricted=naturalSingles.length>0&&naturalSingles.every(isRestrictedSingle);
      if(onlyRestricted&&legal.some(x=>x.type!=='single'))s+=single?3200:-1200;
    }

    // 【優先】Jokerとスペード3を両方持ち、スペード3が最適分割上どのまとまりにも含まれず、
    // 手札が5組以下になったらスペード3単騎を優先する。革命中は適用しない。
    if(!certain&&!G.revolution&&optimalPartition.groupCount<=5&&hasJoker&&hasS3){
      const s3IsIsolated=optimalPartition.singles.some(c=>c.id==='S3');
      if(s3IsIsolated){
        if(isSingleS3(a))s-=5200;
        else s+=2600;
      }
    }

    // 【優先】通常時・空場で、残り手札が
    // 「スペード3、3以外の単品、Joker」の3枚であるとき、
    // まとまりを解除してでもスペード3単騎から出す。
    // 革命中は適用しない。
    if(!certain&&!G.revolution&&isLead&&p.hand.length===3){
      const s3=p.hand.find(c=>c.id==='S3');
      const joker=p.hand.find(c=>c.joker);
      const otherCards=p.hand.filter(c=>!c.joker&&c.id!=='S3');

      const exactShape=
        !!s3&&
        !!joker&&
        otherCards.length===1&&
        otherCards[0].rank!==3;

      if(exactShape){
        // まとまり保持ペナルティより強く優先し、♠3単騎を選ぶ。
        if(isSingleS3(a))s-=5000;
        else s+=2500;
      }
    }

    // 3.5) 【高優先】ジョーカー未出現・自分もジョーカーなしならスペ3単騎を強く避ける。
    // 貧民が交換で富豪へ非ジョーカーを渡したことを知っている場合は例外。
    if(!certain&&!G.jokerPlayed&&!hasJoker&&hasS3&&!cpuPoorMayUseS3BeforeJoker(i)&&isSingleS3(a))s+=3600;

    // 4-5) A回避：場札が単品で、自分以外の誰かが2を出す可能性があるならAを強く避ける。
    if(shouldAvoidAceMove(a))s+=3000;

    // 6) 自分が残り2枚・異なる数字・親：原則弱い方。
    // 強い方より強いカードを相手が確実に持たない場合、または直前のターンで相手が
    // 現在の強いカード以下の単品にパスし、そのトリックで縛りが起きていなかった場合は、
    // 強い方から出す。
    if(isLead&&p.hand.length===2){
      const [c1,c2]=p.hand;
      if(c1.joker||c2.joker||c1.rank!==c2.rank){
        const ordered=[c1,c2].sort((x,y)=>strength(x.rank,G.revolution)-strength(y.rank,G.revolution));
        const weak=ordered[0],strong=ordered[1];
        const preferStrong=cpuCanProveNoOpponentStronger(i,strong)||opponentJustPassedOnMySingle(strong);
        const target=preferStrong?strong:weak;
        if(single)s+=a.cards[0].id===target.id?-900:900;
      }
    }

    // 7) 全員平民・親・相手残り1枚：組札優先。単騎しかなければ最弱を避ける（自分残り2枚は例外）。
    if(allCommon&&isLead&&G.players.some((x,j)=>j!==i&&!x.finished&&x.hand.length===1)){
      const groups=legal.some(x=>x.type!=='single');
      if(groups)s+=single?900:-1200;
      else if(single&&p.hand.length!==2){
        const singles=legal.filter(isSingle),weak=Math.min(...singles.map(x=>strength(x.rank,G.revolution)));
        if(strength(a.rank,G.revolution)===weak)s+=700;
      }
    }

    // 8) 全員平民・相手残り3枚以下で8脅威：8より弱い単騎を避ける。確実上がり手は例外。
    if(allCommon&&!certain){
      const threat=targets3.some(o=>o.k.certainlyHasEight||(o.k.uncertain&&!o.k.targetPlayedEight));
      if(threat&&single&&strength(a.rank,G.revolution)<strength(8,G.revolution))s+=3000;
    }

    // 9) 富豪未上がり・平民/貧民の対象残り3枚以下で8なし確定または8既出：もう一人の平民/貧民はペア優先。
    if(richStillPlaying&&(p.role==='平民'||p.role==='貧民')&&!certain){
      const safe=commonPoorTargets3.some(o=>o.j!==i&&(o.k.certainlyNoEight||o.k.targetPlayedEight));
      if(safe){const pair=a.type==='group'&&a.n===2;s+=pair?-3000:1800}
    }

    // 10) 同条件で8脅威：もう一人の平民/貧民は8より弱い単騎を優先。
    if(richStillPlaying&&(p.role==='平民'||p.role==='貧民')&&!certain){
      const threat=commonPoorTargets3.some(o=>o.j!==i&&(o.k.certainlyHasEight||(o.k.uncertain&&!o.k.targetPlayedEight)));
      if(threat){const weakSingle=single&&strength(a.rank,G.revolution)<strength(8,G.revolution);s+=weakSingle?-3000:1800}
    }

    // 11) 富豪：非富豪の残り3枚以下。8なし/既出ならペア回避、8脅威なら8より弱い単騎回避。確実上がり手は例外。
    if(p.role==='富豪'&&!certain){
      const safe=nonRichTargets3.some(o=>o.k.certainlyNoEight||o.k.targetPlayedEight);
      const threat=nonRichTargets3.some(o=>o.k.certainlyHasEight||(o.k.uncertain&&!o.k.targetPlayedEight));
      if(safe&&a.type==='group'&&a.n===2)s+=3000;
      if(threat&&single&&strength(a.rank,G.revolution)<strength(8,G.revolution))s+=3000;
    }
    return s;
  }

  // 最終比較は、これまで指定された優先条件（preferredScore）のみを使用する。
  // 同点の場合：
  // ・数字の差が3以内、かつ通常時は2以外、革命中は3以外で縛りを成立させられるなら、その手を優先する。
  // ・通常時の2、革命中の3でしか縛れない手は縛り優先の対象外。
  // ・それ以外はゲーム上弱い数字を優先する。
  // ・それでも同じなら候補生成順。
  const tieCreatesLock=a=>{
    if(!G.pile||a.cards.some(c=>c.joker))return false;

    // 縛り優先から除外する最強ランク。
    // 通常時は2、革命中は3。
    const excludedLockRank=G.revolution?3:15;
    if(a.rank===excludedLockRank)return false;

    const prevSig=suitSignature(G.pile);
    const nowSig=suitSignature(a);
    if(!(prevSig&&nowSig&&prevSig===nowSig))return false;

    // 【追加条件】
    // そのスートで、今出す数字より強い「単品」を自分が持っている時だけ
    // 同スコア時の「縛り優先」を有効にする。
    //
    // ここでいう単品は、現在の最適なまとまり判定で singles に分類されたカード。
    // 単騎の縛りを想定した条件なので、複数枚出しによる縛りにはこの優先を付けない。
    if(a.type!=='single'||a.cards.length!==1)return false;
    const suit=a.cards[0].suit;
    if(!suit)return false;

    return currentOptimalPartition.singles.some(c=>
      !c.joker &&
      c.id!==a.cards[0].id &&
      c.suit===suit &&
      strength(c.rank,G.revolution)>strength(a.rank,G.revolution)
    );
  };
  const tieRankStrength=a=>strength(a.rank,G.revolution);

  legal=legal
    .map((a,idx)=>({
      a,
      idx,
      score:preferredScore(a),
      lock:tieCreatesLock(a)?0:1,
      rank:tieRankStrength(a)
    }))
    .sort((x,y)=>{
      const scoreDiff=x.score-y.score;
      if(scoreDiff)return scoreDiff;

      const rankGap=Math.abs(x.rank-y.rank);

      // 数字差3以内：2以外で縛れる手を優先。その後に弱い数字。
      if(rankGap<=3){
        const lockDiff=x.lock-y.lock;
        if(lockDiff)return lockDiff;
        const rankDiff=x.rank-y.rank;
        if(rankDiff)return rankDiff;
      }else{
        // 数字差4以上：弱い数字を優先。その後に縛り。
        const rankDiff=x.rank-y.rank;
        if(rankDiff)return rankDiff;
        const lockDiff=x.lock-y.lock;
        if(lockDiff)return lockDiff;
      }

      return x.idx-y.idx;
    })
    .map(x=>x.a);

  // 【優先】A回避条件が成立し、出せる手がそのAだけならパスする。
  // 空場では大富豪のルール上パス不可。また、確定上がりルートがある場合は絶対条件を優先して出す。
  // 1対1で相手残り3枚以下は最上位のパス禁止。安全な合法手がある限り、通常パス候補を作らない。
  const canPassAsAction=canPassAsActionEarly;
  // ここでも再探索せず、前段で証明済みの確実手だけを見る。
  const certainNow=legal.filter(a=>certainFinishMoves.has(moveKey(a)));

  // 【優先】残り手札が6組以上で、現在の場に出せる手がJokerを使うものしかない場合はパスする。
  // 空場・各種絶対パス禁止・確定上がりルートでは発動しない。
  if(remainingGroups>=6&&canPassAsAction&&!certainNow.length&&legal.length&&legal.every(a=>a.cards.some(c=>c.joker))){
    if(await cpuTryPass(i))return;
  }

  // 【まとまり判定】組数が増える手しか残っていない場合はパスする。
  // 空場や各種の絶対パス禁止局面では、パスせず合法手を出す。
  if(mustPassForGroupIncrease&&!mustUseS3AgainstJoker&&canPassAsAction&&!certainNow.length){
    if(await cpuTryPass(i))return;
  }

  if(canPassAsAction&&!certainNow.length&&legal.length&&legal.every(shouldAvoidAceMove)){
    if(await cpuTryPass(i))return;
  }

  // 【優先】残り2枚が異なる数字で、弱い方を合法的に出せない場合に限り、
  // 強い方を出しても相手が確実に返せるなら、通常時は2以外、革命中は3以外で
  // 縛りを起こせる手が現れるまではパスする。
  // 逆に、現在その強い方で許可された縛りを起こせるなら、その縛り手を一般的なパス評価より優先する。
  let twoCardLockMove=null;
  if(G.pile&&p.hand.length===2&&!headsUpOpponentAtThreeOrLess&&!mustNotPassForRichAtThreeOrLess&&!commonPoorAtThreeOrLess){
    const [c1,c2]=[...p.hand].sort((x,y)=>strength(x.rank,G.revolution)-strength(y.rank,G.revolution));
    if(c1.rank!==c2.rank){
      const weakCard=c1,strongCard=c2;
      const weakMoves=legal.filter(a=>isSingle(a)&&a.cards[0].id===weakCard.id);
      const weakCannotBePlayed=weakMoves.length===0;
      const strongMoves=legal.filter(a=>isSingle(a)&&a.cards[0].id===strongCard.id);
      const strongDefinitelyAnswerable=strongMoves.length>0&&strongMoves.every(a=>{
        const opponents=G.players.map((x,j)=>({x,j})).filter(o=>o.j!==i&&!o.x.finished&&!o.x.passed);
        return opponents.some(o=>{
          if(CPU_MODE==='strong')return cpuStrongModePlayerHasReply(o.j,a,G.revolution);
          // 通常モードは実手札を見ず、記憶情報から相手の残り手札を一意に特定でき、
          // その手札に合法な返しが存在すると証明できた場合だけ「確実に返せる」とする。
          return cpuNormalPlayerDefinitelyHasReply(i,o.j,a,G.revolution);
        });
      });
      const prevSig=G.pile?suitSignature(G.pile):null;
      const lockingStrongMoves=strongMoves.filter(a=>{
        if(a.cards.some(c=>c.joker))return false;
        const sig=suitSignature(a);
        return !!(sig&&prevSig&&sig===prevSig);
      });

      // 「通常時は2以外、革命中は3以外で縛りを起こせるまでパスする」。
      // 通常時の2、革命中の3で縛りが成立するだけでは待機を終了しない。
      const excludedLockRank=G.revolution?3:15;
      const nonTopRankLockingStrongMoves=lockingStrongMoves.filter(a=>
        !(a.type==='single'&&!a.cards[0].joker&&a.cards[0].rank===excludedLockRank)
      );
      const canCreateAllowedLockNow=nonTopRankLockingStrongMoves.length>0;

      if(weakCannotBePlayed&&strongDefinitelyAnswerable){
        if(canCreateAllowedLockNow){
          twoCardLockMove=nonTopRankLockingStrongMoves[0];
        }else if(canPassAsAction){
          if(await cpuTryPass(i))return;
        }
      }
    }
  }

  // 【優先】残り手札が3枚の異なる数字で、一番強いカードしか出せず、
  // その最強カードも相手に返される可能性がある場合はパスする。
  // 確実上がりルートは runCpu 前半で即時採用済みのため、ここでは競合しない。
  if(G.pile&&p.hand.length===3&&canPassAsActionEarly){
    const ranks=p.hand.map(c=>c.joker?16:c.rank);
    const allDifferent=new Set(ranks).size===3;

    if(allDifferent){
      const ordered=[...p.hand].sort(
        (x,y)=>strength(x.joker?16:x.rank,G.revolution)-strength(y.joker?16:y.rank,G.revolution)
      );
      const strongestCard=ordered[2];

      // 「出せる」は単品として現在の場に合法的に返せることを指す。
      const playableSingles=legal.filter(a=>isSingle(a));
      const strongestSingleMoves=playableSingles.filter(a=>a.cards[0].id===strongestCard.id);
      const onlyStrongestPlayable=
        strongestSingleMoves.length>0 &&
        playableSingles.every(a=>a.cards[0].id===strongestCard.id);

      if(onlyStrongestPlayable){
        const mayBeAnswered=strongestSingleMoves.some(a=>{
          if(CPU_MODE==='strong'){
            return G.players.some((x,j)=>
              j!==i&&!x.finished&&!x.passed&&cpuStrongModePlayerHasReply(j,a,G.revolution)
            );
          }

          // 通常モードでは、相手が返せないことを確定できない限り
          // 「返される可能性がある」とみなす。
          const opponents=G.players
            .map((x,j)=>({x,j}))
            .filter(o=>o.j!==i&&!o.x.finished&&!o.x.passed);
          return opponents.some(o=>!cpuMoveCertainlyUnanswerableByPlayer(i,a,o.j,G.revolution));
        });

        if(mayBeAnswered){
          if(await cpuTryPass(i))return;
        }
      }
    }
  }

  // 【優先】残り手札が
  // 「8より弱い単品」「単品ではないまとまり」「単品の2」の3組で、
  // 相手がJokerを持っている時は、単品ではないまとまりを出さない。
  // 他に出せる手がなければパスする。
  if(G.pile&&optimalPartition.groupCount===3){
    const isolatedNaturals=partitionSingles.filter(c=>!c.joker);
    const singleTwo=isolatedNaturals.filter(c=>c.rank===15);
    const weakSingles=isolatedNaturals.filter(c=>
      strength(c.rank,G.revolution)<strength(8,G.revolution)
    );
    const nonSingleBundles=optimalPartition.bundles.filter(x=>x.type!=='single');

    const exactThreeGroupShape=
      partitionSingles.length===2 &&
      singleTwo.length===1 &&
      weakSingles.length===1 &&
      nonSingleBundles.length===1;

    if(exactThreeGroupShape){
      let opponentHasJoker=false;

      if(CPU_MODE==='strong'){
        opponentHasJoker=G.players.some((x,j)=>
          j!==i&&!x.finished&&!x.passed&&x.hand.some(c=>c.joker)
        );
      }else{
        opponentHasJoker=G.players.some((x,j)=>{
          if(j===i||x.finished||x.passed)return false;
          const known=cpuKnownOpponentHand(i,j);
          return !!(known&&known.some(c=>c.joker));
        });
